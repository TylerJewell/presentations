<script>
/* lib/deck.js */
/* The deck: slides of click-advanced beats, built on the film's engine (../mock/lib).

   Each slide is a pure function of its own time t, exactly like a film scene: render(root) builds it
   once, at(t) sets every style for the instant t. A slide's beats are hold times on that timeline. A
   click plays t from the current hold to the next at real speed and stops there; going back jumps to
   the previous hold. Live parts (counters, rails, verdict streams) run on Mock's live clock, which this
   engine ties to the wall clock, so they keep moving while a beat holds.

   Modes (query string):
     (none)       the show: full window, letterboxed 1920x1080, keys and clicks advance
     presenter=1  the presenter view (lib/presenter.js), synced with the show over BroadcastChannel
     still=1      a thumbnail frame for the presenter view; it shows the hold it is sent by postMessage
     capture=1    the stage at 1:1 from the top-left corner, on a virtual clock, for the render script
     print=1      every beat's hold frame, one 1920x1080 page each, for a PDF backup */
(function () {
  const M = window.Mock;
  const W = 1920, H = 1080;
  const Q = new URLSearchParams(location.search);
  const MODE = Q.get('presenter') === '1' ? 'presenter' : Q.get('print') === '1' ? 'print' : Q.get('still') === '1' ? 'still' : 'show';
  const VIRTUAL = Q.get('capture') === '1' || MODE === 'print';
  const FADE_OUT = 0.32, FADE_IN = 0.5, CROSS = 0.8, DIP = 0.35;
  const WPM = 140;
  const CHANNEL = 'akka-talk';

  const defs = [];
  window.registerSlide = function (def) {
    for (const k of ['id', 'act', 'title', 'beats', 'render', 'at'])
      if (def[k] == null) throw new Error(`slide ${def.id || '?'}: missing "${k}"`);
    if (!def.beats.length) throw new Error(`slide ${def.id}: needs at least one beat`);
    let prev = -1;
    def.beats.forEach((b, i) => {
      if (!(b.t >= 0) || b.t < prev) throw new Error(`slide ${def.id}: beat ${i} hold ${b.t} is not after ${prev}`);
      prev = b.t;
    });
    defs.push(def);
  };

  /* ---------- the spoken script and its timing (shared with the presenter view and script.md) ---------- */
  const sayOf = (b) => (typeof b.say === 'function' ? b.say(window.TRENDS || {}) : b.say || '');
  const words = (s) => (s.trim() ? s.trim().split(/\s+/).length : 0);
  /** Planned seconds for a beat: the words at 140 a minute, never less than its animation plus a breath. */
  function plan(s, i) {
    const anim = s.beats[i].t - (i ? s.beats[i - 1].t : 0);
    return Math.max((words(sayOf(s.beats[i])) * 60) / WPM, anim + 1);
  }

  let slides = [];
  function order() {
    const want = window.TALK_ORDER || [];
    const byId = new Map(defs.map((s) => [s.id, s]));
    const out = [];
    want.forEach((id) => { if (byId.has(id)) { out.push(byId.get(id)); byId.delete(id); } else console.warn(`slide ${id} is in TALK_ORDER but was not registered`); });
    byId.forEach((s) => { console.warn(`slide ${s.id} is registered but not in TALK_ORDER; appended`); out.push(s); });
    return out;
  }
  function outline() {
    return slides.map((s, i) => ({
      index: i, id: s.id, act: s.act, title: s.title,
      beats: s.beats.map((b, k) => ({ t: b.t, label: b.label || '', say: sayOf(b), words: words(sayOf(b)), plan: plan(s, k) })),
    }));
  }

  /* ---------- state ---------- */
  let stage, black, blank, jump;
  let cur = 0, beat = 0;
  let anim = null;      /* { from, to, t0, dur } on the clock */
  let trans = null;     /* { kind, prev, t0 } */
  let dip = null;       /* { t0 } a short fade from black after a jump */
  let pinned = null;    /* a fixed t, for the render script's mid-beat frames */
  let blankOn = false, blankT0 = -10;
  let vclock = 0;
  const clock = () => (VIRTUAL ? vclock : performance.now() / 1000);
  const holdOf = (i, b) => slides[i].beats[b].t;
  const last = (i) => slides[i].beats.length - 1;

  function build() {
    slides = order();
    stage = document.getElementById('stage');
    slides.forEach((s, i) => {
      const root = document.createElement('div');
      root.className = 'scene';
      root.dataset.slide = s.id;
      stage.appendChild(root);
      s.root = root;
      s.index = i;
      try { s.render(root); } catch (e) { root.textContent = `slide ${s.id} failed to render: ${e.message}`; console.error(e); }
    });
    black = M.html('<div id="black"></div>');
    blank = M.html('<div id="blank"></div>');
    jump = M.html('<div id="jump"></div>');
    stage.append(black, blank, jump);
  }

  /* draw one slide at time t; the live clock reads the wall clock (or the virtual one) */
  function draw(s, t, opacity = 1, z = 1) {
    const live = VIRTUAL ? 400 + vclock : clock();
    /* M.abs(t) = PREROLL + begin + t, so with begin = live - t it reads PREROLL + live whatever t is */
    M.stageInfo.scene = { id: s.id, begin: live - t, cardDur: 0, captionZone: 'bottom-left' };
    s.root.style.opacity = opacity < 1 ? opacity.toFixed(3) : '';
    s.root.style.zIndex = z;
    try { s.at(t); } catch (e) { console.error(`slide ${s.id} at(${t.toFixed(2)}):`, e); }
  }

  let shown = new Set();
  function frame() {
    const now = clock();
    let t;
    if (pinned != null) t = pinned;
    else if (anim) {
      const p = anim.dur > 0 ? M.clamp((now - anim.t0) / anim.dur) : 1;
      t = M.lerp(anim.from, anim.to, p);
      if (p >= 1) { anim = null; changed(); }
    } else t = holdOf(cur, beat);

    const vis = [];
    let blk = 0;
    if (trans) {
      const e = now - trans.t0;
      const prev = slides[trans.prev];
      if (trans.kind === 'cross') {
        const p = M.ease.inOutCubic(M.clamp(e / CROSS));
        vis.push([prev, holdOf(trans.prev, last(trans.prev)), 1, 1], [slides[cur], t, p, 2]);
        if (e >= CROSS) trans = null;
      } else {
        if (e < FADE_OUT) { vis.push([prev, holdOf(trans.prev, last(trans.prev)), 1, 1]); blk = M.ease.inOutCubic(e / FADE_OUT); }
        else { vis.push([slides[cur], t, 1, 1]); blk = 1 - M.ease.inOutCubic(M.clamp((e - FADE_OUT) / FADE_IN)); }
        if (e >= FADE_OUT + FADE_IN) trans = null;
      }
    }
    if (!vis.length) vis.push([slides[cur], t, 1, 1]);
    if (dip) { const d = 1 - M.clamp((now - dip.t0) / DIP); blk = Math.max(blk, M.ease.inOutCubic(d)); if (d <= 0) dip = null; }

    const next = new Set(vis.map((v) => v[0]));
    shown.forEach((s) => { if (!next.has(s)) s.root.classList.remove('on'); });
    vis.forEach(([s, tt, o, z]) => { s.root.classList.add('on'); draw(s, tt, o, z); });
    shown = next;
    black.style.opacity = blk.toFixed(3);
    const bp = M.clamp((now - blankT0) / 0.3);
    blank.style.opacity = (blankOn ? bp : 1 - bp).toFixed(3);
    return t;
  }

  /* ---------- navigation ---------- */
  function startAnim(from, to, delay = 0) {
    anim = to > from ? { from, to, t0: clock() + delay, dur: to - from } : null;
  }
  function next() {
    pinned = null;
    if (anim || trans) { /* a click during an animation completes it */
      anim = null; trans = null; changed(); return;
    }
    if (beat < last(cur)) { startAnim(holdOf(cur, beat), holdOf(cur, beat + 1)); beat++; changed(); }
    else if (cur < slides.length - 1) enterSlide(cur + 1);
  }
  function enterSlide(i, kind) {
    const k = kind || slides[i].transition || 'black';
    trans = { kind: k, prev: cur, t0: clock() };
    cur = i; beat = 0;
    startAnim(0, holdOf(i, 0), k === 'black' ? FADE_OUT : 0);
    changed();
  }
  function snap(i, b, withDip = true) {
    pinned = null;
    const moved = i !== cur;
    cur = M.clamp(i, 0, slides.length - 1); beat = M.clamp(b, 0, last(cur));
    anim = null; trans = null;
    if (moved && withDip) dip = { t0: clock() };
    changed();
  }
  function prev() {
    if (beat > 0) snap(cur, beat - 1);
    else if (cur > 0) snap(cur - 1, last(cur - 1));
    else snap(0, 0);
  }
  function goto(i, b = 0, animate = true) {
    if (i < 0 || i >= slides.length) return;
    if (animate && b === 0 && i !== cur) { pinned = null; anim = null; enterSlide(i); }
    else snap(i, b);
  }
  function toggleBlank() { blankOn = !blankOn; blankT0 = clock(); changed(); }

  /* ---------- sync: the show broadcasts its state; the presenter view sends commands ---------- */
  const bc = 'BroadcastChannel' in window ? new BroadcastChannel(CHANNEL) : null;
  const seen = new Set();
  function send(msg) {
    msg.nonce = Math.random().toString(36).slice(2);
    if (bc) bc.postMessage(msg);
    try { localStorage.setItem(CHANNEL, JSON.stringify(msg)); } catch (e) { /* storage blocked: BroadcastChannel only */ }
  }
  function onMsg(fn) {
    const h = (m) => { if (!m || seen.has(m.nonce)) return; seen.add(m.nonce); fn(m); };
    if (bc) bc.onmessage = (e) => h(e.data);
    addEventListener('storage', (e) => { if (e.key === CHANNEL && e.newValue) { try { h(JSON.parse(e.newValue)); } catch (x) { /* ignore */ } } });
  }
  const stateMsg = () => ({ type: 'state', cur, beat, id: slides[cur] && slides[cur].id, animating: !!(anim || trans), blank: blankOn, at: Date.now() });

  /* ---------- the slide strip: a clickable outline along the bottom, for the presenter only ----------
     Hidden while presenting; it appears while the mouse is at the bottom edge, or stays up after G until G or
     Escape. It sits outside the stage, so it never appears in captures, prints or the presenter's thumbnails. */
  let nav = null, navPinned = false, navHide = 0;
  function buildNav() {
    const acts = window.TALK_ACTS || {};
    nav = M.html('<nav id="nav"></nav>');
    let act = null, group = null;
    slides.forEach((s, i) => {
      if (s.act !== act) {
        act = s.act;
        group = M.html(`<div class="grp"><div class="act">${(acts[act] && acts[act].name) || act}</div><div class="items"></div></div>`);
        nav.appendChild(group);
      }
      const b = M.html(`<button type="button" data-i="${i}" title="${s.title}">${s.title}</button>`);
      b.addEventListener('click', (e) => { e.stopPropagation(); goto(i); if (!navPinned) setNav(false); });
      group.querySelector('.items').appendChild(b);
    });
    document.body.appendChild(nav);
    addEventListener('mousemove', (e) => {
      if (navPinned || document.body.classList.contains('notes')) return;
      if (e.clientY > innerHeight - 40) { clearTimeout(navHide); setNav(true); }
      else if (nav.classList.contains('on') && !nav.contains(e.target)) { clearTimeout(navHide); navHide = setTimeout(() => setNav(false), 600); }
    });
  }
  function setNav(on) {
    if (!nav) return;
    nav.classList.toggle('on', on);
  }
  function markNav() {
    if (!nav) return;
    nav.querySelectorAll('button').forEach((b) => b.classList.toggle('cur', +b.dataset.i === cur));
  }

  /* ---------- the notes panel and the click counter, for presenting from one screen ----------
     Ctrl+Enter slides the talk track in from the right and the slide shrinks to fit beside it. The counter in the
     slide's bottom-right corner has one dot per click on this slide: grey for played, yellow for this one,
     hollow for those still to come, so the last dot lit means the next click moves to the next slide. Both sit
     outside the stage, so neither appears in captures, prints or the presenter's thumbnails. */
  let notes = null, counter = null, notesKey = '';
  function buildNotes() {
    notes = M.html('<aside id="notes"><div class="where" data-k="where"></div><div class="say" data-k="say"></div><div class="nx" data-k="nx"></div><nav class="toc"></nav></aside>');
    /* the contents: every slide by act, as in the slide strip; a click jumps there */
    const acts = window.TALK_ACTS || {}, toc = notes.querySelector('.toc');
    let act = null;
    slides.forEach((s, i) => {
      if (s.act !== act) { act = s.act; toc.appendChild(M.html(`<div class="act">${(acts[act] && acts[act].name) || act}</div>`)); }
      const b = M.html(`<button type="button" data-i="${i}"><span>${i + 1}</span>${s.title}</button>`);
      b.addEventListener('click', () => goto(i));
      toc.appendChild(b);
    });
    document.body.appendChild(notes);
    counter = M.html('<div id="clicks"></div>');
    document.getElementById('viewport').appendChild(counter);
    fit();
  }
  function toggleNotes() {
    document.body.classList.toggle('notes');
    fit();
  }
  function markNotes() {
    if (!notes) return;
    const key = `${cur}.${beat}.${blankOn}`;
    if (key === notesKey) return;
    notesKey = key;
    const s = slides[cur], n = s.beats.length;
    counter.innerHTML = s.beats.map((_, k) => `<i class="${k < beat ? 'done' : k === beat ? 'cur' : ''}"></i>`).join('');
    counter.style.opacity = blankOn ? 0 : '';
    notes.querySelector('.where').textContent = `${cur + 1}. ${s.title}${n > 1 ? `, click ${beat + 1} of ${n}` : ''}`;
    notes.querySelector('.say').textContent = sayOf(s.beats[beat]);
    const after = beat < n - 1 ? sayOf(s.beats[beat + 1]) : null, nextSlide = slides[cur + 1];
    notes.querySelector('.nx').innerHTML = after != null
      ? `<b>Next click</b>${after.replace(/</g, '&lt;')}`
      : nextSlide ? `<b>Next slide</b>${nextSlide.title.replace(/</g, '&lt;')}` : '<b>Last slide</b>';
    const toc = notes.querySelector('.toc');
    toc.querySelectorAll('button').forEach((b) => b.classList.toggle('cur', +b.dataset.i === cur));
    const on = toc.querySelector('button.cur');
    if (on && (on.offsetTop < toc.scrollTop || on.offsetTop + on.offsetHeight > toc.scrollTop + toc.clientHeight))
      toc.scrollTop = on.offsetTop - toc.clientHeight / 3;
  }

  function changed() {
    if (MODE !== 'show') return;
    markNav();
    send(stateMsg());
    try { history.replaceState(null, '', `#s=${slides[cur].id}&b=${beat}`); } catch (e) { /* file:// may refuse */ }
  }

  /* ---------- keys ---------- */
  let digits = '', digitT = 0;
  function showJump() { jump.textContent = digits; jump.style.opacity = digits ? 1 : 0; }
  /* A press within 250 ms of the last advance is a double click or a clicker's bounce, not a second step. */
  let stepAt = -1e9;
  function step(fn) { const now = performance.now(); if (now - stepAt < 250) return; stepAt = now; fn(); }
  function keys() {
    /* the click that brings the window back into focus is not an advance */
    let focusAt = -1e9;
    addEventListener('focus', () => { focusAt = performance.now(); });
    addEventListener('keydown', (e) => {
      const k = e.key;
      if (e.repeat) { e.preventDefault(); return; }
      if (k === 'Enter' && (e.ctrlKey || e.metaKey)) { toggleNotes(); e.preventDefault(); return; }
      if (/^[0-9]$/.test(k)) { digits = (performance.now() - digitT > 2500 ? '' : digits) + k; digitT = performance.now(); showJump(); e.preventDefault(); return; }
      if (k === 'Enter' && digits) { goto(parseInt(digits, 10) - 1); digits = ''; showJump(); e.preventDefault(); return; }
      if (['ArrowRight', 'PageDown', ' ', 'Enter', 'ArrowDown', 'n', 'N'].includes(k)) step(next);
      else if (['ArrowLeft', 'PageUp', 'Backspace', 'ArrowUp', 'p', 'P'].includes(k)) step(prev);
      else if (k === 'Home') snap(0, 0);
      else if (k === 'End') snap(slides.length - 1, last(slides.length - 1));
      else if (k === 'b' || k === 'B' || k === '.' || k === 'w' || k === 'W') toggleBlank();
      else if (k === 'f' || k === 'F' || k === 'F5') { const d = document.documentElement; if (!document.fullscreenElement) d.requestFullscreen && d.requestFullscreen(); else document.exitFullscreen(); }
      else if (k === 'g' || k === 'G') { navPinned = !navPinned; setNav(navPinned); }
      else if (k === 'Escape') { digits = ''; showJump(); navPinned = false; setNav(false); return; }
      else return;
      e.preventDefault();
    });
    addEventListener('mousedown', (e) => {
      if ((nav && nav.contains(e.target)) || (notes && notes.contains(e.target))) return;
      if (performance.now() - focusAt < 400) return;
      if (e.button === 0) step(next); else if (e.button === 2) step(prev);
    });
    addEventListener('contextmenu', (e) => e.preventDefault());
    let idle = 0;
    const wake = () => { document.body.classList.remove('idle'); clearTimeout(idle); idle = setTimeout(() => document.body.classList.add('idle'), 1500); };
    addEventListener('mousemove', wake);
    wake();
  }

  function fit() {
    if (VIRTUAL) return;
    const vp = document.getElementById('viewport');
    const s = Math.min(vp.clientWidth / W, vp.clientHeight / H);
    stage.style.transform = `translate(${(-W * s) / 2}px, ${(-H * s) / 2}px) scale(${s})`;
    if (counter) {
      counter.style.right = `${(vp.clientWidth - W * s) / 2 + 22 * s}px`;
      counter.style.bottom = `${(vp.clientHeight - H * s) / 2 + 20 * s}px`;
    }
  }

  function startAt() {
    const h = new URLSearchParams(location.hash.slice(1));
    const id = h.get('s'), b = parseInt(h.get('b') || '0', 10);
    const i = slides.findIndex((s) => s.id === id);
    return i >= 0 ? [i, b] : [0, 0];
  }

  /* ---------- print: clone each hold frame into its own page ---------- */
  function printAll() {
    document.documentElement.classList.add('print');
    const out = document.createElement('div');
    slides.forEach((s, i) => s.beats.forEach((_, b) => {
      snap(i, b, false);
      frame();
      const page = document.createElement('div');
      page.className = 'pp';
      page.appendChild(s.root.cloneNode(true));
      out.appendChild(page);
    }));
    document.body.appendChild(out);
    window.deck.printed = true;
  }

  function loop() { frame(); markNotes(); requestAnimationFrame(loop); }

  function boot() {
    M.stageInfo = { width: W, height: H, capture: VIRTUAL, caption: null };
    document.body.classList.add(MODE);
    document.documentElement.classList.toggle('capture', VIRTUAL);
    if (MODE === 'presenter') {
      slides = order();
      window.TalkPresenter.boot({ outline: outline(), send, onMsg, acts: window.TALK_ACTS || {} });
      return;
    }
    build();
    fit();
    addEventListener('resize', fit);
    const [i, b] = MODE === 'show' ? startAt() : [0, 0];
    snap(i, b, false);
    window.deck = {
      mode: MODE, get cur() { return cur; }, get beat() { return beat; },
      outline, next, prev, goto, snap: (i2, b2) => { snap(i2, b2, false); frame(); },
      /** a frame between hold b-1 (or 0) and hold b of slide i, at fraction f */
      peek(i2, b2, f) { snap(i2, b2, false); const a = b2 ? holdOf(i2, b2 - 1) : 0; pinned = M.lerp(a, holdOf(i2, b2), f); frame(); },
      /** advance the virtual clock (capture mode) and draw */
      tick(dt) { vclock += dt; return frame(); },
      frame,
    };
    if (MODE === 'print') { printAll(); return; }
    if (MODE === 'show') {
      buildNav();
      buildNotes();
      keys();
      onMsg((m) => {
        if (m.type === 'hello') send(stateMsg());
        else if (m.type === 'cmd') {
          if (m.cmd === 'next') step(next); else if (m.cmd === 'prev') step(prev); else if (m.cmd === 'blank') toggleBlank();
          else if (m.cmd === 'goto') goto(m.cur, m.beat || 0, m.animate !== false);
        }
      });
      changed();
    }
    if (MODE === 'still') {
      addEventListener('message', (e) => { const m = e.data || {}; if (m.type === 'still') snap(m.cur, m.beat, false); });
      parent.postMessage({ type: 'still-ready', name: Q.get('name') }, '*');
    }
    requestAnimationFrame(loop);
  }

  const ready = () => (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve());
  addEventListener('load', () => ready().then(boot));
})();

</script>
<script>
/* lib/presenter.js */
/* The presenter view (index.html?presenter=1), for the second screen. It follows the show over
   BroadcastChannel and sends it commands, so the clicker works in either window.

   It shows the hold the show is heading to and the next one (two ?still=1 frames), the words for this
   beat, the clock, the time since the first click, and planned against actual time per act. Press T to
   restart the timer. */
(function () {
  const P = (window.TalkPresenter = {});

  const css = `
    html, body { height: 100%; overflow: hidden; }
    body.presenter { background: #0a0a0c; color: #f1f1f1; font: 500 18px/1.4 var(--sans); }
    body.presenter #viewport { display: none; }
    .pv { position: fixed; inset: 0; display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 18px; padding: 18px 22px; }
    .pv-top { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 34px; }
    .pv-top .clock { font: 700 44px/1 var(--sans); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .pv-top .el { font: 700 44px/1 var(--sans); color: var(--yellow); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
    .pv-top .k { font: 600 13px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; color: #8d8d96; margin-right: 10px; }
    .pv-top .delta { font: 600 22px/1 var(--sans); font-variant-numeric: tabular-nums; }
    .pv-top .delta.ahead { color: var(--green); } .pv-top .delta.behind { color: var(--red); }
    .pv-top .sp { flex: 1; }
    .pv-top .where { font: 600 18px/1 var(--sans); color: #c9c9d0; }
    .pv-top .conn { font: 600 13px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; }
    .pv-top .conn.off { color: var(--red); } .pv-top .conn.on { color: var(--green); }
    .pv-l, .pv-r { min-height: 0; display: flex; flex-direction: column; gap: 14px; }
    .pv-fr { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; background: #000; box-shadow: 0 0 0 1px rgba(241,241,241,.16); flex: none; }
    .pv-fr iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
    .pv-fr .tag { position: absolute; left: 10px; top: 10px; z-index: 2; font: 600 12px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; padding: 6px 8px; border-radius: 6px; background: rgba(0,0,0,.7); color: #d8d8de; }
    .pv-fr.anim .tag { color: var(--yellow); }
    .pv-say { flex: 1; min-height: 0; overflow: auto; padding: 4px 4px 4px 0; }
    .pv-say .ttl { font: 600 14px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--yellow); margin-bottom: 10px; }
    .pv-say p { margin: 0; font: 500 30px/1.42 var(--sans); color: #f4f3ef; text-wrap: pretty; }
    .pv-next { font: 500 19px/1.4 var(--sans); color: #b8b8c0; }
    .pv-next b { display: block; font: 600 13px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: #8d8d96; margin-bottom: 6px; }
    .pv-acts { border-collapse: collapse; width: 100%; font: 500 16px/1.2 var(--sans); font-variant-numeric: tabular-nums; }
    .pv-acts td, .pv-acts th { padding: 7px 6px; border-top: 1px solid rgba(241,241,241,.12); text-align: right; }
    .pv-acts th { font: 600 12px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: #8d8d96; }
    .pv-acts td:first-child, .pv-acts th:first-child { text-align: left; }
    .pv-acts tr.on td { color: var(--yellow); }
    .pv-acts td.over { color: var(--red); }
    .pv-help { font: 500 13px/1.4 var(--sans); color: #77777f; }
  `;

  const fmt = (s) => { const n = Math.max(0, Math.round(Math.abs(s))); return `${Math.floor(n / 60)}:${String(n % 60).padStart(2, '0')}`; };

  P.boot = function ({ outline, send, onMsg, acts }) {
    const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
    document.title = 'Presenter: ' + document.title;
    const flat = [];
    outline.forEach((s) => s.beats.forEach((b, k) => flat.push({ s, k, b })));
    const actKeys = [...new Set(outline.map((s) => s.act))];
    const planAct = {}; actKeys.forEach((a) => (planAct[a] = 0));
    flat.forEach((f) => (planAct[f.s.act] += f.b.plan));
    const total = flat.reduce((a, f) => a + f.b.plan, 0);
    const base = location.href.split('?')[0].split('#')[0];

    const root = Mock.mount(document.body, `
      <div class="pv">
        <div class="pv-top"><span><span class="k">Clock</span><span class="clock" data-k="clock"></span></span>
          <span><span class="k">Elapsed</span><span class="el" data-k="el">0:00</span></span>
          <span class="delta" data-k="delta"></span><span class="sp"></span>
          <span class="where" data-k="where"></span><span class="conn off" data-k="conn">Show not connected</span></div>
        <div class="pv-l">
          <div class="pv-fr" data-k="frA"><span class="tag" data-k="tagA">Now</span><iframe data-k="ifA" src="${base}?still=1&name=a"></iframe></div>
          <div class="pv-say"><div class="ttl" data-k="ttl"></div><p data-k="say"></p></div>
        </div>
        <div class="pv-r">
          <div class="pv-fr"><span class="tag">Next</span><iframe data-k="ifB" src="${base}?still=1&name=b"></iframe></div>
          <div class="pv-next" data-k="next"></div>
          <table class="pv-acts" data-k="acts"></table>
          <div class="pv-help">Right / PageDown / Space: next. Left / PageUp: back. B: blank the screen. T: restart the timer. Digits then Enter: go to that slide. Planned total ${fmt(total)}.</div>
        </div>
      </div>`);

    let state = { cur: 0, beat: 0 }, connected = false, t0 = null, lastAt = null;
    const spent = {}; actKeys.forEach((a) => (spent[a] = 0));
    const ready = { a: false, b: false };
    const flatIndex = () => flat.findIndex((f) => f.s.index === state.cur && f.k === state.beat);

    function post() {
      const i = flatIndex(), a = flat[i], b = flat[i + 1];
      if (ready.a && a) root.ifA.contentWindow.postMessage({ type: 'still', cur: a.s.index, beat: a.k }, '*');
      if (ready.b) root.ifB.contentWindow.postMessage(b ? { type: 'still', cur: b.s.index, beat: b.k } : { type: 'still', cur: a.s.index, beat: a.k }, '*');
    }
    addEventListener('message', (e) => { const m = e.data || {}; if (m.type === 'still-ready') { ready[m.name] = true; post(); } });

    function render() {
      const i = flatIndex(), f = flat[i] || flat[0], nx = flat[i + 1];
      root.ttl.textContent = `${f.s.title}${f.s.beats.length > 1 ? ` · beat ${f.k + 1} of ${f.s.beats.length}` : ''}`;
      root.say.textContent = f.b.say || '(no words for this beat)';
      root.where.textContent = `Slide ${f.s.index + 1} of ${outline.length}`;
      root.next.innerHTML = nx ? `<b>Next${nx.s !== f.s ? ' · ' + nx.s.title : ''}</b>${(nx.b.say || '').split(/(?<=[.!?])\s/)[0]}` : '<b>Next</b>End of the deck';
      root.frA.classList.toggle('anim', !!state.animating);
      root.tagA.textContent = state.blank ? 'Now · screen blank' : 'Now';
      post();
    }

    function tick() {
      const now = Date.now();
      root.clock.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const f = flat[flatIndex()] || flat[0];
      if (t0 != null && lastAt != null) { spent[f.s.act] += (now - lastAt) / 1000; }
      lastAt = now;
      const el = t0 == null ? 0 : (now - t0) / 1000;
      root.el.textContent = fmt(el);
      /* planned time to the start of this beat, against the time spent */
      const i = flatIndex();
      const planned = flat.slice(0, Math.max(0, i)).reduce((a, x) => a + x.b.plan, 0);
      if (t0 == null) { root.delta.textContent = ''; }
      else {
        const d = el - planned;
        root.delta.textContent = Math.abs(d) < 15 ? 'On time' : d > 0 ? `${fmt(d)} behind` : `${fmt(d)} ahead`;
        root.delta.className = 'delta ' + (Math.abs(d) < 15 ? '' : d > 0 ? 'behind' : 'ahead');
      }
      root.acts.innerHTML = `<tr><th>Act</th><th>Planned</th><th>Actual</th></tr>` + actKeys.map((a) =>
        `<tr class="${f.s.act === a ? 'on' : ''}"><td>${(acts[a] && acts[a].name) || a}</td><td>${fmt(planAct[a])}</td><td class="${spent[a] > planAct[a] + 15 ? 'over' : ''}">${fmt(spent[a])}</td></tr>`).join('') +
        `<tr><td>Total</td><td>${fmt(total)}</td><td>${fmt(Object.values(spent).reduce((x, y) => x + y, 0))}</td></tr>`;
      root.conn.textContent = connected ? 'Show connected' : 'Show not connected: open index.html';
      root.conn.className = 'conn ' + (connected ? 'on' : 'off');
    }

    onMsg((m) => {
      if (m.type !== 'state') return;
      connected = true;
      const moved = m.cur !== state.cur || m.beat !== state.beat;
      if (moved && t0 == null && (m.cur > 0 || m.beat > 0)) { t0 = Date.now(); lastAt = t0; }
      state = m;
      render();
    });
    addEventListener('keydown', (e) => {
      const k = e.key;
      if (e.repeat) { e.preventDefault(); return; }
      if (['ArrowRight', 'PageDown', ' ', 'ArrowDown', 'n'].includes(k)) send({ type: 'cmd', cmd: 'next' });
      else if (['ArrowLeft', 'PageUp', 'ArrowUp', 'p', 'Backspace'].includes(k)) send({ type: 'cmd', cmd: 'prev' });
      else if (k === 'b' || k === 'B' || k === '.') send({ type: 'cmd', cmd: 'blank' });
      else if (k === 't' || k === 'T') { t0 = Date.now(); lastAt = t0; actKeys.forEach((a) => (spent[a] = 0)); }
      else return;
      e.preventDefault();
    });
    let digits = '';
    addEventListener('keydown', (e) => {
      if (/^[0-9]$/.test(e.key)) digits += e.key;
      else if (e.key === 'Enter' && digits) { send({ type: 'cmd', cmd: 'goto', cur: parseInt(digits, 10) - 1, beat: 0 }); digits = ''; }
      else if (e.key === 'Escape') digits = '';
    });
    render();
    send({ type: 'hello' });
    setInterval(tick, 500);
    tick();
  };
})();

</script>
<script>
/* The talk's acts and slide order. Loaded with plain script tags (no modules), so the deck runs from
   file://. Act names appear only in the presenter view, never on screen. */
window.TALK_ACTS = {
  open: { name: 'Opening' },
  clocks: { name: 'Two clocks' },
  shape: { name: 'Governance changes shape' },
  principles: { name: 'Principles' },
  together: { name: 'How it comes together' },
  close: { name: 'Close and questions' },
};

window.TALK_ORDER = [
  'title',
  'clocks', 'in-their-words', 'rules', 'capability', 'cadence',
  'shape-card', 'documents', 'audits', 'system', 'posture',
  'principles-card', 'corpus', 'five-types', 'three-sources', 'software', 'verdicts', 'drift', 'every-agent', 'person-decides',
  'together-card', 'platform', 'stitched', 'board', 'change', 'record', 'experiment',
  'closing', 'questions',
];


/* slides/title.js */
/* Title. The hero line rises; behind it, faint and always moving, the two clocks of the first act:
   a compounding yellow curve and a white stepped line that keeps splitting. */
registerSlide({
  id: 'title',
  act: 'open',
  title: 'Title',
  beats: [
    {
      t: 2.6,
      say: "Good morning. I'm Tyler Jewell, and I run Akka. We build a platform for building and running agentic AI systems, which means the governance question lands on our desk every single day, usually from people in jobs like yours. For the next half hour I want to give you an argument, not a product tour. It comes in four parts. Why the way we govern technology today is running out of time. How governance has to change shape. Seven principles that follow from that. And then what it looks like when it all works, on one real system.",
    },
  ],

  render(root) {
    const M = Mock;
    root.classList.add('sl-title');
    M.style('sl-title', `
      .sl-title svg.bg { left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
      .sl-title .cap { fill: none; stroke: var(--yellow); stroke-width: 3; opacity: .34; }
      .sl-title .rule { fill: none; stroke: #f1f1f1; stroke-width: 2; opacity: .16; }
      .sl-title .mark { left: var(--gut); top: 108px; }
      .sl-title .hero { left: var(--gut); top: 330px; }
      .sl-title .hero .tk-hero { font-size: 156px; }
      .sl-title .who { left: var(--gut); top: 848px; display: flex; gap: 22px; align-items: baseline; }
      .sl-title .who b { font: 700 36px/1 var(--sans); letter-spacing: -.01em; color: var(--ink); }
      .sl-title .who span { font: 500 32px/1 var(--sans); color: var(--ink-2); }
    `);

    { t: 8.4, say: "The second clock is the rules. They don't compound the same way, but they multiply. More jurisdictions, more laws, more guidance, and they don't line up with each other. One line becomes many, and some of them double back: a deadline that moves, a law that's repealed before it starts." },
    { t: 11.0, say: "Your job lives in the space between those two clocks: making sure what the systems can do stays inside what the rules allow. This year that space got a lot wider. Let me show you what happened to each of them in 2026, starting with the rules." },

    const LINES = [
      { split: 99, rise: 0 },

    { t: 11.8, say: "Colorado passed the first broad state AI act in the country. It was due in February. Last August it was pushed to the end of June. Then in May the legislature repealed it and replaced it with a different law, whose duties start next January. The original never took effect. Whatever you prepared for the first law, you now get to re-read against the second." },

    { t: 22.0, say: (T) => `Meanwhile the states keep writing. The National Conference of State Legislatures counted ${T.states.y2025.introduced.toLocaleString('en-US')} AI bills in the states last year, and ${T.states.y2025.enacted} enacted. This year, by early October: ${T.states.y2026.introduced.toLocaleString('en-US')} bills, and ${T.states.y2026.enacted} enacted. And last December a federal executive order set up a Justice Department task force whose job is to challenge state AI laws. So you're not only tracking the legislatures. You're tracking the fight between them and Washington.` },
    { t: 25.6, say: "And in Canada, OSFI's Guideline E-23 takes effect in May 2027, with a definition of a model that includes AI. Like SR 26-2, it sets no fixed interval for reviewing a model. Both say the review should match the risk. So the rules change monthly. Sometimes it's a new law. Sometimes it's a deadline that moves, a law replaced before it starts, or guidance that is silent on exactly the systems you're deploying." },
  ],

  X0: 470, X1: 1770,

    M.dotGrid(root);
    this.head = Talk.lines(root.appendChild(M.html('<div class="tk-top"></div>')), ['The rules <span class="tk-y">moved this year.</span>']);

    /* the calendar */
    const tl = (this.tl = M.html('<div class="tl"></div>'));

    this.axis = M.html('<div style="left:0;top:0;width:1920px;height:1080px"></div>');

    let ax = '';
    for (let m = 0; m <= 36; m++) {
      const x = this.X0 + (m / 36) * (this.X1 - this.X0);
      ax += `<div class="tk${m % 12 === 0 ? ' y' : m % 3 === 0 ? ' q' : ''}" style="left:${x - 1}px"></div>`;
      if (m % 12 === 0 && m < 36) ax += `<div class="yr" style="left:${x + 12}px">${2026 + m / 12}</div>`;
    }
    this.axis.innerHTML = ax;
    this.axis.querySelectorAll('div').forEach((d) => (d.style.position = 'absolute'));
    this.nowX = this.x('2026-11-02');
    this.now = M.mount(tl, `<div class="now" style="left:${this.nowX}px"></div>`).root;
    this.nowl = M.mount(tl, `<div class="nowl" style="left:${this.nowX}px">Now</div>`).root;

    const lane = (key, nm, sub) => M.mount(tl, `<div class="lane" style="top:${L[key] - 60}px"><div class="trk"></div><div class="nm">${nm}<small>${sub}</small></div></div>`);
    const E = T.eu, C = T.colorado, K = T.banking;

    /* EU: two pins slide */
    this.eu = lane('eu', 'EU AI Act', 'High-risk, standalone');
    this.eu1 = lane('eu1', 'EU AI Act', 'High-risk, in products');
    this.euP = [
      { a: this.x(E.annexIII.from), b: this.x(E.annexIII.to), from: E.annexIII.fromLabel, to: E.annexIII.toLabel, nm: 'Rules apply', d: 0, host: this.eu.root },
      { a: this.x(E.annexI.from), b: this.x(E.annexI.to), from: E.annexI.fromLabel, to: E.annexI.toLabel, nm: 'Rules apply', d: 0.55, host: this.eu1.root },
    ].map((p) => {
      p.ghost = M.mount(p.host, `<div class="ghost" style="left:${p.a}px"></div>`).root;
      p.gl = M.mount(p.host, `<div class="pl gh" style="left:${p.a}px">${p.from}</div>`).root;
      p.trail = M.mount(p.host, `<div class="trail" style="left:${p.a}px;width:${p.b - p.a}px"></div>`).root;
      p.slip = M.mount(p.host, `<div class="slip" style="left:${(p.a + p.b) / 2}px"></div>`).root;
      p.pin = M.mount(p.host, `<div class="pin y"></div>`).root;
      p.lab = M.mount(p.host, `<div class="pl"><span></span><small>${p.nm}</small></div>`);
      p.labD = p.lab.root.firstChild;
      return p;
    });

    /* Colorado: slides, breaks, is replaced */
    this.co = lane('co', 'Colorado', 'State AI act');
    const c0 = this.x(C.original.date), c1 = this.x(C.delayed.date), c2 = this.x(C.newDuties.date), cr = this.x(C.replaced.date);
    this.coG = { c0, c1, c2, cr };
    this.co.ghost = M.mount(this.co.root, `<div class="ghost" style="left:${c0}px"></div>`).root;
    this.co.trail = M.mount(this.co.root, `<div class="trail" style="left:${c0}px;width:${c1 - c0}px;background:linear-gradient(90deg, rgba(241,241,241,.05), rgba(241,241,241,.8))"></div>`).root;
    this.co.pin = M.mount(this.co.root, `<div class="pin"></div>`).root;
    this.co.hl = M.mount(this.co.root, `<div class="pin half red"></div>`).root;
    this.co.hr = M.mount(this.co.root, `<div class="pin half r red"></div>`).root;
    this.co.lab = M.mount(this.co.root, `<div class="pl"><span></span><small></small></div>`);
    this.co.rep = M.mount(this.co.root, `<div class="pl red" style="left:${c1 + 30}px">Repealed<small style="color:var(--red)">${C.replaced.label}</small></div>`).root;
    this.co.nw = M.mount(this.co.root, `<div class="pin y sq" style="left:${c2}px"></div>`).root;
    this.co.nwl = M.mount(this.co.root, `<div class="pl y" style="left:${c2 + 30}px">${C.newDuties.label}<small>A different law</small></div>`).root;

    /* banks: SR 11-7 cut, SR 26-2 begins */
    this.bk = lane('bank', 'US banks', 'Model risk guidance');
    const b0 = this.x('2026-04-17');
    this.bkX = b0;
    this.bk.old = M.mount(this.bk.root, `<div class="bar old" style="left:${this.X0 - 10}px;width:${this.X1 - this.X0 + 10}px"></div>`).root;
    this.bk.oc = M.mount(this.bk.root, `<div class="bchip" style="left:${this.X0}px;color:var(--ink)">${K.old.id}<span class="since" style="font-weight:500;color:var(--ink-2)"> since 2011</span></div>`).root;
    this.bk.brk = M.mount(this.bk.root, `<div class="brk" style="left:${b0}px"></div>`).root;
    this.bk.nw = M.mount(this.bk.root, `<div class="bar new" style="left:${b0 + 8}px;width:${this.X1 - b0 - 8}px"></div>`).root;
    this.bk.nc = M.mount(this.bk.root, `<div class="bchip" style="left:${b0 + 30}px;color:var(--yellow)">${K.new.id} <span style="font-weight:500;color:var(--ink-2)">${K.new.date}</span></div>`).root;

    /* Canada: lands in 2027 */
    this.os = lane('osfi', 'Canada', 'OSFI Guideline E-23');
    const o0 = this.x(T.osfi.date);
    this.os.pin = M.mount(this.os.root, `<div class="pin y" style="left:${o0}px"></div>`).root;
    this.os.lab = M.mount(this.os.root, `<div class="pl y" style="left:${o0 + 30}px">${T.osfi.effective}<small>Takes effect</small></div>`).root;

    /* SR 26-2, footnote 3 */
    this.dim = M.mount(root, `<div class="dim"></div>`).root;
    this.q = M.mount(root, `<div class="qcard tk-card hot"><div class="k">SR 26-2 · Footnote 3</div>
      <q>Generative AI and agentic AI models are novel and rapidly evolving. As such, they are <b>not within the scope of this guidance.</b></q>
      <div class="by">${K.new.by} · ${K.new.date}</div></div>`).root;

    /* the state bill field */
    const st = (this.st = M.html('<div class="st"></div>'));
    root.appendChild(st);
    const S = T.states;
    this.stL = M.mount(st, `<div class="lab"><div class="k">AI bills introduced<br>in US state legislatures</div>
      <div class="big" data-k="big">0</div><div class="yr2" data-k="yr">2025</div><div class="en" data-k="en"></div>
      <div class="ly" data-k="ly">2025: ${S.y2025.introduced.toLocaleString('en-US')} introduced, ${S.y2025.enacted} enacted</div>
      <div class="ly" data-k="eo">Federal: a task force to challenge state AI laws</div></div>`);
    const fsvg = M.html('<svg class="f" viewBox="0 0 1920 1080"></svg>');
    st.appendChild(fsvg);
    this.fDim = M.svg('path', { style: 'stroke:rgba(241,241,241,.62);stroke-width:13' }, fsvg);
    this.fNew = M.svg('path', { style: 'stroke:rgba(241,241,241,.62);stroke-width:13' }, fsvg);
    this.fEn = M.svg('path', { style: 'stroke:var(--yellow);stroke-width:13' }, fsvg);
    this.leg = M.mount(st, `<div class="leg"><span><i style="background:rgba(241,241,241,.62)"></i>One bill</span><span><i style="background:var(--yellow)"></i>Enacted</span></div>`).root;
    /* the field: 50 x 31 at a 21 px pitch; dots are numbered in a scattered order so the field fills
       evenly; enacted bills are a spread subset */
    const COLS = 50, P = 21, FX = 770, FY = 300;
    this.dots = [];
    for (let i = 0; i < COLS * 31; i++) this.dots.push({ x: FX + (i % COLS) * P, y: FY + Math.floor(i / COLS) * P, k: M.noise(i * 1.37 + 0.11) });
    this.dots.sort((a, b) => a.k - b.k);
    this.dots.forEach((d, i) => (d.en = M.noise(i * 3.1 + 7.7) < S.y2026.enacted / S.y2026.introduced));

    /* the source for the beat on screen */
    const pend = (s) => (s === 'pending' ? ' <span class="tk-pend">Source pending</span>' : '');
    this.srcs = [
      `Dates as enacted. EU: Regulation (EU) 2024/1689.${pend(E.status)} Colorado: SB24-205.`,
      `${E.source}${pend(E.status)}`,
      `${C.source}`,
      `${K.source}`,
      `${S.source} · Executive Order 14365, 11 Dec 2025`,
      `${T.osfi.source}`,
    ].map((h) => M.mount(root, `<div class="src"><div class="tk-src">${h}</div></div>`).root);
  },

  at(t) {
    const M = Mock, B = this.B, Lv = M.abs(t), T = window.TRENDS;
    Talk.linesAt(this.head, t, 0.1);

    /* the calendar comes in, then gives way to the bill field and returns */
    const away = M.p(t, B.states, 0.6, 'inOutCubic') * (1 - M.p(t, B.osfi, 0.7, 'inOutCubic'));
    this.tl.style.opacity = ((1 - away) * M.prog(t, 0.3, 0.6)).toFixed(3);
    this.tl.style.transform = away ? `scale(${(1 + 0.04 * away).toFixed(4)})` : 'none';
    this.tl.style.transformOrigin = '960px 500px';
    this.axis.style.clipPath = `inset(0 ${((1 - M.p(t, 0.3, 1.2, 'outCubic')) * 100).toFixed(1)}% 0 0)`;
    M.fade(this.now, t, 1.6, 0.6);
    M.fade(this.nowl, t, 1.8, 0.6);
    this.now.style.opacity *= 0.75 + 0.25 * M.wave(Lv, 2.4);

    /* which lane has the floor */
    const focus = t < B.eu ? null : t < B.co ? 'euall' : t < B.bank ? 'co' : t < B.states ? 'bank' : null;
    const lanes = { eu: this.eu.root, eu1: this.eu1.root, co: this.co.root, bank: this.bk.root, osfi: this.os.root };
    Object.entries(lanes).forEach(([k, el], i) => {
      const inn = k === 'osfi' ? M.prog(t, B.osfi + 0.6, 0.5) : M.prog(t, 0.6 + i * 0.15, 0.5);
      const lit = focus && focus !== k && !(focus === 'euall' && k.startsWith('eu')) ? 0.28 : 1;
      el.style.opacity = (inn * lit).toFixed(3);
    });

    /* EU: the pins detach and slide; the date ticks through the months as they go */
    this.euP.forEach((p, i) => {
      const s0 = B.eu + 0.3 + p.d, sp = M.p(t, s0, 1.8, 'inOutCubic');
      const x = M.lerp(p.a, p.b, sp);
      p.pin.style.left = x + 'px';
      M.fade(p.pin, t, 1.2 + i * 0.12, 0.3);
      p.pin.style.transform = `scale(${(1 + 0.25 * M.ramp(t, s0 - 0.25, s0 + 0.3, 0.15, 0.3)).toFixed(3)})`;
      const flip = x > 1520;
      p.lab.root.style.left = x + 26 + 'px';
      p.lab.root.style.transform = flip ? 'translateX(calc(-100% - 52px))' : 'none';
      p.lab.root.style.textAlign = flip ? 'right' : 'left';
      M.fade(p.lab.root, t, 1.3 + i * 0.12, 0.4);
      Talk.txt(p.labD, sp <= 0 ? p.from : sp >= 1 ? p.to : this.monthAt(x));
      p.labD.style.color = sp >= 1 ? 'var(--yellow)' : '';
      p.ghost.style.opacity = M.prog(t, s0, 0.3);
      p.gl.style.opacity = M.prog(t, s0 + 0.4, 0.4);
      p.trail.style.transform = `scaleX(${sp.toFixed(4)})`;
      p.trail.style.opacity = sp > 0 ? 1 : 0;
      Talk.txt(p.slip, i === 0 ? `+${T.eu.slipMonths} months` : '+12 months');
      M.rise(p.slip, t, s0 + 1.7, { dy: 10 });
    });

    /* Colorado: slides to June, breaks on the repeal, a different law lands in January */
    const G = this.coG, c = this.co;
    const s1 = M.p(t, B.co + 0.4, 1.2, 'inOutCubic');
    const cx = M.lerp(G.c0, G.c1, s1);
    const crack = M.prog(t, B.co + 2.1, 0.7);
    c.pin.style.left = cx + 'px';
    c.pin.style.opacity = (M.prog(t, 1.4, 0.3) * (crack > 0 ? 0 : 1)).toFixed(3);
    c.ghost.style.opacity = M.prog(t, B.co + 0.4, 0.3);
    c.trail.style.transform = `scaleX(${s1.toFixed(4)})`;
    c.trail.style.opacity = s1 > 0 ? (1 - 0.6 * crack).toFixed(3) : 0;
    [c.hl, c.hr].forEach((h, k) => {
      const dir = k ? 1 : -1, e = M.ease.outCubic(crack);
      h.style.left = G.c1 + 'px';
      h.style.opacity = crack > 0 ? (1 - 0.4 * M.prog(t, B.co + 2.5, 0.8)).toFixed(3) : 0;
      h.style.transform = `translate(${(dir * 16 * e).toFixed(1)}px, ${(26 * e * e).toFixed(1)}px) rotate(${(dir * 28 * e).toFixed(1)}deg)`;
    });
    Talk.htm(c.lab.root, s1 < 1 ? `${s1 <= 0 ? T.colorado.original.label : this.monthAt(cx)}<small>Takes effect</small>` : `${T.colorado.delayed.label}<small>Delayed</small>`);
    c.lab.root.style.left = cx + 26 + 'px';
    c.lab.root.style.opacity = (M.prog(t, 1.5, 0.4) * (1 - M.prog(t, B.co + 2.1, 0.3))).toFixed(3);
    M.rise(c.rep, t, B.co + 2.3, { dy: 10 });
    const nw = M.p(t, B.co + 3.0, 0.6, 'outCubic');
    c.nw.style.opacity = nw;
    c.nw.style.transform = `rotate(45deg) scale(${(0.3 + 0.7 * nw + 0.2 * M.ramp(t, B.co + 3.3, B.co + 4.0, 0.15, 0.5)).toFixed(3)})`;
    M.rise(c.nwl, t, B.co + 3.3, { dy: 10 });

    /* banks: the old guidance is cut, the new begins; then footnote three */
    const k = this.bk;
    const cut = M.p(t, B.bank + 0.4, 0.7, 'inOutCubic');
    k.old.style.clipPath = `inset(0 ${(cut * ((this.X1 - this.bkX) / (this.X1 - this.X0 + 10)) * 100).toFixed(2)}% 0 0)`;
    k.old.style.opacity = M.prog(t, 1.4, 0.4);
    k.oc.style.opacity = (M.prog(t, 1.4, 0.4) * (1 - 0.45 * M.prog(t, B.bank + 0.4, 0.3))).toFixed(3);
    const br = M.prog(t, B.bank + 0.4, 0.2);
    k.brk.style.opacity = (br * (0.75 + 0.25 * M.wave(Lv, 1.2))).toFixed(3);
    const ng = M.p(t, B.bank + 1.0, 1.0, 'outCubic');
    k.nw.style.transform = `scaleX(${ng.toFixed(4)})`;
    k.nw.style.opacity = ng > 0 ? 1 : 0;
    k.oc.querySelector('.since').style.opacity = (1 - M.prog(t, B.bank + 0.4, 0.3)).toFixed(3);
    k.nc.style.opacity = M.prog(t, B.bank + 1.6, 0.4);
    const qv = M.p(t, B.quote, 0.7) * (1 - M.p(t, B.states, 0.4, 'inOutCubic'));
    this.q.style.opacity = qv.toFixed(3);
    this.q.style.transform = `translateY(${((1 - M.p(t, B.quote, 0.9)) * 26).toFixed(1)}px) scale(${(0.97 + 0.03 * M.p(t, B.quote, 0.9)).toFixed(4)})`;
    this.dim.style.opacity = (0.95 * qv).toFixed(3);

    /* the state bill field */
    const S = T.states, sv = M.p(t, B.states + 0.4, 0.6) * (1 - M.p(t, B.osfi, 0.5, 'inOutCubic'));
    this.st.style.opacity = sv.toFixed(3);
    this.st.style.display = sv > 0.001 ? '' : 'none';
    if (sv > 0.001) {
      const a = M.ease.outCubic(M.prog(t, B.states + 0.6, 1.3));          /* 2025 fills */
      const b = M.ease.inOutCubic(M.prog(t, B.states + 2.4, 2.0));        /* then this year */
      const n25 = Math.round(S.y2025.introduced * a);
      const n = Math.round(M.lerp(n25, S.y2026.introduced, b));
      const en = Math.round(M.lerp(S.y2025.enacted * a, S.y2026.enacted, b));
      Talk.txt(this.stL.big, n.toLocaleString('en-US'));
      Talk.txt(this.stL.yr, b > 0 ? '2026, to early October' : '2025');
      this.stL.yr.style.color = b > 0 ? 'var(--ink)' : '';
      Talk.txt(this.stL.en, `${en} enacted`);
      this.stL.ly.style.opacity = M.prog(t, B.states + 2.4, 0.5);
      this.stL.eo.style.opacity = M.prog(t, B.states + 4.0, 0.5);
      this.leg.style.opacity = M.prog(t, B.states + 1.2, 0.5);
      if (this._n !== n || this._e !== en) {
        this._n = n; this._e = en;
        let dd = '', dn = '', de = '';
        let enLeft = en;
        for (let i = 0; i < n; i++) {
          const d = this.dots[i], seg = `M${d.x},${d.y}h0`;
          if (d.en && enLeft > 0) { de += seg; enLeft--; }
          else if (i >= S.y2025.introduced) dn += seg;
          else dd += seg;
        }
        this.fDim.setAttribute('d', dd); this.fNew.setAttribute('d', dn); this.fEn.setAttribute('d', de);
      }
      this.fEn.style.opacity = (0.8 + 0.2 * M.wave(Lv, 2.2)).toFixed(3);
    }

    /* the source line for the beat on screen */
    const marks = [0.8, B.eu, B.co, B.bank, B.states, B.osfi];
    let cur = 0;
    marks.forEach((m, i) => { if (t >= m) cur = i; });
    this.srcs.forEach((el, i) => { el.style.opacity = i === cur ? M.prog(t, marks[i] + (i ? 0.6 : 0.6), 0.5) : 0; });
  },
});

   one doubling: wide steps to 2023, then narrower and faster ones. OSWorld agent success fills from about

   change that follows. Figures and sources: data/trends.js. */
registerSlide({

  title: 'The systems keep compounding',
  beats: [
    { t: 1.4, say: "Now the other clock." },
    { t: 6.4, say: (T) => `METR, an independent research group, measures how long a task an AI agent can finish on its own, counted in how long the same task takes a skilled person. Each step on this chart is a doubling. From 2019 to 2025 that length doubled about every ${T.metr.doublingAll}. For models since 2023, ${T.metr.doublingRecent}. The steps are getting shorter. METR is careful to say these are mostly software, machine-learning and security tasks. But the direction isn't in doubt.` },
    { t: 9.8, say: (T) => `Stanford's AI Index tracks agents doing real work on a computer: opening applications, filling in forms, finishing multi-step tasks. Success went from about ${T.osworld.from} percent to about ${T.osworld.to} percent in a single year. People score about ${T.osworld.human}. That isn't a chatbot getting better at conversation. That's software operating other software.` },
    { t: 12.6, say: (T) => `These systems don't just answer any more. They act. And the same report counted ${T.incidents.y2025} documented AI incidents in 2025, up from ${T.incidents.y2024} the year before. More capable systems, doing more, in more places, with more of it going wrong in public.` },
    { t: 15.4, say: "So the systems you govern change every week: a new model, a new prompt, a new tool, a new data source. Each one changes what the system can do, and very few of those changes ever pass in front of anyone in this room." },

      .sl-cap .bars .b { height: 30px; border-radius: 0 8px 8px 0; transform-origin: 0 50%; }
      .sl-cap .bars .v { text-align: right; color: var(--ink); font-size: 34px; }

      .sl-cap .wk .say { left: 150px; right: 150px; top: 360px; text-align: center; }
      .sl-cap .chips { left: 150px; right: 150px; top: 690px; display: flex; justify-content: center; gap: 26px; }

    const main = (this.main = M.html('<div class="main"></div>'));
    root.appendChild(main);

    /* METR: two doubling rates as a staircase on a log scale */
    const { CX, CW, CY, CH } = this;
    const m0 = 2019, m1 = 2026, mx = (yr) => CX + ((yr - m0) / (m1 - m0)) * CW;
    const dA = 7, dB = T.metr.doublingRecentDays / 30.44;           /* months per doubling */
    const nA = 48 / dA, nB = 36 / dB, n = nA + nB;
    const py = CH / (n + 0.6), y0 = CY + CH;
    const yAt = (k) => y0 - k * py;
    const svg = (this.svg = M.html('<svg class="ch" viewBox="0 0 1920 1080"></svg>'));
    main.appendChild(svg);
    for (let k = 0; k <= Math.floor(n); k++) M.svg('line', { class: 'grid', x1: CX, x2: CX + CW, y1: yAt(k), y2: yAt(k) }, svg);
    M.svg('line', { class: 'axis', x1: CX, x2: CX + CW, y1: y0, y2: y0 }, svg);
    M.svg('line', { class: 'axis', x1: CX, x2: CX, y1: CY - 10, y2: y0 }, svg);
    [2019, 2021, 2023, 2025].forEach((yr) => { const tx = M.svg('text', { class: 'yrs', x: mx(yr), y: y0 + 44, 'text-anchor': 'middle' }, svg); tx.textContent = yr; });
    const stair = (x0, k0, steps, w) => {
      let d = `M${x0.toFixed(1)},${yAt(k0).toFixed(1)}`, x = x0, k = k0;
      const whole = Math.floor(steps + 1e-6);
      for (let s = 0; s < whole; s++) { x += w; k += 1; d += ` H${x.toFixed(1)} V${yAt(k).toFixed(1)}`; }
      const rest = steps - whole;
      if (rest > 0.01) { x += w * rest; d += ` H${x.toFixed(1)}`; }
      return { d, x, k };
    };
    const wA = (dA / 84) * CW, wB = (dB / 84) * CW;
    const A = stair(CX, 0, nA, wA);
    const Bs = stair(A.x, Math.floor(nA), nB + (nA - Math.floor(nA)), wB);
    this.gB = M.svg('path', { class: 'glow', d: Bs.d }, svg);
    this.sA = M.svg('path', { class: 'stairA', d: A.d }, svg);
    this.sB = M.svg('path', { class: 'stairB', d: Bs.d }, svg);
    this.end = [Bs.x, yAt(Bs.k)];
    this.halo = M.svg('circle', { class: 'halo', cx: Bs.x, cy: yAt(Bs.k), r: 12 }, svg);
    this.tip = M.svg('circle', { class: 'tip', cx: Bs.x, cy: yAt(Bs.k), r: 10 }, svg);
    this.yl = M.mount(main, `<div class="yl">Task length, log scale · each step doubles</div>`).root;
    this.annA = M.mount(main, `<div class="ann" style="left:${CX + 40}px;top:${yAt(4.6) - 40}px">Every ${T.metr.doublingAll}<small>${T.metr.doublingAllSpan}</small></div>`).root;
    this.annB = M.mount(main, `<div class="ann" style="left:${mx(2023) - 330}px;top:${yAt(12.4) - 30}px;color:var(--yellow);text-align:right;width:300px">Every ${T.metr.doublingRecent.replace('about ', '~')}<small>${T.metr.doublingRecentSpan}</small></div>`).root;
    this.src1 = M.mount(main, `<div class="src1 tk-src">Drawn from METR's estimated doubling times (7 months, 2019–2025; ${T.metr.doublingRecentDays} days, models since 2023). ${T.metr.caveat}. ${T.metr.source}</div>`).root;

    /* OSWorld */
    this.os = M.mount(main, `<div class="tile tk-card" style="top:290px">
      <div class="k">Real computer tasks completed<small>By AI agents, OSWorld, in one year</small></div>

    /* incidents */

    this.inc = M.mount(main, `<div class="tile tk-card" style="top:716px">
      <div class="k">Documented AI incidents</div>
      <div class="bars"><span>2024</span><div class="b" data-k="b4" style="width:${(100 * T.incidents.y2024) / mxI}%;background:rgba(241,241,241,.55)"></div><span class="v" data-k="v4">0</span>
        <span>2025</span><div class="b" data-k="b5" style="width:100%;background:var(--yellow)"></div><span class="v" data-k="v5">0</span></div>
      <div class="tk-src">${T.incidents.source}</div></div>`);

    /* every week */
    const wk = (this.wk = M.html('<div class="wk"></div>'));
    root.appendChild(wk);
    this.say = M.mount(wk, `<div class="say tk-h xl">Your system changes<br><span class="tk-y">every week.</span></div>`).root;
    this.chips = ['New model', 'New prompt', 'New tool', 'New data source'].map((c) => c);
    this.chipEl = M.mount(wk, `<div class="chips">${this.chips.map((c) => `<span class="tk-chip">${c}</span>`).join('')}</div>`);
    this.chipEls = [...this.chipEl.root.children];
  },

  at(t) {
    const M = Mock, B = this.B, T = window.TRENDS, Lv = M.abs(t);
    Talk.linesAt(this.head, t, 0.1);
    const away = M.p(t, B.week, 0.6, 'inOutCubic');
    this.main.style.opacity = (1 - 0.9 * away).toFixed(3);
    this.main.style.filter = away > 0.01 ? `blur(${(4 * away).toFixed(2)}px)` : 'none';

    /* METR */
    M.fade(this.svg, t, 0.3, 0.6);
    M.fade(this.yl, t, 0.5, 0.6);
    const a = M.draw(this.sA, t, B.metr, 2.0, 'linear');
    M.draw(this.sB, t, B.metr + 2.0, 1.6, 'linear');

    this.halo.style.opacity = (done * 0.7 * (1 - w)).toFixed(3);
    M.rise(this.annA, t, B.metr + 1.2, { dy: 12 });
    M.rise(this.annB, t, B.metr + 3.0, { dy: 12 });
    M.fade(this.src1, t, B.metr + 0.4, 0.6);

    /* OSWorld: the fill races from 12 to 66 against the people line */
    M.rise(this.os.root, t, B.os);

    Talk.htm(this.os.big, `${Math.round(v)}%<span>from ${T.osworld.from}%</span>`);
    this.os.fill.style.width = (v - T.osworld.from).toFixed(2) + '%';
    this.os.fill.style.opacity = op > 0 ? 1 : 0;

    M.rise(this.inc.root, t, B.inc);
    const ip = M.ease.outCubic(M.prog(t, B.inc + 0.5, 1.4));
    this.inc.b4.style.transform = `scaleX(${ip.toFixed(4)})`;
    this.inc.b5.style.transform = `scaleX(${M.ease.outCubic(M.prog(t, B.inc + 0.8, 1.4)).toFixed(4)})`;
    Talk.txt(this.inc.v4, String(Math.round(T.incidents.y2024 * ip)));
    Talk.txt(this.inc.v5, String(Math.round(T.incidents.y2025 * M.ease.outCubic(M.prog(t, B.inc + 0.8, 1.4)))));

    /* every week: the four kinds of change take turns lighting */
    this.wk.style.display = away > 0.001 ? '' : 'none';
    M.rise(this.say, t, B.week + 0.3);
    const lit = Math.floor(M.abs(t) / 1.1) % 4;
    this.chipEls.forEach((c, i) => {
      M.rise(c, t, B.week + 0.9 + i * 0.12, { dy: 14 });
      c.className = 'tk-chip' + (i === lit && t > B.week + 1.6 ? ' y' : '');
    });
  },
});

   the changes nobody signed off on. "The review happens once a year" is Tyler's framing, not a

registerSlide({

    { t: 2.4, say: "The second shift is from point-in-time audits to evidence on every request. Today we sample. A few times a year someone pulls a set of records and checks them by hand. Everything between those points, the system did on trust." },
    { t: 4.6, say: "Sampling misses things. New York City requires employers to publish bias audits of the AI tools they use in hiring. When the state comptroller examined how the city enforced that law, the city had reviewed thirty-two companies and found one issue. The comptroller's auditors, looking at the same companies, found at least seventeen. Same companies, same documents. A different depth of looking." },
    { t: 7.4, say: "Meanwhile an AI system makes thousands of decisions a day, and any one of them can go differently from the last. So every request should leave evidence behind: which controls ran, and what each one concluded. Not a sample. All of them, as they happen." },

    const n = t < B.grow[0] ? M.lerp(0, this.JUNE, M.p(t, B.june[0], B.june[1], 'inOutCubic'))
      : M.lerp(this.JUNE, this.N, M.p(t, B.grow[0], B.grow[1], 'inOutCubic'));
    Talk.txt(this.st[2].v, Act3.int(n));

    this.pn.setAttribute('d', k > this.JUNE ? this.prefix[k].slice(this.prefix[this.JUNE].length) : '');

        d += this.rect(this.cells[idx]);
      }
      this.tw.setAttribute('d', d);
      this.tw.style.opacity = (0.25 + 0.35 * M.wave(L, 0.67)).toFixed(3);
    } else this.tw.setAttribute('d', '');

    M.fade(this.src, t, B.chips + 0.8, 0.6);
  },

/* Five kinds of control. The corpus sorted by the kind of check each control needs, one kind per click,
   bars to scale: the gate (mostly documentation and attestation) dwarfs the four kinds that govern an
   agent while it runs. Figures: Akka regulation corpus, snapshot 2026-10 (research/corpus.md). */
registerSlide({
  id: 'five-types',
  act: 'principles',
  title: 'Five kinds of control',
  beats: [
    { t: 1.6, say: "Now sort every one of those controls by the kind of check it needs, and the first principle falls out. Every control is one of five kinds. That's not a theory. It's what you get when you sort seventeen hundred real obligations." },
    { t: 4.0, say: "Gates: a check that has to pass before something ships or carries on. Thirteen hundred and ninety-nine controls need one, and most of those are documentation and attestation. Write it down. Sign for it. Is the impact assessment on file? Has someone accountable signed it? Is the bias test current?" },
    { t: 5.4, say: "Sanitizers strip or mask data before it moves on, like an ID number removed before the model ever sees it. One hundred and twenty-three." },
    { t: 6.8, say: "Evaluations score behavior, live or in testing: performance, drift, fairness, incidents. Eighty-six." },
    { t: 8.2, say: "Guardrails allow or block an action at a boundary: what a model may say, which tools an agent may use. Seventy-two." },
    { t: 9.6, say: "And human controls give a named person authority over a decision, or the power to halt the system. Thirty-eight." },
    { t: 12.2, say: "So most of what the law asks for is evidence: documents and attestations, work your teams already know how to do. The smaller set, sanitizers, evaluations, guardrails and human authority, is where an agent's behavior is governed while it runs. That's where the old tools have nothing to offer. And policy isn't a sixth kind. Policy decides which of the five apply, and where." },
  ],

  TYPES: [
    { k: 'Gate', n: 1399, ex: 'Must pass before it ships or goes on', segs: [['Documentation', 1115], ['Attestation', 207], ['Test, configuration', 77]] },

  consoleCss(cls) {

      .${cls} .mk-ripple { left: -13px; top: -13px; width: 26px; height: 26px; border-width: 1.5px; }
    `);
  },
  /** The deck says Upheld where the board's own mock wrote Pass or Satisfied. Run after b.at(). */
  upheld(scope) {
    scope.querySelectorAll('.chip').forEach((c) => {
      const s = c.textContent;
      if (s === 'Pass' || s === 'Satisfied') c.textContent = 'Upheld';
    });
    /* the board's signature panel lists the versions as a chain; the talk claims only that old versions are kept */
    scope.querySelectorAll('.sg .f .k').forEach((k) => { if (k.textContent === 'Chain') k.textContent = 'Versions kept'; });
    const ch = scope.querySelector('[data-k="sgCh"]');
    if (ch && ch.textContent.includes('←')) ch.textContent = ch.textContent.split(' ← ').join(', ');
  },
  /** Piecewise-linear map through [[t, v], ...]: holds the ends. */
  map(t, pts) {
    if (t <= pts[0][0]) return pts[0][1];
    for (let i = 1; i < pts.length; i++) {
      const [t1, v1] = pts[i], [t0, v0] = pts[i - 1];
      if (t <= t1) return v0 + ((v1 - v0) * (t - t0)) / (t1 - t0);
    }
    return pts[pts.length - 1][1];
  },
};

    M.set(this.card.root, { opacity: (cin * (1 - cout)).toFixed(3), transform: `translate(${((1 - cin) * 80 + cout * 140).toFixed(1)}px, 0)` });
    this.card.root.style.visibility = cout >= 1 ? 'hidden' : '';
    this.dim.style.opacity = (0.5 * M.prog(c, B.in, 0.6) * (1 - M.prog(c, B.out, 0.6))).toFixed(3);
    const open = M.p(c, B.open, 0.4, 'inOutCubic');
    const word = 'String religion,';
    const typed = Math.floor(word.length * M.prog(c, B.type[0], B.type[1] - B.type[0]));
    const caretOn = c >= B.open && c < B.commit + 0.4 && (c < B.type[1] || M.wave(c, 0.9) > 0.5);
    const sp = M.prog(c, B.scan[0], B.scan[1] - B.scan[0]), scanY = sp * this.CODE.length * LH;
    let y = 0, n = 1;
    this.lines.forEach((l) => {
      const h = l.isNew ? LH * open : LH;

      l.el.style.height = h.toFixed(2) + 'px';
      l.el.style.opacity = l.isNew ? open.toFixed(3) : 1;
      if (l.isNew) {

        Talk.htm(l.tx, s + (caretOn ? '<span class="caret"></span>' : ''));
      }
      Talk.txt(l.no, l.isNew && open < 0.5 ? '' : String(n));
      if (!l.isNew || open >= 0.5) n++;
      if (l.tag) {
        const a = M.p(c, B.scan[0] + ((y + LH / 2) / (this.CODE.length * LH)) * (B.scan[1] - B.scan[0]), 0.45);
        l.tag.style.opacity = a.toFixed(3);
        l.tag.style.transform = `translateX(${((1 - a) * 12).toFixed(1)}px) scale(${l.isNew ? (1 + 0.12 * M.ramp(c, B.scan[0] + 1.15, B.scan[0] + 2.2, 0.15, 0.6)).toFixed(3) : 1})`;

    Talk.htm(this.card.f2t, done ? 'AI-BOM <span class="tok">213f6517</span> · was <span class="tok">60b8e667</span> · <span class="warnx">1 new data type</span>' : 'reading the code');

    this.card.root.querySelector('.foot .lab').style.display = done ? 'none' : '';

        <p>The draft decision’s rationale cites the applicant’s religion.</p><small>Score 0.21, below the 0.50 line</small></div>`).root,
      M.mount(root, `<div class="call tk-card" style="left:980px"><div class="top"><span class="tk-chip y">Held</span><span class="ty">Human</span></div>
        <p>An underwriter overrides the rationale and approves the referral.</p><small>A. Weber, inside the 4-hour limit</small></div>`).root,
    ];
    this.sum = M.mount(root, `<div class="sum"><div><b>4</b><span>messages</span></div><div><b>11</b><span>spans</span></div><div><b>4</b><span>verdicts</span></div><div><b class="tk-y">1</b><span>breach, decided by a person</span></div></div>`).root;
  },

  at(t) {
    const M = Mock, B = this.B, G = this.G;

    /* the conversation, large and centred, then it settles into the left column */
    M.rise(this.hd.root, t, 0.0, { dy: 10 });
    ['m0', 'm1', 'm2', 'm3'].forEach((k, i) => M.rise(this.conv[k], t, B.conv + i * 0.45, { dy: 16 }));
    const c = M.ease.inOutCubic(M.prog(t, B.compress, 0.9));
    const s0 = 1.6, x0 = 960 - 250 * s0 - 120, y0 = 30;
    this.conv.root.style.transform = `translate(${M.lerp(x0, 0, c).toFixed(1)}px, ${M.lerp(y0, 0, c).toFixed(1)}px) scale(${M.lerp(s0, 1, c).toFixed(4)})`;
    M.rise(this.meta.root, t, B.compress + 0.7);
    /* the left column steps back while the camera works on the trace, so no sliver of it shows at the edge */
    const away = 1 - M.ramp(t, 6.0, B.out + 0.9, 0.6, 0.9);
    this.conv.root.style.opacity = away.toFixed(3);
    this.meta.root.style.opacity = (Math.min(away, M.ease.css(M.prog(t, B.compress + 0.7, 0.7)))).toFixed(3);

    /* the waterfall, spans drawing on left to right behind a playhead */
    M.rise(this.wf, t, B.trace, { dy: 14 });
    M.fade(this.wft, t, B.trace + 0.2, 0.4);
    M.fade(this.wfs, t, B.trace + 0.2, 0.5);
    const [p0, p1, p2] = B.sweep;
    const phX = t < p1 ? M.lerp(G.barX, G.brk[0], M.prog(t, p0, p1 - p0)) : M.lerp(G.brk[0], G.end, M.ease.inOutCubic(M.prog(t, p1, p2 - p1)));
    const sweeping = t >= p0 && t < p2 + 0.4;
    M.set(this.ph, { left: phX.toFixed(1) + 'px', opacity: sweeping ? (1 - M.prog(t, p2, 0.4)).toFixed(3) : 0 });
    this.phl.style.left = phX.toFixed(1) + 'px';
    this.phl.style.opacity = this.ph.style.opacity;
    Talk.txt(this.phl, phX >= G.brk[1] ? '+3 m 41 s' : (((phX - G.barX) / G.pxs) || 0).toFixed(2) + ' s');

    const lit = this.VERDICTS.map((v, i) => [v.row, M.ramp(t, B.verdicts + i * 0.5, B.out + 0.4, 0.3, 0.5)]);
    this.rows.forEach((r, i) => {
      const reached = phX >= r.a - 1 && t >= p0;
      const tIn = p0 + ((r.a - G.barX) / (G.brk[0] - G.barX)) * (p1 - p0);
      const lab = M.prog(t, tIn - 0.05, 0.25);
      r.nm.style.opacity = lab;
      r.kd.style.opacity = lab;
      const w = M.clamp(phX - r.a, 0, r.w);
      r.bar.style.opacity = reached ? 1 : 0;
      r.bar.style.width = Math.max(reached ? 3 : 0, w).toFixed(1) + 'px';
      const done = w >= r.w - 0.5 && reached;
      const tDone = r.sp.b === 'E' ? p2 : p0 + ((r.b - G.barX) / (G.brk[0] - G.barX)) * (p1 - p0);
      M.fade(r.mt, t, tDone, 0.35);
      if (!done) r.mt.style.opacity = 0;
      const tagX = r.sp.b === 'E' ? r.a + 8 : r.b + 10;
      r.tg.forEach((el, k) => {
        el.style.left = tagX + 'px';
        let on;
        if (r.sp.k === 'human') {
          const at = [r.a, this.bx(2.62), G.end - 2][k], next = [this.bx(2.62), G.end - 2, Infinity][k];
          on = phX >= at && phX < next && t >= p0;
        } else on = done;
        el.style.opacity = on ? 1 : 0;
      });
      const hi = (lit.find(([row]) => row === i) || [0, 0])[1];
      const alarm = r.sp.k === 'eval' ? M.ramp(t, tDone, B.callEnd + 0.4, 0.15, 0.6) : r.sp.k === 'human' ? M.ramp(t, tDone - 0.2, B.callEnd + 0.4, 0.3, 0.6) * 0.8 : 0;
      r.row.style.background = alarm > hi ? `rgba(${r.sp.k === 'eval' ? '255,84,0' : '255,206,74'}, ${(0.16 * alarm).toFixed(3)})` : `rgba(255,206,74, ${(0.12 * hi).toFixed(3)})`;
    });

    /* the verdicts */
    M.fade(this.vt, t, B.verdicts - 0.2, 0.4);
    this.vrows.forEach((el, i) => M.rise(el, t, B.verdicts + i * 0.5, { dy: 14 }));

    /* the camera: the trace, the climax, the verdicts, then the whole record */
    const climax = [680, G.rowY + 8 * G.pitch - 8, 1120, 2 * G.pitch + 14];
    Talk.camera(this.world, t, [
      { t: 6.2, rect: [676, 120, 1128, 420], dur: 1.1 },
      { t: B.zoomIn, rect: climax, dur: 1.2, max: 1.7 },
      { t: B.zoomV, rect: [680, 560, 1120, 230], dur: 1.2 },
      { t: B.out, rect: null, dur: 1.3 },
    ]);

    /* the callouts at the climax, laid on the stage so they read at full size */
    const cv = M.ramp(t, B.call - 0.3, B.callEnd, 0.5, 0.5);
    this.dimx.style.opacity = cv.toFixed(3);
    this.calls.forEach((el, i) => {
      const a = M.ramp(t, B.call + i * 0.45, B.callEnd, 0.5, 0.45);
      el.style.opacity = a.toFixed(3);
      el.style.transform = `translateY(${((1 - M.p(t, B.call + i * 0.45, 0.8)) * 26).toFixed(1)}px)`;
    });

    /* one record */
    const fr = M.p(t, B.frame, 0.7, 'outCubic');
    this.brkt.style.opacity = fr; this.brkl.style.opacity = fr;
    this.brkt.style.transform = `scale(${(1.015 - 0.015 * fr).toFixed(4)})`;
    M.rise(this.sum, t, B.frame + 0.4);
  },
});


/* slides/experiment.js */
/* A person decides the rollout (adapted from the film's scenes 4.4 and 4.5). The Experiments view is
   ExpView. The slide runs two of the film's clocks in turn: the limit-crossing scene's time u (DE drifts
   through its quality limit, the experiment holds, DE goes back to the original model, the owner's
   preset choice) and then the decision scene's time v (DE retrained, back within, a person promotes,
   the evidence line). The demo clock reads experiment seconds, so it moves only when a beat plays.
   The film's cost count-up is left out: this is the governance story. */
registerSlide({
  id: 'experiment',
  act: 'together',
  title: 'A person decides the rollout',
  beats: [
    { t: 1.8, say: "Last, a different kind of change: a smaller model. Instead of switching over, the team runs an experiment, already serving a quarter of live traffic, watched against limits the owner set in advance." },
    { t: 4.0, say: "Quality, cost, latency, errors. Each has a band it must stay inside, written down before the experiment started." },
    { t: 6.35, say: "In one region, Germany, quality crosses the line." },
    { t: 10.8, say: "The experiment holds, and only that region goes back to the original model. Everyone else carries on. The response is as narrow as the problem." },
    { t: 12.8, say: "Why that response? Because the owner chose it in advance, with their name on it. Nobody is paged at three in the morning to improvise." },
    { t: 15.4, say: "The model is retrained for Germany, and it's back inside the band." },
    { t: 19.4, say: "When every limit has held, a person promotes it, and the decision is recorded with their name." },
    { t: 21.6, say: "A change proposed, measured, held when a limit broke, decided by a person, and every step in the same record." },
  ],

  /* slide time to each film clock */
  U: [[0, 1.6], [4.0, 1.6], [6.35, 3.95], [10.8, 8.4], [12.8, 14.4]],
  V: [[12.8, 0], [15.4, 2.6], [19.4, 6.6], [21.6, 8.0]],
  CROSS: 2.7, HOLD: 4.0, BASE: 7.4, OWNER: 13.6,
  RESUME: 2.2, DECIDE: 3.0, PROMOTE: 5.0, EVIDENCE: 6.0,

  render(root) {
    root.classList.add('s4x', 'sl-exp');
    Act4.consoleCss('sl-exp');
    this.view = ExpView.build(root);
    this.view.v.cu.style.display = 'none';
    this.cur = Mock.cursor(this.view.world);
  },

  /* the limit-crossing state, at its scene time u */
  stateA(t, u) {
    const M = Mock, X = ExpView;
    const w = (s, sp = 0.5) => M.wander(t, sp, s) - 0.5;
    const held = u >= this.HOLD, base = u >= this.BASE;
    const deQ = M.lerp(-2.2 + 0.25 * w(3), -3.45 + 0.08 * w(13), M.p(u, 1.6, 2.0, 'inOutCubic'));
    const segQ = [-0.9 + 0.3 * w(1), -1.4 + 0.3 * w(2), deQ, -1.1 + 0.3 * w(4)];
    const flash = M.ramp(u, this.CROSS, this.CROSS + 0.6, 0.12, 0.4) + M.ramp(u, this.CROSS + 0.6, this.CROSS + 1.2, 0.12, 0.4);
    const tint = M.prog(u, this.CROSS, 0.3);
    const canN = Math.round(4970 + 350 * Math.min(u, this.HOLD) + 210 * Math.max(0, u - this.HOLD));
    const swOut = M.p(u, this.HOLD + 0.2, 0.25, 'inOutCubic'), sw = M.p(u, this.HOLD + 0.45, 0.4, 'inOutCubic');
    return {
      x: 22 + u,
      status: held ? ['On hold', 'warn'] : ['Canary', 'info'],
      stages: { propose: 'done', evaluate: 'done', shadow: 'done', canary: held ? 'held' : 'now', decide: 'idle', watch: 'idle' },
      notes: { evaluate: 'Replay', canary: held ? 'On hold' : '25%' },
      center: held ? ['25%', 'on hold', base ? 'DE on baseline' : 'limit crossed'] : ['25%', 'served', 'Day 2'],
      attention: held,
      board: {
        n: `Canary, n = ${M.fmt.int(canN)}`,
        v: { quality: -1.3 + 0.3 * w(5) - 0.35 * M.p(u, 1.6, 2.0), cost: -71 + 0.6 * w(6), p95: -650 + 30 * w(7), errors: 0.1 + 0.06 * w(8) },
        w: { quality: deQ },
        spend: 9.2 + 0.18 * (22 + u),
      },
      segs: segQ.map((q, i) => ({
        q, calls: canN * X.SEG_SHARE[i],
        served: i === 2 && base ? 'Frontier model' : 'Small model 25%',
        flash: i === 2 ? flash : 0, tint: i === 2 ? tint : 0, ring: i === 2 ? tint : 0,
      })),
      panes: { Lsegs: 1, Rcanary: 1 - swOut, Rdec: sw },
      stageTitle: held ? 'Quality in Region · DE is outside your limit' : 'Canary',
      stageRight: held ? (base ? 'Region · DE on the frontier model · others unchanged' : 'Held at 25%') : 'Step 2 of 4 · I advance each step',
      share: 25,
    };
  },

  /* the decision state, at its scene time v */
  stateB(t, v) {
    const M = Mock, X = ExpView;
    const w = (s, sp = 0.5) => M.wander(t, sp, s) - 0.5;
    const resumed = v >= this.RESUME, decide = v >= this.DECIDE, promoted = v >= this.PROMOTE;
    const deQ = M.lerp(-3.45 + 0.08 * w(13), -1.5 + 0.2 * w(3), M.p(v, 0.6, 1.6, 'inOutCubic'));
    const segQ = [-0.9 + 0.3 * w(1), -1.4 + 0.3 * w(2), deQ, -1.1 + 0.3 * w(4)];
    const canN = Math.round(10150 + 210 * Math.min(v, this.RESUME) + 380 * Math.max(0, v - this.RESUME));
    const dOut = M.p(v, this.DECIDE, 0.25, 'inOutCubic'), dsw = M.p(v, this.DECIDE + 0.22, 0.35, 'inOutCubic');
    const day = promoted ? 1 + Math.floor((2 * (v - this.PROMOTE) + 2) / 24) : 0;
    let status = ['On hold', 'warn'];
    if (promoted) status = ['Promoted', 'ok']; else if (decide) status = ['Decide', 'info']; else if (resumed) status = ['Canary', 'info'];
    return {
      x: 44 + v,
      status,
      hbtn: promoted ? ['Close now', 'Roll back to v12'] : ['Pause', 'Roll back'],
      stages: {
        propose: 'done', evaluate: 'done', shadow: 'done',
        canary: decide ? 'done' : resumed ? 'now' : 'held',
        decide: promoted ? 'done' : decide ? 'now' : 'idle',
        watch: promoted ? 'now' : 'idle',
      },
      notes: { evaluate: 'Replay', canary: decide ? '✓' : resumed ? '25%' : 'On hold', decide: promoted ? 'Promoted' : decide ? 'Yours' : '', watch: promoted ? `Day ${day} of 14` : '' },
      center: promoted ? ['100%', 'served', 'closes 11-05'] : decide ? ['25%', 'served', 'Your decision'] : resumed ? ['25%', 'served', 'Day 3'] : ['25%', 'on hold', 'DE on baseline'],
      attention: !resumed,
      board: {
        n: promoted ? `All traffic in scope, day ${day}` : `Canary, n = ${M.fmt.int(canN)}`,
        v: { quality: -1.65 + 0.3 * w(5) + 0.45 * M.p(v, 0.6, 1.6), cost: -71 + 0.6 * w(6), p95: -650 + 30 * w(7), errors: 0.1 + 0.06 * w(8) },
        w: { quality: deQ },
        spend: Math.min(9.2 + 0.18 * (44 + v), 17.6),
      },
      segs: segQ.map((q, i) => ({
        q, calls: canN * X.SEG_SHARE[i],
        served: i === 2 && !resumed ? 'Frontier model' : 'Small model 25%',
        tint: i === 2 ? 1 - M.prog(v, 1.2, 0.6) : 0, ring: i === 2 ? 1 - M.prog(v, 1.2, 0.6) : 0,
        badge: i === 2 ? M.prog(v, 0.3, 0.4) : 0,
      })),
      panes: {
        Lsegs: 1 - dOut, Ldec: dsw,
        Rdec: 1 - M.p(v, 2.4, 0.5, 'inOutCubic'),
        Rpro: M.p(v, this.DECIDE, 0.5, 'inOutCubic') * (1 - M.p(v, this.PROMOTE + 0.3, 0.4, 'inOutCubic')),
        Rres: M.p(v, this.PROMOTE + 0.72, 0.4, 'inOutCubic'),
      },
      stageTitle: promoted ? 'Promoted to all traffic, route v13' : decide ? 'Result, 10-18 to 10-22' : resumed ? 'Canary' : v >= 1.2 ? 'Region · DE back within your limit' : 'Quality in Region · DE is outside your limit',
      stageRight: promoted ? `Watch · day ${day} of 14` : decide ? 'Every limit within' : resumed ? 'Step 2 of 4' : 'Region · DE retrained, underwrite-4b r2',
      share: 25,
    };
  },

  at(t) {
    const M = Mock, X = ExpView, view = this.view;
    const rc = X.measure(view);
    const phaseB = t > this.V[0][0] + 1e-6;
    const u = Act4.map(t, this.U), v = Act4.map(t, this.V);
    const st = phaseB ? this.stateB(t, v) : this.stateA(t, u);
    const vv = X.set(view, st, t);

    /* the canary's ramp holds where it is */
    vv.act.setAttribute('d', 'M30,74 H156 V50 H198');
    vv.area.setAttribute('d', 'M30,74 H156 V50 H198 V90 H30 Z');
    vv.bAdv.textContent = 'Advance to 50%';

    if (!phaseB) {
      /* DE's served-by cell lights as it changes; the owner's preset choice is pointed out */
      const sv = view.segs[2].sv, base = u >= this.BASE;
      sv.style.color = base ? `color-mix(in srgb, var(--c-amber) ${(100 * (1 - M.prog(u, this.BASE + 0.6, 1.2))).toFixed(0)}%, var(--c-text))` : '';
      sv.style.opacity = base ? M.lerp(0.2, 1, M.p(u, this.BASE, 0.4)).toFixed(3) : 1;
      const o = M.prog(u, this.OWNER, 0.5);
      vv.optOn.style.boxShadow = `inset 0 0 0 1px var(--c-gold-ring), 0 0 ${(22 * o).toFixed(1)}px rgba(201,162,39,${(0.45 * o).toFixed(3)})`;
      vv.owner.style.opacity = M.lerp(0.75, 1, o).toFixed(3);
      vv.owner.querySelector('b').style.color = o > 0.05 ? 'var(--c-gold-text)' : '';
    } else {
      view.segs[2].sv.style.color = '';
      view.segs[2].sv.style.opacity = 1;
      vv.optOn.style.boxShadow = '';
      vv.owner.style.opacity = 1;
      vv.owner.querySelector('b').style.color = '';
    }

    /* the evidence line for the promotion */
    M.rise(vv.ev, phaseB ? v : -1, this.EVIDENCE, { dy: 12 });
    Talk.txt(vv.evb, `route v13 · ${X.clock(44 + this.PROMOTE)} · bundle v4 · sig 9c1e…4a7f`);

    /* the person's click on Promote, measured once it is on screen */
    if (vv.bPro.offsetParent && !this.proAt) this.proAt = X.centerOf(view, vv.bPro);
    const pro = this.proAt || rc.bPro;
    this.cur.at(phaseB ? v : -10, [
      { t: this.PROMOTE - 1.1, x: pro[0] + 90, y: pro[1] + 80, glide: 0.3 },
      { t: this.PROMOTE, x: pro[0], y: pro[1], click: true, glide: 0.8 },
      { t: this.PROMOTE + 1.0, x: pro[0] + 60, y: pro[1] + 90, hide: true },
    ]);

    Talk.camera(view.world, t, [
      { t: 0.2, rect: rc.hero, dur: 1.3 },
      { t: 2.1, rect: rc.board, dur: 1.2 },
      { t: 4.1, rect: rc.segBlock, dur: 1.2 },
      { t: 6.5, rect: rc.stage, dur: 1.2 },
      { t: 10.9, rect: rc.dcard, dur: 1.2 },
      { t: 12.9, rect: rc.segBlock, dur: 1.2 },
      { t: 15.5, rect: rc.stage, dur: 1.2 },
      { t: 19.6, rect: null, dur: 1.4 },
    ]);
  },
});

    const head = -90 + 360 * ph, tail = head - 110;
    const [x0, y0] = pt(tail), [x1, y1] = pt(head);
    this.arc.setAttribute('d', `M${x0.toFixed(1)},${y0.toFixed(1)} A240,240 0 0 1 ${x1.toFixed(1)},${y1.toFixed(1)}`);
    const k = Math.floor(((ph * 6) % 6 + 6) % 6);
    this.nodes.forEach((n, i) => n.setAttribute('class', 'nd' + (i === k ? ' on' : '')));
  },
});

</script>
</head>
<body>
<div id="viewport"><div id="stage"></div></div>
</body>
</html>
