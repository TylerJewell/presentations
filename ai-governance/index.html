<style>
/* Design tokens for the demo mock.
   Brand tokens are the akka.io platform pages' (competition/_internal/product-pages-pro/assets/site.css).
   Console tokens are the console's dark theme (docs/plans/gateway-onramp/onramp.css). */
:root {
  /* akka.io */
  --black: #000000;
  --panel: #0E0E11;
  --medium-black: #141414;
  --ink-2: #0A0A0C;
  --white: #F1F1F1;
  --soft-grey: #A6A6A6;
  --medium-grey: #4E4E4E;
  --yellow: #FFCE4A;
  --cyan: #00DBDD;
  --green: #72D35B;
  --red: #FF5400;
  --hair: rgba(241, 241, 241, .10);
  --hair-hi: rgba(241, 241, 241, .20);
  --dot: rgba(255, 206, 74, .045);
  --yellow-glow: 0 0 60px -22px rgba(255, 206, 74, .6);

  --sans: 'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;

  /* Type scale on the 1920x1080 stage */
  --t-display: 216px;   /* hero lines, tracking -0.045em, line-height .95 */
  --t-h1: 120px;        /* chapter card titles */
  --t-h2: 64px;         /* scene headlines, tracking -0.03em */
  --t-h3: 34px;
  --t-body: 22px;
  --t-eyebrow: 15px;    /* Instrument Sans 600, uppercase, .24em, no rule beside it */

  /* Stage layout: the caption owns the bottom-left corner below y = 820 */
  --gutter: 160px;
  --safe-bottom: 820px;

  /* Console (dark theme) */
  --c-bg: #0b0b0d;
  --c-nav: #0f0f12;
  --c-surface: #161619;
  --c-surface-2: #1d1d21;
  --c-sunk: #121215;
  --c-line: rgba(236, 236, 241, .12);
  --c-text: #ececf1;
  --c-muted: #9a9aa6;
  --c-faint: #6c6c78;
  --c-gold: #c9a227;
  --c-gold-text: #f3d36b;
  --c-gold-bg: rgba(201, 162, 39, .16);
  --c-gold-ring: rgba(201, 162, 39, .45);
  --c-red: #f87171;
  --c-red-bg: rgba(248, 113, 113, .13);
  --c-amber: #fbbf24;
  --c-amber-bg: rgba(251, 191, 36, .13);
  --c-blue: #60a5fa;
  --c-blue-bg: rgba(96, 165, 250, .13);
  --c-green: #4ade80;
  --c-green-bg: rgba(74, 222, 128, .12);
  --c-violet: #a78bfa;
  --c-violet-bg: rgba(167, 139, 250, .14);
  --c-code: #0f0f12;
  --c-code-text: #d4d4dc;
}

</style>
<style>
/* The player: a 1920x1080 stage scaled to the window, the caption, the chapter card, the controls,
   and the shared classes the lib/ helpers draw with. */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
body { color: var(--white); font: 400 var(--t-body)/1.5 var(--sans); -webkit-font-smoothing: antialiased; }

#viewport { position: fixed; inset: 0; background: #050505; }
/* ?capture=1: the stage at 1920x1080 from the page's top-left corner, whatever the window's size */
html.capture, html.capture body { width: 1920px; height: 1080px; }
html.capture #viewport { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
html.capture #stage { left: 0; top: 0; transform: none !important; }
#stage {
  position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; overflow: hidden;
  background: var(--black); transform-origin: 0 0; contain: strict;
}
.scene { position: absolute; inset: 0; display: none; overflow: hidden; }
.scene.on { display: block; }
.scene > *, .mk-world > * { position: absolute; }
.mk-world { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }

/* fade through black */
#black { position: absolute; inset: 0; background: #000; pointer-events: none; z-index: 40; }

/* ---------- caption: a lower third (lib/caption.js) ---------- */
#caption { position: absolute; inset: 0; z-index: 36; pointer-events: none; }
#caption .scrim { position: absolute; left: 0; right: 0; bottom: 0; height: 340px; opacity: 0;
  background: radial-gradient(120% 100% at 18% 100%, rgba(0,0,0,.72), rgba(0,0,0,0) 70%); }
#caption.right .scrim { background: radial-gradient(120% 100% at 82% 100%, rgba(0,0,0,.72), rgba(0,0,0,0) 70%); }
#caption .panel {
  position: absolute; bottom: 48px; width: 820px; padding: 19px 28px 21px; opacity: 0;
  background: rgba(10, 10, 12, .74); -webkit-backdrop-filter: blur(18px) saturate(120%); backdrop-filter: blur(18px) saturate(120%);
  border: 1px solid rgba(241, 241, 241, .10); border-radius: 14px; box-shadow: 0 24px 60px -20px rgba(0, 0, 0, .8);
}
#caption .eb { display: flex; align-items: center; font: 600 13px/1 var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--yellow); }
#caption .rule { height: 1px; background: rgba(241, 241, 241, .14); margin: 12px 0 12px; transform-origin: 0 50%; }
#caption .lines { position: relative; }
#caption .ln { position: absolute; left: 0; right: 0; top: 0; font: 500 26px/1.36 var(--sans); letter-spacing: -.005em; color: #f4f3ef; text-wrap: pretty; }
#caption.long .panel { width: 860px; }
#caption.long .ln { font-size: 23px; line-height: 1.38; }

/* ---------- chapter card: the Intro deck style ---------- */
#card { position: absolute; inset: 0; z-index: 35; background: #000; display: none; }
#card.on { display: block; }
#card .mk-mark { position: absolute; left: 96px; top: 84px; }
#card .body { position: absolute; left: var(--gutter); top: 400px; right: var(--gutter); }
#card .kick { display: flex; align-items: center; gap: 16px; font: 600 18px/1 var(--sans); letter-spacing: .22em; text-transform: uppercase; color: var(--yellow); margin-bottom: 34px; }
#card .ttl { font: 700 var(--t-h1)/1 var(--sans); letter-spacing: -.035em; color: var(--white); }

/* ---------- controls (outside the stage, so a capture never contains them) ---------- */
#hud {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 100; padding: 34px 28px 18px;
  background: linear-gradient(180deg, transparent, rgba(0, 0, 0, .78) 45%);
  font: 500 13px/1 var(--sans); color: var(--soft-grey); transition: opacity .35s; user-select: none;
}
#hud.idle { opacity: 0; pointer-events: none; }
body.idle { cursor: none; }
#hud .track { position: relative; height: 26px; cursor: pointer; margin-top: 18px; }
#hud .bar { position: absolute; left: 0; right: 0; top: 11px; height: 4px; background: rgba(241, 241, 241, .16); border-radius: 2px; }
#hud .fill { position: absolute; left: 0; top: 11px; height: 4px; background: var(--yellow); border-radius: 2px; }
#hud .head { position: absolute; top: 6px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--yellow); box-shadow: 0 0 0 4px rgba(255, 206, 74, .2); }
#hud .tick { position: absolute; top: 7px; width: 1px; height: 12px; background: rgba(241, 241, 241, .28); }
#hud .tick.act { top: 2px; height: 22px; width: 2px; background: var(--white); }
#hud .acts { position: absolute; left: 0; right: 0; top: -14px; height: 14px; }
#hud .acts span { position: absolute; white-space: nowrap; font: 600 11px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--soft-grey); padding-left: 6px; overflow: hidden; text-overflow: ellipsis; }
#hud .acts span.on { color: var(--yellow); }
#hud .tip { position: absolute; bottom: 30px; transform: translateX(-50%); background: #141414; border: 1px solid var(--hair-hi); padding: 6px 9px; border-radius: 6px; color: var(--white); white-space: nowrap; display: none; }
#hud .row { display: flex; align-items: center; gap: 18px; margin-top: 10px; }
#hud button { all: unset; cursor: pointer; padding: 8px 12px; border: 1px solid var(--hair-hi); border-radius: 6px; color: var(--white); font: 600 12px/1 var(--sans); letter-spacing: .08em; }
#hud button:hover, #hud button:focus-visible { border-color: var(--yellow); color: var(--yellow); }
#hud .play { width: 18px; text-align: center; }
#hud .time { color: var(--white); min-width: 120px; }
#hud .scn { color: var(--soft-grey); }
#hud .scn b { color: var(--white); font-weight: 600; margin-right: 8px; }
#hud .sp { flex: 1; }

#help {
  position: fixed; inset: 0; z-index: 110; display: none; align-items: center; justify-content: center;
  background: rgba(0, 0, 0, .72); font: 500 15px/1.4 var(--sans); color: var(--white);
}
#help.on { display: flex; }
#help .box { background: #0E0E11; border: 1px solid var(--hair-hi); border-radius: 12px; padding: 30px 36px; min-width: 460px; }
#help h3 { margin: 0 0 18px; font: 700 26px/1.1 var(--sans); letter-spacing: -.02em; }
#help table { border-collapse: collapse; width: 100%; }
#help td { padding: 7px 0; border-top: 1px solid var(--hair); }
#help td:first-child { color: var(--yellow); width: 150px; }

/* ================= shared drawing classes (lib/) ================= */
.mk-dotgrid {
  position: absolute; inset: 0; pointer-events: none;
  background-image: radial-gradient(circle, rgba(255, 206, 74, .06) 1.2px, transparent 1.4px); background-size: 48px 48px;
  -webkit-mask-image: linear-gradient(180deg, transparent, #000 18%, #000 82%, transparent);
  mask-image: linear-gradient(180deg, transparent, #000 18%, #000 82%, transparent);
}
.mk-dotgrid.full { -webkit-mask-image: none; mask-image: none; }

.mk-eyebrow { display: flex; align-items: center; gap: 14px; font: 600 var(--t-eyebrow)/1.3 var(--sans); text-transform: uppercase; letter-spacing: .24em; color: var(--yellow); margin: 0; }
.mk-eyebrow.mono { font-family: var(--sans); letter-spacing: .16em; color: var(--soft-grey); }
.mk-h2 { margin: 0; font: 700 var(--t-h2)/1.04 var(--sans); letter-spacing: -.03em; text-wrap: balance; }

<script>
/* ../mock/lib/core.js */
/* Shared helpers for scenes. Every helper that moves something takes the scene's local time t (seconds)
   and writes the element's state for that instant, so a scene is a pure function of t and can be scrubbed
   or captured frame by frame. Nothing here starts a timer, a transition or a CSS animation. */
(function () {
  const M = (window.Mock = window.Mock || {});
  const SVGNS = 'http://www.w3.org/2000/svg';

  /* ---------- numbers ---------- */
  M.clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  M.lerp = (a, b, p) => a + (b - a) * p;
  /** 0 before start, 1 after start + dur, linear in between. */
  M.prog = (t, start, dur) => (dur <= 0 ? (t >= start ? 1 : 0) : M.clamp((t - start) / dur));

  /** A CSS cubic-bezier timing function as a function of progress. */
  M.bezier = function (x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sx = (s) => ((ax * s + bx) * s + cx) * s;
    const sy = (s) => ((ay * s + by) * s + cy) * s;
    const dx = (s) => (3 * ax * s + 2 * bx) * s + cx;
    return function (p) {
      if (p <= 0) return 0;
      if (p >= 1) return 1;
      let s = p;
      for (let i = 0; i < 8; i++) {
        const e = sx(s) - p, d = dx(s);
        if (Math.abs(e) < 1e-6 || Math.abs(d) < 1e-6) break;
        s -= e / d;
      }
      return sy(M.clamp(s));
    };
  };

  M.ease = {
    linear: (p) => p,
    outCubic: (p) => 1 - Math.pow(1 - p, 3),
    inCubic: (p) => p * p * p,
    inOutCubic: (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
    /* the akka.io reveal curve */
    reveal: M.bezier(0.16, 1, 0.3, 1),
    /* the console's glide curve */
    glide: M.bezier(0.4, 0, 0.2, 1),
    css: M.bezier(0.25, 0.1, 0.25, 1),
  };

  /** Eased progress: M.p(t, start, dur, 'reveal'). */
  M.p = (t, start, dur, ease = 'reveal') => M.ease[ease](M.prog(t, start, dur));

  /** A window: 0 before a, rises over `inDur` to 1, holds, falls over `outDur` to 0 at b. */
  M.ramp = function (t, a, b, inDur = 0.35, outDur = 0.35) {
    if (t <= a || t >= b) return 0;
    return M.ease.inOutCubic(Math.min(M.prog(t, a, inDur), 1 - M.prog(t, b - outDur, outDur)));
  };

  /** 0..1 oscillation, deterministic in t. */
  M.wave = (t, period = 2, phase = 0) => 0.5 - 0.5 * Math.cos(((t / period) + phase) * Math.PI * 2);

  M.fmt = {
    int: (n) => Math.round(n).toLocaleString('en-US'),
    fixed: (n, d) => n.toFixed(d),
    money: (n, d = 3) => '$' + n.toFixed(d),
    pct: (n, d = 0) => n.toFixed(d) + '%',
  };

  /* ---------- DOM ---------- */
  /** Parses an HTML string into its first element. */
  M.html = function (str) {
    const tpl = document.createElement('template');
    tpl.innerHTML = str.trim();
    return tpl.content.firstElementChild;
  };
  /** Appends HTML to a parent and returns a lookup of its [data-k] elements by key. */
  M.mount = function (parent, str) {
    const el = M.html(str);
    parent.appendChild(el);
    const refs = { root: el };
    if (el.dataset.k) refs[el.dataset.k] = el;
    el.querySelectorAll('[data-k]').forEach((n) => (refs[n.dataset.k] = n));
    return refs;
  };
  M.svg = function (tag, attrs = {}, parent) {
    const n = document.createElementNS(SVGNS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  };
  /** Adds a scene's own stylesheet once. Scope its selectors under the scene's root class. */
  M.style = function (id, css) {
    if (document.getElementById('css-' + id)) return;
    const st = document.createElement('style');
    st.id = 'css-' + id;
    st.textContent = css;
    document.head.appendChild(st);
  };
  M.set = function (el, styles) {
    for (const k in styles) {
      if (k.startsWith('--')) el.style.setProperty(k, styles[k]);
      else el.style[k] = styles[k];
    }
  };
  /**
   * The rect [x, y, w, h] of an element inside a world (or any full-stage layer), in unzoomed stage px,
   * whatever the camera and the window's scale are doing. The player boots after the web fonts load, so a
   * rect measured from a scene's at() is final and can be cached.
   */
  M.rectOf = function (world, el) {
    const keep = world.style.transform;
    world.style.transform = 'none';
    const wr = world.getBoundingClientRect(), k = wr.width / 1920, b = el.getBoundingClientRect();
    world.style.transform = keep;
    return [(b.left - wr.left) / k, (b.top - wr.top) / k, b.width / k, b.height / k];
  };

  /* ---------- motion ---------- */
  /** The akka.io rise-in: opacity 0 -> 1 over .7 s, translateY(dy) -> 0 over .8 s on the reveal curve. */
  M.rise = function (el, t, start, opts = {}) {
    const dy = opts.dy ?? 22, dur = opts.dur ?? 0.8, fade = opts.fade ?? 0.7;
    const o = M.ease.css(M.prog(t, start, fade));
    const y = (1 - M.p(t, start, dur)) * dy;
    el.style.opacity = o * (opts.opacity ?? 1);
    el.style.transform = y ? `translateY(${y.toFixed(2)}px)` : 'none';
    return o;
  };
  /** Rise-in at `start`, and fall out (fade, small lift) at `end` when given. */
  M.riseOut = function (el, t, start, end, opts = {}) {
    if (end == null || t < end) return M.rise(el, t, start, opts);
    const p = M.p(t, end, opts.outDur ?? 0.5, 'inOutCubic');
    el.style.opacity = 1 - p;
    el.style.transform = `translateY(${(-p * (opts.outDy ?? 12)).toFixed(2)}px)`;
    return 1 - p;
  };
  /** Opacity only. */
  M.fade = function (el, t, start, dur = 0.5, from = 0, to = 1) {
    const v = M.lerp(from, to, M.ease.css(M.prog(t, start, dur)));
    el.style.opacity = v;
    return v;
  };
  /** A masked line (an .ln-mask > .ln pair) rising from under its baseline. */
  M.lineRise = function (inner, t, start, dur = 1.0) {
    const p = M.p(t, start, dur);
    inner.style.transform = `translateY(${((1 - p) * 108).toFixed(2)}%)`;
    return p;
  };
  /** Count-up with ease-out cubic; fmt turns the value into text. */
  M.countUp = function (el, t, start, dur, from, to, fmt = M.fmt.int) {
    const v = M.lerp(from, to, M.ease.outCubic(M.prog(t, start, dur)));
    const s = fmt(v);
    if (el.textContent !== s) el.textContent = s;
    return v;
  };
  /** Stroke-dash draw of any SVG geometry element, from its start to its end. */
  M.draw = function (shape, t, start, dur = 0.9, ease = 'outCubic') {
    if (shape._len == null) shape._len = shape.getTotalLength ? shape.getTotalLength() : 1000;
    const L = shape._len, p = M.ease[ease](M.prog(t, start, dur));
    shape.style.strokeDasharray = `${L} ${L}`;
    shape.style.strokeDashoffset = (L * (1 - p)).toFixed(2);
    shape.style.opacity = p > 0 ? '' : 0;
    return p;
  };
  /** Marching dashes on an SVG stroke whose dasharray is set in CSS: offset moves `speed` px a second. */
  M.march = function (shape, t, speed = 16) {
    shape.style.strokeDashoffset = (-t * speed).toFixed(2);
  };

  /** A flow rail: yellow 45% dashes on an 8 px pitch, moving along the rail. vertical: true flows down. */
  M.rail = function (parent, opts = {}) {
    const el = document.createElement('div');
    el.className = 'mk-rail' + (opts.vertical ? ' v' : '');
    if (opts.style) M.set(el, opts.style);
    parent.appendChild(el);
    return el;
  };
  M.railAt = function (el, t, speed = 9) {
    const off = ((t * speed) % 8).toFixed(2) + 'px';
    el.style.backgroundPosition = el.classList.contains('v') ? `0 ${off}` : `${off} 0`;
  };
  /** Grows a rail along its length from 0 to its full size. */
  M.railGrow = function (el, t, start, dur = 0.9) {
    const p = M.p(t, start, dur, 'outCubic');
    el.style.clipPath = el.classList.contains('v') ? `inset(0 0 ${(1 - p) * 100}% 0)` : `inset(0 ${(1 - p) * 100}% 0 0)`;
    return p;
  };

  /** The faint yellow 48 px dot grid, masked top and bottom. */
  M.dotGrid = function (parent, opts = {}) {
    const el = document.createElement('div');
    el.className = 'mk-dotgrid' + (opts.full ? ' full' : '');
    parent.appendChild(el);
    return el;
  };

  /* ---------- brand ---------- */
  M.markSVG = function (height = 28, fill = '#F1F1F1') {
    const w = (height * 780) / 178;
    return `<svg class="mk-mark" width="${w.toFixed(1)}" height="${height}" viewBox="0 0 780 178" aria-label="Akka"><g fill="${fill}">` +
      '<polygon points="324.68 .12 259.49 72.63 259.49 0 216.25 0 216.25 177.95 259.49 177.95 259.49 105.33 324.68 177.83 381.64 177.83 301.75 88.98 381.64 .12"/>' +
      '<polygon points="516.96 .12 451.77 72.63 451.77 0 408.54 0 408.54 177.95 451.77 177.95 451.77 105.33 516.96 177.83 573.93 177.83 494.04 88.98 573.93 .12"/>' +
      '<path d="M114.05.12H81.39L0 177.83h45.97l11.1-25.74h82.39l11.1 25.74h45.97L115.14.12h-1.09zM72.88 115.44l25.39-58.88 25.39 58.88H72.88z"/>' +
      '<path d="M697.68.12h-33.75l-81.39 177.71h45.97l11.1-25.74h82.39l11.1 25.74h45.97L697.68.12zM655.41 115.44l25.39-58.88 25.39 58.88h-50.78z"/>' +
      '</g></svg>';
  };

  /** The four product cards of the family diagram, shared by the scenes that show the platform. */
  M.PRODUCTS = [
    { id: 'specify', name: 'Specify', kind: 'AI factories', line: 'Builds systems from specifications.' },
    { id: 'sdk', name: 'Agent SDK', kind: 'Agents', line: 'Runs them, as one binary.' },
    { id: 'verify', name: 'Verify', kind: 'Governance', line: 'Governs them with controls.' },
    { id: 'optimize', name: 'Optimize', kind: 'Models', line: 'Runs them on the right models.' },
  ];
  /** Line-drawn glyphs for the product cards, in a 64x64 box; each path draws with M.draw. */
  M.GLYPHS = {
    specify: ['M14 6h26l10 10v42H14z', 'M40 6v10h10', 'M22 28h20', 'M22 37h20', 'M22 46h12'],
    sdk: ['M32 8l20 12v24L32 56 12 44V20z', 'M32 32l20-12', 'M32 32L12 20', 'M32 32v24'],
    verify: ['M32 6l22 8v16c0 14-9 24-22 28-13-4-22-14-22-28V14z', 'M22 32l7 7 14-15'],
    optimize: ['M8 32h16', 'M24 32c10 0 10-18 22-18h10', 'M24 32h32', 'M24 32c10 0 10 18 22 18h10', 'M52 10l4 4-4 4', 'M52 28l4 4-4 4', 'M52 46l4 4-4 4'],
  };
  /** Builds one family card. Glow it with M.cardGlow; draw its glyph with M.cardDraw. */
  M.productCard = function (parent, prod, opts = {}) {
    const el = M.html(
      `<div class="mk-pcard${opts.compact ? ' compact' : ''}">
        <svg class="g" viewBox="0 0 64 64" aria-hidden="true">${(M.GLYPHS[prod.id] || []).map((d) => `<path d="${d}"/>`).join('')}</svg>
        <div class="kind">${prod.kind}</div>
        <div class="nm">${prod.name}</div>
        ${opts.compact ? '' : `<div class="ln">${prod.line}</div>`}
      </div>`
    );
    parent.appendChild(el);
    return el;
  };
  M.cardGlow = (el, g) => el.style.setProperty('--g', M.clamp(g).toFixed(3));
  M.cardDraw = function (el, t, start, dur = 1.1) {
    el.querySelectorAll('.g path').forEach((p, i) => M.draw(p, t, start + i * 0.12, dur));
  };

  /** The placeholder a stub scene shows until it is built. */
  M.placeholder = function (root, scene) {
    M.dotGrid(root);
    const r = M.mount(root, `
      <div class="mk-stub">
        <div class="mk-eyebrow mono" data-k="eb">Scene ${scene.id} &nbsp; ${scene.duration} s</div>
        <h2 class="mk-h2" data-k="h">${scene.title}</h2>
        <p class="mk-sub" data-k="s">Scene to come</p>
      </div>`);
    return {
      at(t) {
        M.rise(r.eb, t, 0.1);
        M.rise(r.h, t, 0.2);
        M.rise(r.s, t, 0.35);
      },
    };
  };
})();

</script>
<script>
/* ../mock/lib/cursor.js */
/* The synthetic cursor and the spotlight, driven by t like everything else.
   Both live in the scene's root, in stage pixels (1920x1080). */
(function () {
  const M = window.Mock;

  /**
   * A cursor that glides between keys and ripples on clicks.
   * keys: [{ t, x, y, click?, glide? }] in time order. The cursor arrives at (x, y) at time t, having glided
   * there over `glide` seconds (default .7, never earlier than the previous key). `click: true` ripples
   * on arrival. Before the first key and after a key with `hide: true` the cursor is hidden.
   */
  M.cursor = function (parent) {
    const el = M.html(
      '<div class="mk-cursor"><svg viewBox="0 0 24 24" width="30" height="30"><path d="M4 2l15 9-6.5 1.5L9.5 19z" fill="#fff" stroke="#111" stroke-width="1.2" stroke-linejoin="round"/></svg></div>'
    );
    const rip = M.html('<div class="mk-ripple"></div>');
    parent.append(rip, el);
    return {
      el,
      at(t, keys) {
        if (!keys.length || t < keys[0].t - (keys[0].glide ?? 0.7)) { el.style.opacity = 0; rip.style.opacity = 0; return; }
        /* the cursor fades in over .3 s when it appears or reappears after a hide, and out over .25 s on a hide */
        let x = keys[0].x, y = keys[0].y, click = null;
        let vis = M.prog(t, keys[0].t - (keys[0].glide ?? 0.7), 0.3);
        for (let i = 0; i < keys.length; i++) {
          const k = keys[i], prev = keys[i - 1];
          const g = k.glide ?? 0.7;
          const s = Math.max(k.t - g, prev ? prev.t : -Infinity);
          if (t < s) break;
          const p = prev ? M.ease.glide(M.prog(t, s, k.t - s)) : 1;
          x = prev ? M.lerp(prev.x, k.x, p) : k.x;
          y = prev ? M.lerp(prev.y, k.y, p) : k.y;
          if (prev && prev.hide) vis = M.prog(t, s, 0.3);
          if (k.hide && t >= k.t) vis = 1 - M.prog(t, k.t, 0.25);
          if (k.click && t >= k.t) click = k;
        }
        const press = click ? 1 - 0.12 * M.ramp(t, click.t - 0.02, click.t + 0.16, 0.06, 0.1) : 1;
        el.style.opacity = vis.toFixed(3);
        el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) scale(${press.toFixed(3)})`;
        if (click && t < click.t + 0.55) {
          const p = M.prog(t, click.t, 0.55);
          rip.style.opacity = (0.9 * (1 - p)).toFixed(3);
          rip.style.transform = `translate(${click.x}px, ${click.y}px) scale(${(0.3 + 1.1 * M.ease.outCubic(p)).toFixed(3)})`;
        } else rip.style.opacity = 0;
      },
    };
  };

  /**
   * A spotlight that dims everything but one rect. keys: [{ t, rect: [x, y, w, h] | null }]. The rect
   * moves to each new key over .5 s and the dim fades over .35 s. A rect is cut off above the caption
   * when it reaches into the caption's corner, so the caption sits on the dimmed page.
   */
  M.spotlight = function (parent) {
    const el = M.html('<div class="mk-spot"></div>');
    parent.appendChild(el);
    return {
      el,
      at(t, keys) {
        let rect = null, from = null, k0 = -1;
        for (let i = 0; i < keys.length; i++) if (t >= keys[i].t) k0 = i;
        if (k0 < 0) { el.style.opacity = 0; return; }
        const k = keys[k0], prev = keys[k0 - 1];
        rect = k.rect; from = prev && prev.rect;
        let o;
        if (!rect) { o = 1 - M.prog(t, k.t, 0.35); rect = from; }
        else if (!from) o = M.prog(t, k.t, 0.35);
        else o = 1;
        if (!rect) { el.style.opacity = 0; return; }
        let r = rect;
        if (from && k.rect) {
          const p = M.ease.css(M.prog(t, k.t, 0.5));
          r = rect.map((v, i) => M.lerp(from[i], v, p));
        }
        let [x, y, w, h] = r;
        const cap = M.stageInfo && M.stageInfo.caption;
        if (cap && x < cap.x + cap.w && x + w > cap.x && y + h > cap.y - 16) h = Math.max(0, cap.y - 16 - y);
        M.set(el, { opacity: o.toFixed(3), left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
      },
    };
  };
})();

</script>
<script>
/* ../mock/lib/console.js */
/* The console frame: a browser window with a breadcrumb, holding the local console's shell (top bar,
   left nav, bottom bar) in its dark theme. Scenes fill `page` with their mock of one view.

   The console is laid out at its own logical size and scaled up (default 1.2), the way the recordings
   capture a 1600x900 viewport at device scale 1.2. */
(function () {
  const M = window.Mock;

  const NAV = [
    { items: ['Now', 'System'] },
    { group: 'Specify', items: ['Build', 'Test'] },
    { group: 'Verify', items: ['Controls', 'Activity', 'Human', 'Evidence'] },
    { group: 'Optimize', items: ['Cost', 'Inference', 'Training'] },
  ];

  /**
   * opts: { crumb: 'Verify › Controls', active: 'Controls', title: 'Controls', url, rect: [x, y, w, h] (default the full stage),
   *         scale: 1.2, system: 'loan-origination', env: 'Local', bundle: 'v3', band: true,
   *         tabs: ['Stages', 'Tasks'], tab: 'Stages' (the view switch beside the title),
   *         status: 'Nothing needs attention' (an extra bottom-bar item, HTML) }
   * Returns { el, page, band, bandRight, tabs, status, bundle, chrome } where page is the content area below
   * the title band, status is the extra bottom-bar item and bundle the bottom bar's bundle name.
   */
  M.consoleFrame = function (parent, opts = {}) {
    const [x, y, w, h] = opts.rect || [0, 0, 1920, 1080];
    const s = opts.scale ?? 1.2;
    const CH = 44; /* browser chrome height, in stage px */
    const lw = (w / s).toFixed(1), lh = ((h - CH) / s).toFixed(1);
    const crumb = opts.crumb || '';
    const active = opts.active || crumb.split('›').pop().trim();
    const url = opts.url || 'localhost:9889/' + crumb.toLowerCase().split('›').map((p) => p.trim().replace(/\s+/g, '-')).join('/');
    const nav = NAV.map((g) =>
      (g.group ? `<div class="grp">${g.group}</div>` : '') +
      g.items.map((i) => `<div class="it${i === active ? ' on' : ''}">${i}</div>`).join('')
    ).join('');
    const tabs = opts.tabs ? `<span class="tabs" data-k="tabs">${opts.tabs.map((n) => `<span${n === opts.tab ? ' class="on"' : ''}>${n}</span>`).join('')}</span>` : '';
    const r = M.mount(parent, `
      <div class="mk-browser" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">
        <div class="chrome" data-k="chrome">
          <span class="dots"><i></i><i></i><i></i></span>
          <span class="crumb">${crumb.replace(/›/g, '<b>›</b>')}</span>
          <span class="url">${url}</span>
        </div>
        <div class="mk-console" style="width:${lw}px;height:${lh}px;transform:scale(${s})">
          <div class="top">
            <span class="mark">${M.markSVG(13, '#ececf1')}</span>
            <span class="sel"><b>SYSTEM</b>${opts.system || 'loan-origination'}</span>
            <span class="sel"><b>ENVIRONMENT</b>${opts.env || 'Local'}</span>
            <span class="right"><span class="ask">Ask</span><span class="ic">?</span></span>
          </div>
          <div class="frame">
            <div class="left">${nav}</div>
            <div class="main">
              ${opts.band === false ? '' : `<div class="band" data-k="band"><h1>${opts.title || active}</h1>${tabs}<span class="right" data-k="bandRight"></span></div>`}
              <div class="page" data-k="page"></div>
            </div>
          </div>
          <div class="bottom"><span><b>loan-origination</b> · 4 services running</span><span>Bundle <b data-k="bundle">${opts.bundle || 'v3'}</b> in force</span>${opts.status != null ? `<span data-k="status">${opts.status}</span>` : ''}<span class="sp"></span><span>SDK 3.7.0</span></div>
        </div>
      </div>`);
    return { el: r.root, page: r.page, band: r.band, bandRight: r.bandRight, tabs: r.tabs, status: r.status, bundle: r.bundle, chrome: r.chrome, scale: s };
  };
})();

</script>
<script>
/* ../mock/lib/caption.js */
/* The caption: a designed lower third in the site's language. An eyebrow names the act ("Govern"), a hairline rule separates it from the line, and the line is Instrument Sans at a calm
   size on a soft, blurred backdrop. A long narration is shown a sentence at a time (short sentences
   share a line), each timed by its share of the words. Under a chapter card the caption waits for the
   card to go.

   Each scene declares the zone the caption owns (captionZone); M.ZONES gives the rect the scene must keep
   empty. A camera move can carry the caption to another zone (see lib/camera.js). */
(function () {
  const M = window.Mock;
  const W = 1920, H = 1080, PW = 820, MARGIN = 72, BOTTOM = 48;

  /** The rect, in stage px, that each zone guarantees to the caption. Keep the scene's content out of it. */
  M.ZONES = {
    'bottom-left': { x: 0, y: 836, w: PW + MARGIN + 40, h: H - 836, left: MARGIN },
    'bottom-right': { x: W - (PW + MARGIN + 40), y: 836, w: PW + MARGIN + 40, h: H - 836, left: W - MARGIN - PW },
    'bottom': { x: (W - PW) / 2 - 40, y: 836, w: PW + 80, h: H - 836, left: (W - PW) / 2 },
  };
  M.ZONES.left = M.ZONES['bottom-left'];

  /**
   * Splits narration into caption lines at sentence ends only, so every line starts a sentence. Consecutive
   * sentences share a line while together they are at most `max` characters; a longer sentence is one line
   * that wraps.
   */
  M.splitCaption = function (text, max = 96) {
    const parts = text.split(/(?<=[.!?])\s+/);
    const out = [];
    parts.forEach((p) => {
      const last = out[out.length - 1];
      if (last && (last + ' ' + p).length <= max) out[out.length - 1] = last + ' ' + p;
      else out.push(p);
    });
    return out;
  };

  /**
   * The span of scene-local real time over which the caption reads the narration: from 0.35 s after the
   * card to 0.6 s before the scene ends, or, with voice timing, exactly the narration clip.
   */
  M.captionWindow = function (s) {
    const t0 = (s.cardDur || 0) + 0.35;
    return [t0, s.clip != null ? t0 + s.clip : (s.len || s.duration) - 0.6];
  };

  /**
   * The scene time (from the end of its chapter card) at which the caption reaches the first word that
   * starts with `word` at or after word index `from`, on the same word-share clock the caption lines use.
   * Scenes key what they highlight to this, so a highlight lands while its words are being read.
   */
  M.captionAt = function (s, word, from = 0) {
    const words = s.caption.split(/\s+/);
    let i = words.findIndex((w, k) => k >= from && w.replace(/^\W+/, '').startsWith(word));
    if (i < 0) i = words.length;
    const c = s.cardDur || 0, [t0, t1] = M.captionWindow(s);
    /* in the scene's designed time, which a voiced scene stretches by warp */
    return (t0 + ((t1 - t0) * i) / words.length - c) / (s.warp || 1);
  };

  M.Caption = {
    build(stage) {
      this.r = M.mount(stage, `
        <div id="caption"><div class="scrim"></div><div class="panel" data-k="panel">
          <div class="eb" data-k="eb"></div><div class="rule" data-k="rule"></div><div class="lines" data-k="lines"></div>
        </div></div>`);
    },

    enter(s, act) {
      const r = this.r;
      const zone = s.captionZone || s.captionPosition || 'bottom-left';
      this.zone = zone;
      r.eb.textContent = (act && act.label) || '';
      r.lines.innerHTML = '';
      const chunks = M.splitCaption(s.caption);
      const words = chunks.map((c) => c.split(/\s+/).length), total = words.reduce((a, b) => a + b, 0);
      const [t0, t1] = M.captionWindow(s);
      let acc = 0;
      this.lines = chunks.map((c, i) => {
        const el = document.createElement('div');
        el.className = 'ln';
        el.textContent = c;
        r.lines.appendChild(el);
        const a = t0 + ((t1 - t0) * acc) / total;
        acc += words[i];
        return { el, a };
      });
      /* a sentence that would wrap to four rows sets smaller on a wider panel, so the panel stays in its zone */
      const tallest = () => Math.max(...this.lines.map((l) => l.el.offsetHeight));
      r.root.classList.remove('long');
      this.long = tallest() > 3.5 * 26 * 1.36;
      r.root.classList.toggle('long', this.long);
      r.lines.style.height = tallest() + 'px';
      this.place(zone, zone, 1);
      const p = r.panel;
      M.stageInfo.caption = Object.assign({}, M.ZONES[zone], { zone, panel: { x: p.offsetLeft, y: p.offsetTop, w: p.offsetWidth, h: p.offsetHeight } });
    },

    place(from, to, p) {
      const a = M.ZONES[from] || M.ZONES['bottom-left'], b = M.ZONES[to] || a;
      /* the wider panel of a long line grows away from the stage's edge */
      const grow = (z) => (this.long ? (z === M.ZONES['bottom-right'] ? 40 : z === M.ZONES.bottom ? 20 : 0) : 0);
      this.r.panel.style.left = M.lerp(a.left - grow(a), b.left - grow(b), p).toFixed(1) + 'px';
      this.r.root.classList.toggle('right', (p < 0.5 ? from : to) === 'bottom-right');
    },

    at(local, s) {
      const r = this.r;
      const c = s.cardDur || 0;
      const inP = M.p(local, c + 0.25, 0.7), outP = M.p(local, (s.len || s.duration) - 0.5, 0.4, 'inOutCubic');
      r.panel.style.opacity = (M.ease.css(M.prog(local, c + 0.25, 0.5)) * (1 - outP)).toFixed(3);
      r.panel.style.transform = `translateY(${((1 - inP) * 18 + outP * 8).toFixed(1)}px)`;
      r.root.querySelector('.scrim').style.opacity = (M.prog(local, c + 0.1, 0.8) * (1 - outP)).toFixed(3);
      r.rule.style.transform = `scaleX(${M.p(local, c + 0.45, 0.8, 'outCubic').toFixed(3)})`;
      /* a line hands over to the next with a short overlap, so the panel is never empty between lines */
      this.lines.forEach((l, i) => {
        const next = this.lines[i + 1];
        const a0 = i ? l.a - 0.12 : l.a + 0.15;
        const li = M.p(local, a0, 0.55);
        const lo = next ? M.p(local, next.a - 0.3, 0.3, 'inOutCubic') : 0;
        l.el.style.opacity = (M.ease.css(M.prog(local, a0, 0.45)) * (1 - lo)).toFixed(3);
        l.el.style.transform = `translateY(${((1 - li) * 14 - lo * 10).toFixed(1)}px)`;
      });
      const mv = M.stageInfo.captionMove;
      if (mv) this.place(mv.from, mv.to, mv.p);
      else this.place(this.zone, this.zone, 1);
    },
  };
})();

</script>
<script>
/* ../mock/lib/camera.js */
/* The camera and live time.

   camera: a scene puts its content in a world layer (M.world) and calls M.camera(world, t, keys) from at().
   Each key eases the world to frame a subject rect (in unzoomed stage px) inside the area the caption
   leaves free, and back with rect: null. The world is laid out at full 1920x1080 size and only ever
   transformed, so Chrome rasterises text at the zoomed scale and it stays crisp. Never set will-change on
   anything inside a world: it freezes the raster at scale 1 and blurs the zoom.

   live time: M.abs(t) is a clock that has been running long before the scene is seen, so loops and
   counters built on it are mid-motion on the scene's first frame. */
(function () {

  M.CAM_MAX = 1.8;

  /** A full-stage layer for the camera to move. */
  M.world = function (root) {
    const el = document.createElement('div');
    el.className = 'mk-world';

  };

  /** The free area for a subject: the stage less the caption zone's band, inset by a margin. */
  M.safeArea = function (zone) {
    const z = M.ZONES[zone] || M.ZONES['bottom-left'];
    return [48, 48, W - 96, z.y - 48 - 24];
  };

  /** The view { s, x, y } that frames rect inside the safe area, at most M.CAM_MAX, never showing past the stage. */
  M.frameRect = function (rect, zone, pad = 36) {
    if (!rect) return { s: 1, x: 0, y: 0 };
    const [sx, sy, sw, sh] = M.safeArea(zone);
    const [x, y, w, h] = rect;
    const s = M.clamp(Math.min(sw / (w + 2 * pad), sh / (h + 2 * pad)), 1, M.CAM_MAX);
    let tx = sx + sw / 2 - s * (x + w / 2), ty = sy + sh / 2 - s * (y + h / 2);

  };

  /**
   * keys: [{ t, rect: [x, y, w, h] | null, dur?: 1.1, caption?: zone }] in time order.
   * At key.t the camera starts a move (eased in-out over dur, 0.8-1.4 s) from wherever it is to the view
   * framing key.rect. A key with caption: 'bottom-right' carries the caption to that zone during the move
   * and frames the subject around the new zone. Returns the current view.

  M.camera = function (el, t, keys) {
    const base = (M.stageInfo.scene && (M.stageInfo.scene.captionZone || M.stageInfo.scene.captionPosition)) || 'bottom-left';
    let view = { s: 1, x: 0, y: 0 }, zone = base, move = null;

      if (t < k.t) break;
      const to = k.caption || zone;
      const target = M.frameRect(k.rect, to);
      const p = M.ease.inOutCubic(M.prog(t, k.t, k.dur ?? 1.1));
      const from = view;
      view = { s: M.lerp(from.s, target.s, p), x: M.lerp(from.x, target.x, p), y: M.lerp(from.y, target.y, p) };
      move = null;
      if (to !== zone) { if (p >= 1) zone = to; else move = { from: zone, to, p }; }
    }
    if (!move && zone !== base) move = { from: zone, to: zone, p: 1 };

    el.style.transform = view.s === 1 && !view.x && !view.y ? 'none' : `translate(${view.x.toFixed(2)}px, ${view.y.toFixed(2)}px) scale(${view.s.toFixed(4)})`;
    M.stageInfo.captionMove = move;
    return view;
  };

  /** Seconds on a clock that started PREROLL seconds before the video: use it for anything live. */
  M.PREROLL = 90;
  M.abs = function (t) {
    const s = M.stageInfo.scene;
    return M.PREROLL + (s ? s.begin + s.cardDur : 0) + t;
  };
  /** Phase 0..1 of a loop with this period, on the live clock. */
  M.loop = (t, period, offset = 0) => (((M.abs(t) + offset) / period) % 1 + 1) % 1;
  /** A counter that has been ticking at `rate` a second since long before the scene. */
  M.ticker = (t, base, rate) => base + rate * M.abs(t);
  /** Deterministic noise in 0..1 for an integer seed: jitter for live figures without randomness. */
  M.noise = function (n) {
    const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;

  };

  M.wander = function (t, speed = 0.5, seed = 0) {

    const k = f * f * (3 - 2 * f);
    return M.lerp(M.noise(i + seed * 101), M.noise(i + 1 + seed * 101), k);
  };

  function buildLoop(host) {
    const svg = M.svg('svg', { viewBox: '0 0 320 320', class: 'loop' }, host);
    M.svg('circle', { cx: C, cy: C, r: R, class: 'ring' }, svg);
    const gap = (((NODE + 7) / R) * 180) / Math.PI;
    const arcs = STAGES.map((_, i) => {
      const from = i * 60 + gap, to = (i + 1) * 60 - gap;
      const [x1, y1] = pt(from), [x2, y2] = pt(to);
      const d = `M${x1.toFixed(2)},${y1.toFixed(2)} A${R},${R} 0 0 1 ${x2.toFixed(2)},${y2.toFixed(2)}`;
      const glow = i === 5 ? M.svg('path', { d, class: 'glow' }, svg) : null;
      const path = M.svg('path', { d, class: 'arc' }, svg);
      const [hx, hy] = pt(to), [bx, by] = pt(to - 5, R - 5), [cx, cy] = pt(to - 5, R + 5);
      const head = M.svg('path', { d: `M${hx},${hy} L${bx},${by} L${cx},${cy} Z`, class: 'ah' }, svg);
      return { path, head, glow };
    });
    const [lx, ly] = pt(330, R + 30);
    const al = M.svg('text', { x: lx, y: ly + 4, class: 'al', 'text-anchor': 'middle' }, svg);
    al.textContent = 'Amend';
    const nodes = STAGES.map(([, name], i) => {
      const [x, y] = pt(i * 60);
      const g = M.svg('g', { class: 'node idle' }, svg);
      const halo = M.svg('circle', { cx: x, cy: y, r: NODE, class: 'halo' }, g);
      M.svg('circle', { cx: x, cy: y, r: NODE, class: 'c' }, g);
      const n = M.svg('text', { x, y: y - 1, class: 'n', 'text-anchor': 'middle' }, g);
      n.textContent = name;
      const s = M.svg('text', { x, y: y + 14, class: 's', 'text-anchor': 'middle' }, g);
      return { g, halo, s };
    });
    const mk = (y, c) => M.svg('text', { x: C, y, class: c, 'text-anchor': 'middle' }, svg);
    const big = mk(C + 4, 'big'), s1 = mk(C + 25, 'small'), s2 = mk(C + 42, 'small');
    const trig = M.svg('g', { class: 'trig' }, svg);
    const tr = M.svg('rect', { x: C - 52, y: C + 52, width: 104, height: 24, rx: 12 }, trig);
    const tt = M.svg('text', { x: C, y: C + 68.5, 'text-anchor': 'middle' }, trig);
    tt.textContent = 'Code changed';
    return { svg, arcs, al, nodes, big, s1, s2, trig, tr };
  }

          list.push({ at, id: c.id, nm: c.n, tone: c.tone, v: c.v, bn: after ? 'v4' : 'v3', rg: c.reg, key: 'n' + n });
        }
        if (tau >= K.confirm) list.push({ at: ev('confirm'), id: 'profile', nm: 'Data types confirmed · T. Jewell', tone: 'ok', v: 'Confirmed', bn: 'v3', rg: 'GDPR Art. 9', key: 'cf' });

        list.sort((a, b) => b.at - a.at);
        const fill = (x, it) => {
          txt(x.c.tm, hms(CLOCK + it.at)); txt(x.c.id, it.id); txt(x.c.nm, it.nm); chip(x.c.ch, it.tone, it.v); txt(x.c.bn, it.bn); txt(x.c.rg, it.rg);
        };

        this.pin.root.style.display = pin ? '' : 'none';
        if (pin) {
          fill(this.pin, pin);
          cls(this.pin.root, 'er pin ' + pin.cl);
          const q = M.p(now, pin.at, 0.5);
          this.pin.root.style.top = '0px';
          this.pin.root.style.opacity = q.toFixed(3);

        });

    },
  };
})();

    const gap = (((NODE + 7) / R) * 180) / Math.PI;
    let s = `<svg class="loop" viewBox="0 0 320 320"><circle class="ring" cx="${C}" cy="${C}" r="${R}"/>`;
    STAGES.forEach((_, i) => {
      const from = i * 60 + gap, to = (i + 1) * 60 - gap;
      const [x1, y1] = at(from), [x2, y2] = at(to), [bx, by] = at(to - 5, R - 5), [cx, cy] = at(to - 5, R + 5);
      s += `<path class="arc idle" d="M${x1},${y1} A${R},${R} 0 0 1 ${x2},${y2}"/><path class="ah idle" d="M${x2},${y2} L${bx},${by} L${cx},${cy} Z"/>`;
    });
    STAGES.forEach(([, name], i) => {
      const [x, y] = at(i * 60);
      s += `<g class="node idle"><circle class="halo" cx="${x}" cy="${y}" r="${NODE}"/><circle class="c" cx="${x}" cy="${y}" r="${NODE}"/>
        <text class="n" x="${x}" y="${y - 1}" text-anchor="middle">${name}</text><text class="s" x="${x}" y="${y + 13}" text-anchor="middle"></text></g>`;
    });
    s += `<text class="big" x="${C}" y="${C + 4}" text-anchor="middle"></text><text class="small" x="${C}" y="${C + 26}" text-anchor="middle"></text><text class="small s2" x="${C}" y="${C + 43}" text-anchor="middle"></text></svg>`;
    return s;
  }

  /** Stage rects of the view's parts, measured unzoomed once (the player boots after the web fonts load). */
  function measure(view) {
    if (view.rects) return view.rects;
    const r = (el) => M.rectOf(view.world, el);
    const ctr = (el) => { const [x, y, ww, h] = r(el); return [x + ww / 2, y + h / 2]; };
    const v = view.v;
    view.rects = {
      stage: r(v.stage), board: r(v.board), loop: r(v.loopP), hero: [r(v.loopP)[0], r(v.loopP)[1], r(v.board)[0] + r(v.board)[2] - r(v.loopP)[0], r(v.board)[3]],
      L: r(v.L), R: r(v.R), segs: r(v.Lsegs), de: r(view.segs[2].el), dcard: r(v.dcard), res: r(v.Rres),
      bStart: ctr(v.bStart), bAdv: ctr(v.bAdv), bPro: ctr(v.bPro),
    };
    /* the segments table with its heading, for a push-in */
    const sh = r(v.sh), sg = view.rects.segs;
    view.rects.segBlock = [sg[0] - 8, sh[1] - 6, sg[2] + 16, sg[1] + 5 * 34 * 1.2 - sh[1]];
    view.rects.resBlock = [view.rects.R[0] - 8, view.rects.R[1] - 8, view.rects.R[2] + 16, 226 * 1.2];
    return view.rects;
  }

  /** The demo clock: experiment seconds x (0 at the start of 4.3) to "10-DD HH:MM", 2 simulated hours a second. */
  function clock(x) {
    const h = 1.6 + 2 * x, mins = Math.round(h * 60);
    const d = 18 + Math.floor(mins / 1440), hh = Math.floor((mins % 1440) / 60), mm = mins % 60;
    return `10-${d} ${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
  }

  /**
   * state: { x, status: [word, tone], stages: {key: status}, notes: {key: text}, center: [a, b, c?],
   *   board: { n, v: {quality, cost, p95, errors}, w: {quality}, spend }, segs: [{ q, calls, served, flash, tint, badge }],
   *   panes: { Lshadow, Lsegs, Ldec, Rshadow, Rcanary, Rdec, Rpro, Rres } (opacity 0..1), stageTitle, stageRight,
   *   share, graded, attention, hbtn }
   */
  function set(view, st, t) {
    const v = view.v;
    txt(view.br.clk, clock(st.x));
    txt(v.status, st.status[0]);
    cls(v.status, 'chip st ' + st.status[1]);
    if (st.hbtn && v.hbtn.dataset.s !== st.hbtn.join('|')) {
      v.hbtn.dataset.s = st.hbtn.join('|');
      v.hbtn.innerHTML = st.hbtn.map((b) => `<span class="btn">${b}</span>`).join('');
    }
    txt(view.att, st.attention ? '1 needs attention' : 'Nothing needs attention');
    cls(view.att, 'att' + (st.attention ? ' on' : ''));

    /* the loop */
    const order = STAGES.map(([k]) => k);
    const halo = M.loop(t, 1.8);
    order.forEach((k, i) => {
      const s = st.stages[k] || 'idle', nx = order[(i + 1) % 6], ns = st.stages[nx] || 'idle';
      let a;
      if (i === 5) a = s === 'now' ? 'next' : 'idle';
      else if (ns === 'held') a = 'held';
      else if (ns === 'now') a = 'now';
      else a = (s === 'done' || s === 'skipped') && ns === 'done' ? 'done' : 'idle';
      cls(view.arcs[i], 'arc ' + a);
      cls(view.ahs[i], 'ah ' + a);
      const n = view.nodes[i];
      cls(n, 'node ' + s);
      const h = n.querySelector('.halo');
      const live = s === 'now' || s === 'held';
      h.style.opacity = live ? (0.55 * (1 - halo)).toFixed(3) : 0;
      h.style.transform = `scale(${(1 + 0.35 * halo).toFixed(3)})`;
      txt(n.querySelector('.s'), (st.notes && st.notes[k]) || (s === 'done' ? '✓' : ''));
    });
    txt(view.big, st.center[0]);
    txt(view.sm[0], st.center[1] || '');
    txt(view.sm[1], st.center[2] || '');
    v.rdots.innerHTML !== dots(order.map((k) => st.stages[k] || '')) && (v.rdots.innerHTML = dots(order.map((k) => st.stages[k] || '')));

    /* the limits board */
    const b = st.board;
    txt(v.n, b.n);
    LIMITS.forEach((l, i) => {
      const r = view.lims[i], val = b.v[l.key], wv = b.w && b.w[l.key];
      r.dot.style.left = pos(val, l.span).toFixed(2) + '%';
      if (wv != null) { r.worst.style.display = ''; r.worst.style.left = pos(wv, l.span).toFixed(2) + '%'; r.worst.classList.toggle('out', !within(l, wv)); }
      else r.worst.style.display = 'none';
      txt(r.v, fmtV(val, l.unit));
      const ok = within(l, val) && (wv == null || within(l, wv));
      txt(r.chip, ok ? 'Within' : 'Outside');
      cls(r.chip, 'chip st ' + (ok ? 'ok' : 'bad'));
    });
    v.used.style.width = ((b.spend / 40) * 100).toFixed(2) + '%';
    txt(v.spend, `$${b.spend.toFixed(2)} of $40 budget`);

    /* the stage panel */
    txt(v.sh, st.stageTitle);
    txt(v.shr, st.stageRight || '');
    for (const k of ['Lshadow', 'Lsegs', 'Ldec', 'Rshadow', 'Rcanary', 'Rdec', 'Rpro', 'Rres']) {
      const o = (st.panes && st.panes[k]) || 0;
      v[k].style.opacity = o.toFixed(3);
      v[k].style.visibility = o > 0.001 ? 'visible' : 'hidden';
      v[k].style.transform = o < 1 ? `translateY(${((1 - o) * 8).toFixed(1)}px)` : 'none';
    }
    if (st.segs) st.segs.forEach((s, i) => {
      const r = view.segs[i];
      txt(r.c, M.fmt.int(s.calls));
      txt(r.q, fmtV(s.q, '%'));
      const ok = s.q >= -3;
      txt(r.chip, ok ? 'Within' : 'Outside');
      cls(r.chip, 'chip st ' + (ok ? 'ok' : 'bad'));
      txt(r.sv, s.served);
      r.badge.style.opacity = (s.badge || 0).toFixed(3);
      r.el.style.background = s.flash || s.tint ? `rgba(255,84,0,${(0.1 * (s.tint || 0) + 0.26 * (s.flash || 0)).toFixed(3)})` : '';
      r.el.style.boxShadow = s.ring ? `inset 0 0 0 1px rgba(255,84,0,${(0.7 * s.ring).toFixed(3)})` : '';
    });
    if (st.graded != null) {
      v.gm.style.width = ((Math.min(st.graded, 2000) / 2000) * 100).toFixed(2) + '%';
      txt(v.gv, `${M.fmt.int(st.graded)} of 2,000`);
    }
    if (st.share != null) {
      const s = st.share;
      v.cand.style.width = s.toFixed(2) + '%';
      v.knob.style.left = (100 - s).toFixed(2) + '%';
      txt(v.la, `Frontier model ${Math.round(100 - s)}%`);
      txt(v.lb, `Small model ${Math.round(s)}%`);
    }
    return v;
  }

  /** A control's centre in stage px, measured now: buttons that appear mid-scene have no place until shown. */
  function centerOf(view, el) {
    const [x, y, w, h] = M.rectOf(view.world, el);
    return [x + w / 2, y + h / 2];
  }

  return { build, measure, set, clock, centerOf, LIMITS, SEG_SHARE };
})();

</script>
<script>
/* lib/kit.js */
/* Deck helpers on top of window.Mock (../mock/lib). Everything that moves takes the slide's time t and
   writes the state for that instant, as in the film: a slide is a pure function of t.

   Talk.camera frames a subject inside the whole stage. The deck has no caption, so unlike Mock.camera
   there is no caption zone to keep clear, and it may push in further (2.4x by default) because a
   console screen must be read from the back of the room. */
(function () {
  const M = window.Mock;
  const W = 1920, H = 1080;
  const T = (window.Talk = window.Talk || {});

  T.SAFE = [56, 56, W - 112, H - 112];
  T.CAM_MAX = 2.4;

  /** The view { s, x, y } that frames rect, at most max, never showing past the stage's edge. */
  T.frameRect = function (rect, pad = 36, max = T.CAM_MAX) {
    if (!rect) return { s: 1, x: 0, y: 0 };
    const [sx, sy, sw, sh] = T.SAFE;
    const [x, y, w, h] = rect;
    const s = M.clamp(Math.min(sw / (w + 2 * pad), sh / (h + 2 * pad)), 1, max);
    let tx = sx + sw / 2 - s * (x + w / 2), ty = sy + sh / 2 - s * (y + h / 2);
    tx = M.clamp(tx, W - W * s, 0);
    ty = M.clamp(ty, H - H * s, 0);
    return { s, x: tx, y: ty };
  };

  /**
   * keys: [{ t, rect: [x, y, w, h] | null, dur?: 1.1, max?, pad? }] in time order. At key.t the camera
   * eases (in-out cubic over dur) from wherever it is to the view framing key.rect; null is the full frame.
   */
  T.camera = function (el, t, keys) {
    let view = { s: 1, x: 0, y: 0 };
    for (const k of keys) {
      if (t < k.t) break;
      const target = T.frameRect(k.rect, k.pad ?? 36, k.max ?? T.CAM_MAX);
      const p = M.ease.inOutCubic(M.prog(t, k.t, k.dur ?? 1.1));
      view = { s: M.lerp(view.s, target.s, p), x: M.lerp(view.x, target.x, p), y: M.lerp(view.y, target.y, p) };
    }
    el.style.transformOrigin = '0 0';
    el.style.transform = view.s === 1 && !view.x && !view.y ? 'none' : `translate(${view.x.toFixed(2)}px, ${view.y.toFixed(2)}px) scale(${view.s.toFixed(4)})`;
    return view;
  };

  /** Text that changes only when it must (keeps layout work out of ambient frames). */
  T.txt = (el, s) => { if (el._t !== s) { el.textContent = s; el._t = s; } };
  T.htm = (el, s) => { if (el._h !== s) { el.innerHTML = s; el._h = s; } };

  /** A headline split into masked lines that rise in turn: T.lines(parent, ['Two', 'clocks.'], 'tk-h'). */
  T.lines = function (parent, lines, cls = 'tk-h') {
    const box = M.html(`<div class="${cls}">${lines.map((l) => `<div class="ln-mask"><div class="ln">${l}</div></div>`).join('')}</div>`);
    parent.appendChild(box);
    return { el: box, ln: [...box.querySelectorAll('.ln')] };
  };
  T.linesAt = function (h, t, start, gap = 0.12, dur = 1.0) {
    h.ln.forEach((l, i) => M.lineRise(l, t, start + i * gap, dur));
  };

  /** Smooth path through points [[x, y], ...] (Catmull-Rom as cubic Béziers). */
  T.smooth = function (pts, k = 0.5) {
    if (pts.length < 2) return '';
    let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      const c1 = [p1[0] + ((p2[0] - p0[0]) * k) / 3, p1[1] + ((p2[1] - p0[1]) * k) / 3];
      const c2 = [p2[0] - ((p3[0] - p1[0]) * k) / 3, p2[1] - ((p3[1] - p1[1]) * k) / 3];
      d += ` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
    }
    return d;
  };

  /**
   * A section card: the act's line in hero type on black, the dot grid, and a slow band of light that
   * crosses the grid while it holds. lines: ['Governance has to', '<span class="tk-y">change shape.</span>'].
   * Call T.cardAt(card, t) from at(t); the line has risen by t = 1.4.
   */
  T.card = function (root, lines) {
    M.style('tk-card-sec', `
      .tk-sec .glow { left: -600px; top: 0; width: 600px; height: 1080px; background: radial-gradient(closest-side, rgba(255,206,74,.10), rgba(255,206,74,0)); }
      .tk-sec .hd { left: var(--gut); top: 400px; right: var(--gut); }
      .tk-sec .hd .tk-hero { font-size: 140px; }
    `);
    root.classList.add('tk-sec');
    const grid = M.dotGrid(root);
    const glow = M.html('<div class="glow"></div>');
    root.appendChild(glow);
    const h = T.lines(root.appendChild(M.html('<div class="hd"></div>')), lines, 'tk-hero');
    return { grid, glow, h };
  };
  T.cardAt = function (c, t) {
    M.fade(c.grid, t, 0, 1.2);
    T.linesAt(c.h, t, 0.25, 0.14, 1.1);
    const u = M.loop(t, 14);
    c.glow.style.transform = `translateX(${(u * 3100).toFixed(1)}px)`;
  };

  /** A slide still to be built: its title and the beat it is on, so the deck runs end to end. */
  T.stub = function (def) {
    registerSlide(Object.assign({
      render(root) {
        M.dotGrid(root);
        this.r = M.mount(root, `<div class="tk-top"><div class="tk-eb">Slide to come</div><h2 class="tk-h">${def.title}</h2><p class="tk-m" data-k="b"></p></div>`);
      },
      at(t) {
        M.rise(this.r.root, t, 0);
        let k = 0;
        this.beats.forEach((b, i) => { if (t >= b.t - 1e-6) k = i; });
        T.txt(this.r.b, `Beat ${k + 1} of ${this.beats.length}`);
      },
    }, def));
  };

  /** The line glyphs for the five control types, in a 64x64 box, drawn with M.draw. */
  T.GLYPH = {
    Guardrail: ['M10 32h44', 'M32 10v44', 'M18 18l28 28'].slice(0, 0).concat(['M32 6l22 8v16c0 14-9 24-22 28-13-4-22-14-22-28V14z', 'M23 23l18 18', 'M41 23L23 41']),
    Evaluation: ['M8 50h48', 'M14 50V34', 'M26 50V22', 'M38 50V28', 'M50 50V12'],
    Human: ['M32 30a10 10 0 1 0 0-20a10 10 0 1 0 0 20z', 'M12 56c0-12 9-20 20-20s20 8 20 20'],
    Gate: ['M12 56V14', 'M52 56V14', 'M12 22h40', 'M12 34h40', 'M32 22v12'],
    Sanitizer: ['M8 20h48', 'M8 32h20', 'M36 32h20', 'M8 44h48', 'M28 26h8v12h-8z'],
  };
})();
