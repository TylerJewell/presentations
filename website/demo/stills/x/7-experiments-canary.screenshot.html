<!DOCTYPE html>

<head>

<link rel="stylesheet" href="stills.css">
<style>
  .text { width: 2240px; }

<script>

  crop: [320, 80],
  win: [160, 440, 2240, 1040],
  tilt: 5,
  spot: [672, 253, 1856, 464],
  callouts: [
    { at: [853, 632], text: 'Canary at 25%, day 7', side: 'left' },
    { at: [2458, 619], text: 'Within its limits', side: 'bottom end' },
