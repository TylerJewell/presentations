<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Verify: every call traced</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=block" rel="stylesheet">
<link rel="stylesheet" href="stills.css">
<style>
  .text { width: 2240px; }
  .inset { position: absolute; border-radius: 16px; background-repeat: no-repeat; background-color: #0b0b0d;
    box-shadow: 0 0 0 2px var(--yellow), 0 30px 90px rgba(0,0,0,.85), 0 0 60px rgba(255,206,74,.25); }
  .layer > .dim { position: absolute; }
  .wire { position: absolute; inset: 0; overflow: visible; }
</style>
</head>
<body>
<div id="root"></div>
<script>
// Two subjects in one window: the step chain and the waterfall stay lit, everything between them dims.
const HOLES = [[328, 443, 2202, 122], [345, 1046, 1592, 352]];
// The inset is a second crop of a real screenshot: the same trace's Exchange tab, what the gateway did.
const INSET = { src: 'src/trace-exchange-2560.webp', from: [322, 872, 620, 512], at: [1944, 893] };
const MODEL = [1656, 445, 429, 118];   // the MODEL step card, screenshot pixels
window.STILL = {
  eyebrow: 'Verify',
  title: 'Every call traced from end user to model.',
  sub: 'Each step and span of one request, on one time axis.',
  src: 'src/replay-trace-2560.webp',
  crop: [300, 405],
  win: [140, 400, 2280, 1040],
  tilt: 5,
  spot: null,
  overlay(layer, toWin) {
    /* a cover over the status bar at the foot of the window */
    const f = document.createElement("div");
    Object.assign(f.style, { position: "absolute", left: 0, right: 0, bottom: 0, height: "34px", background: "#0b0b0d" });
    layer.appendChild(f);
    const p = (x, y) => toWin(x, y).join('px ') + 'px';
    const holes = HOLES.map(([x, y, w, h]) => `, ${p(x, y)}, ${p(x, y + h)}, ${p(x + w, y + h)}, ${p(x + w, y)}, ${p(x, y)}`).join(', 0 0');
    const dim = document.createElement('div');
    dim.className = 'dim';
    dim.style.clipPath = `polygon(evenodd, 0 0, 100% 0, 100% 100%, 0 100%, 0 0${holes})`;
    layer.appendChild(dim);
    HOLES.forEach(([x, y, w, h]) => {
      const [rx, ry] = toWin(x, y), r = document.createElement('div');
      r.className = 'ring';
      Object.assign(r.style, { position: 'absolute', left: rx - 10 + 'px', top: ry - 10 + 'px', width: w + 20 + 'px', height: h + 20 + 'px' });
      layer.appendChild(r);
    });
    const [ix, iy] = toWin(INSET.at[0], INSET.at[1]);
    const wx = toWin(2010, 0)[0], [, my] = toWin(0, MODEL[1] + MODEL[3] + 10);
    layer.insertAdjacentHTML('beforeend', `
      <svg class="wire" width="100%" height="100%">
        <path d="M ${wx} ${my} V ${iy}" fill="none" stroke="#ffce4a" stroke-width="3"/>
        <circle cx="${wx}" cy="${my}" r="7" fill="#ffce4a"/>
      </svg>`);
    const card = document.createElement('div');
    card.className = 'inset';
    Object.assign(card.style, { left: ix + 'px', top: iy + 'px', width: INSET.from[2] + 'px', height: INSET.from[3] + 'px',
      backgroundImage: `url(${INSET.src})`, backgroundPosition: `${-INSET.from[0]}px ${-INSET.from[1]}px` });
    layer.appendChild(card);
  },
  callouts: [
    { at: [900, 1030], text: '17 spans in 2.01 s', side: 'top' },
    { at: [2254, 883], text: 'Routed by the gateway', side: 'top' },
  ],
};
</script>
<script src="stills.js"></script>
</body>
</html>
