<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Optimize: the gateway, live</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=block" rel="stylesheet">
<link rel="stylesheet" href="stills.css">
<style>
  #root { background: #000; }
  .app { position: absolute; left: 0; top: 0; width: 800px; height: 450px; transform: scale(3.2); transform-origin: 0 0; background: #000; overflow: hidden; }
  .app svg { position: absolute; left: 0; top: 0; }
  .app svg.flow { mix-blend-mode: screen; }
  .callout { position: absolute; }
  .callout span { font-size: 42px; padding: 18px 28px; }
</style>
</head>
<body>
<div id="root">
  <div class="app" id="app"></div>
  <!-- Canvas pixels: console px x 3.2 -->
  <div class="callout bottom" style="left:1248px; top:752px"><i></i><span>Picks each call’s model</span></div>
</div>
<script>
/* Inference › Gateway under about 70 exchanges a second, drawn as the console's flow canvas lays it out in an
   800 x 450 window scaled 3.2x: ribbon width is tokens a second, stripes and sparks frozen mid-motion. Requests
   inbound are Akka yellow, responses white, classifier callouts a muted grey and the capture write green. */
const W = 800, H = 450;
const C = { req: '255,206,74', resp: '236,236,242', callout: '150,152,170', ledger: '74,222,128' };
const TEXT = '#ececf1', MUTED = '#9a9aa6', FAINT = '#6c6c78';
const SANS = 'Instrument Sans, sans-serif', MONO = 'JetBrains Mono, monospace';

// Places in console pixels.
const BAR_X = 150, GW_L = 214, GW_R = 590, FAN_X = 470, DEST_X = 626, LABEL_X = 640;
const REQ_Y = 196, RESP_Y = 330, NODE = [338, 162, 104, 68], RING = [390, 70, 12];
const STORE = [258, 400, 124, 28], OBS_Y = 414;
const PX = 0.3;                                    // ribbon pixels per thousand tokens a second

// Callers: exchanges a second; about 1,100 tokens in and 260 out per exchange. The last row folds in the
// eight quieter callers, so the totals match the models and the capture store.
const CALLERS = [
  ['svc-helpdesk', 14.2], ['svc-triage', 11.6], ['loan-origination', 9.2], ['svc-helpdesk-eu', 7.5],
  ['svc-order-bot', 6.4], ['svc-ticket-digest', 5.3], ['svc-disputes', 4.8], ['8 more callers', 11.26, true],
];
const CY0 = 76, CSTEP = 40;
// Models: thousands of tokens a second in and out.
const MODELS = [
  { name: 'frontier-large', y: 78, tin: 9.24, tout: 2.18, figs: '9,240 in · 2,180 out' },
  { name: 'frontier-mini', y: 142, tin: 29.3, tout: 6.92, figs: '29.3K in · 6,920 out' },
  { name: 'reasoner-pro', y: 206, tin: 7.7, tout: 1.82, figs: '7,700 in · 1,820 out' },
  { name: 'support-slm-v1', y: 270, tin: 10.8, tout: 2.55, figs: '10.8K in · 2,550 out' },
  { name: 'support-slm-v2', y: 334, tin: 20.4, tout: 4.73, figs: '20.4K in · 4,730 out' },
];
const fRate = (n) => n < 1 ? n.toFixed(2) : n < 10 ? n.toFixed(1) : String(Math.round(n));

function cubic(x0, y0, c1x, c1y, c2x, c2y, x1, y1, n = 48) {
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, u = 1 - t;
    pts.push([u*u*u*x0 + 3*u*u*t*c1x + 3*u*t*t*c2x + t*t*t*x1, u*u*u*y0 + 3*u*u*t*c1y + 3*u*t*t*c2y + t*t*t*y1]);
  }
  return pts;
}
const hlink = (x0, y0, x1, y1) => { const dx = (x1 - x0) / 2; return cubic(x0, y0, x0 + dx, y0, x1 - dx, y1, x1, y1); };
const seg = (x0, y0, x1, y1) => Array.from({ length: 21 }, (_, i) => [x0 + (x1 - x0) * i / 20, y0 + (y1 - y0) * i / 20]);
function mk(pts, w) { const cum = [0]; for (let i = 1; i < pts.length; i++) cum.push(cum[i-1] + Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1])); return { pts, cum, len: cum.at(-1), w }; }
function at(P, d, off = 0) {
  let i = 1; while (i < P.cum.length - 1 && P.cum[i] < d) i++;
  const a = P.pts[i-1], b = P.pts[i], sg = P.cum[i] - P.cum[i-1] || 1, f = Math.min(1, Math.max(0, (d - P.cum[i-1]) / sg));
  return [a[0] + (b[0]-a[0]) * f + (-(b[1]-a[1]) / sg) * off, a[1] + (b[1]-a[1]) * f + ((b[0]-a[0]) / sg) * off];
}
const offset = (P, off) => P.pts.map((p, i) => {
  const a = P.pts[Math.max(0, i-1)], b = P.pts[Math.min(P.pts.length-1, i+1)], d = Math.hypot(b[0]-a[0], b[1]-a[1]) || 1;
  return [p[0] + (-(b[1]-a[1]) / d) * off, p[1] + ((b[0]-a[0]) / d) * off];
});
const pl = (pts) => pts.map((p) => p[0].toFixed(2) + ',' + p[1].toFixed(2)).join(' ');
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

function build() {
  const paths = [], sparks = [], bars = [];
  const W0 = MODELS.reduce((s, m) => s + m.tin, 0) * PX, RW = MODELS.reduce((s, m) => s + m.tout, 0) * PX;
  const wi = CALLERS.map(([, r]) => r * 1.1 * PX), wo = CALLERS.map(([, r]) => r * 0.26 * PX);
  const sWi = wi.reduce((a, b) => a + b), sWo = wo.reduce((a, b) => a + b);
  let ey = REQ_Y - W0 / 2, ry = RESP_Y - RW / 2;
  CALLERS.forEach(([, r], i) => {
    const y = CY0 + CSTEP * i, bi = Math.max(1.4, wi[i]), bo = Math.max(1.2, wo[i]);
    const inS = W0 * wi[i] / sWi, outS = RW * wo[i] / sWo;
    const eY = ey + inS / 2; ey += inS; const rY = ry + outS / 2; ry += outS;
    bars.push([BAR_X, y - 2 - bi, 6, bi, 'req'], [BAR_X, y + 1, 6, bo, 'resp']);
    const pin = mk(hlink(BAR_X + 6, y - 2 - bi / 2, GW_L, eY), Math.max(1.3, inS));
    const pout = mk(hlink(GW_L, rY, BAR_X + 6, y + 1 + bo / 2), Math.max(1, outS));
    paths.push({ P: pin, ink: 'req', alpha: .3 }, { P: pout, ink: 'resp', alpha: .34 });
    sparks.push({ P: pin, ink: 'req', n: Math.round(r * 0.25) + 1 }, { P: pout, ink: 'resp', n: Math.round(r * 0.12), soft: true });
  });
  const lane = mk(seg(GW_L, REQ_Y, FAN_X, REQ_Y), W0);
  paths.push({ P: lane, ink: 'req', alpha: .3, mask: true });
  sparks.push({ P: lane, ink: 'req', n: 16, mask: true });
  const rl = mk(seg(GW_R, RESP_Y, GW_L, RESP_Y), RW);
  paths.push({ P: rl, ink: 'resp', alpha: .4 });
  sparks.push({ P: rl, ink: 'resp', n: 14, soft: true });
  let oy = REQ_Y - W0 / 2, ry2 = RESP_Y - RW / 2;
  MODELS.forEach((m) => {
    const mwi = m.tin * PX, mwo = Math.max(1.2, m.tout * PX), top = m.y - (mwi + 3 + mwo) / 2;
    const sy = oy + mwi / 2; oy += mwi; const rY = ry2 + m.tout * PX / 2; ry2 += m.tout * PX;
    const out = mk(hlink(FAN_X, sy, DEST_X, top + mwi / 2), mwi);
    const back = mk(hlink(DEST_X, top + mwi + 3 + mwo / 2, GW_R, rY), mwo);
    paths.push({ P: out, ink: 'req', alpha: .3 }, { P: back, ink: 'resp', alpha: .36 });
    sparks.push({ P: out, ink: 'req', n: Math.round(m.tin * 0.3) + 2 }, { P: back, ink: 'resp', n: Math.round(m.tout * 0.4) + 1, soft: true });
    bars.push([DEST_X, top, 8, mwi, 'req'], [DEST_X, top + mwi + 3, 8, mwo, 'resp']);
  });
  // Classifier callouts out of the execute node and back.
  const ko = mk(seg(RING[0] - 3, NODE[1], RING[0] - 3, RING[1] + RING[2]), 1.2);
  const kb = mk(seg(RING[0] + 3, RING[1] + RING[2], RING[0] + 3, NODE[1]), 1.2);
  paths.push({ P: ko, ink: 'callout', alpha: .7 }, { P: kb, ink: 'callout', alpha: .5, dash: true });
  sparks.push({ P: ko, ink: 'callout', n: 2, line: true, soft: true }, { P: kb, ink: 'callout', n: 2, line: true, soft: true });
  // The observing tap off the response lane, and the capture track to the store.
  const tap = mk(cubic(GW_L + 16, RESP_Y + 3, GW_L + 16, OBS_Y - 8, GW_L + 44, OBS_Y, STORE[0], OBS_Y), 2.2);
  const sink = mk(seg(STORE[0] + STORE[2], OBS_Y, DEST_X, OBS_Y), 3);
  paths.push({ P: tap, ink: 'ledger', alpha: .4 }, { P: sink, ink: 'ledger', alpha: .45 });
  sparks.push({ P: tap, ink: 'ledger', n: 2 }, { P: sink, ink: 'ledger', n: 8 });
  return { paths, sparks, bars };
}

const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function text(parent, s, x, y, o = {}) {
  const t = el('text', { x, y, fill: o.c || TEXT, 'font-family': o.f || SANS, 'font-size': o.s || 14, 'font-weight': o.w || 400,
    'text-anchor': o.a || 'start', 'letter-spacing': o.ls || 0 }, parent);
  t.textContent = s;
  return t;
}

const app = document.getElementById('app');
const { paths, sparks, bars } = build();

// Structure beneath the flow: the router box, the response rail, the observing strip.
const base = el('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}` });
app.appendChild(base);
const HAIR = 'rgba(236,236,241,.12)';
el('rect', { x: GW_L, y: 104, width: GW_R - GW_L, height: 258, rx: 5, fill: '#0e0e11', stroke: HAIR }, base);
el('rect', { x: GW_L + 8, y: RESP_Y - 9, width: GW_R - GW_L - 16, height: 18, rx: 3, fill: '#141417', stroke: 'rgba(236,236,241,.07)' }, base);
el('rect', { x: GW_L, y: 376, width: GW_R - GW_L, height: 64, rx: 5, fill: 'none', stroke: 'rgba(236,236,241,.16)', 'stroke-dasharray': '4 4' }, base);

text(base, 'CALLERS', 20, 30, { s: 11, w: 600, c: MUTED, ls: 1 });
text(base, 'CLASSIFIERS · HTTP CALLOUTS', RING[0], 30, { s: 11, w: 600, c: MUTED, ls: 1, a: 'middle' });
text(base, 'MODELS', LABEL_X, 30, { s: 11, w: 600, c: MUTED, ls: 1 });
text(base, 'complexity-router-v2', RING[0] - 22, RING[1] + 5, { s: 14, w: 600, a: 'end' });
el('circle', { cx: RING[0], cy: RING[1], r: RING[2], fill: '#141417', stroke: `rgba(${C.callout},.45)`, 'stroke-width': 2 }, base);
text(base, '38 ms', RING[0] + 22, RING[1] - 1, { s: 12, f: MONO, w: 500, c: '#d4d4dc' });
text(base, '14 in flight', RING[0] + 22, RING[1] + 14, { s: 12, c: MUTED });

text(base, 'GATEWAY ROUTER', GW_L + 14, 126, { s: 11, w: 600, c: '#b9b9c2', ls: 1 });
text(base, 'participating stages', GW_L + 14, 142, { s: 12, c: MUTED });
text(base, '← Responses 18.2K tokens/s', GW_L + 14, 352, { s: 12, f: MONO, w: 500, c: 'rgb(222,222,230)' });

text(base, 'OBSERVING', 400, 399, { s: 11, w: 600, c: '#b9b9c2', ls: 1 });
text(base, 'off the request path', 486, 399, { s: 12, c: MUTED });

// Ribbons and sparks screened on the black, like the canvas's additive dark theme.
const flow = el('svg', { class: 'flow', width: W, height: H, viewBox: `0 0 ${W} ${H}` });
app.appendChild(flow);
const defs = el('defs', {}, flow);
defs.innerHTML = `
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5"/></filter>
  <filter id="haze" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <mask id="node" maskUnits="userSpaceOnUse" x="0" y="0" width="${W}" height="${H}">
    <rect width="${W}" height="${H}" fill="#fff"/>
    <rect x="${NODE[0]}" y="${NODE[1]}" width="${NODE[2]}" height="${NODE[3]}" rx="4" fill="#000"/>
  </mask>` +
  Object.entries(C).map(([k, rgb]) => `
  <radialGradient id="s-${k}"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".22" stop-color="rgb(${rgb})" stop-opacity=".95"/><stop offset=".5" stop-color="rgb(${rgb})" stop-opacity=".28"/><stop offset="1" stop-color="rgb(${rgb})" stop-opacity="0"/></radialGradient>
  <radialGradient id="soft-${k}"><stop offset="0" stop-color="rgb(${rgb})" stop-opacity=".9"/><stop offset=".28" stop-color="rgb(${rgb})" stop-opacity=".55"/><stop offset=".55" stop-color="rgb(${rgb})" stop-opacity=".14"/><stop offset="1" stop-color="rgb(${rgb})" stop-opacity="0"/></radialGradient>
  <radialGradient id="h-${k}"><stop offset="0" stop-color="rgb(${rgb})" stop-opacity=".45"/><stop offset="1" stop-color="rgb(${rgb})" stop-opacity="0"/></radialGradient>`).join('');
const masked = el('g', { mask: 'url(#node)' }, flow), plain = el('g', {}, flow);
const g = (p) => p.mask ? masked : plain;
const line = (parent, pts, a) => el('polyline', Object.assign({ points: pl(pts), fill: 'none', 'stroke-linejoin': 'round' }, a), parent);

for (const p of paths) if (p.P.w > 5) line(g(p), p.P.pts, { stroke: `rgba(${C[p.ink]},.5)`, 'stroke-width': p.P.w * 2.2, filter: 'url(#haze)', opacity: .35 });
for (const p of paths) line(g(p), p.P.pts, { stroke: `rgba(${C[p.ink]},.5)`, 'stroke-width': p.P.w + 3, filter: 'url(#glow)', opacity: .45 });
for (const p of paths) {
  const parent = g(p), w = p.P.w;
  line(parent, p.P.pts, { stroke: `rgba(${C[p.ink]},${p.alpha})`, 'stroke-width': w });
  if (w >= 2.6) for (const s of [1, -1]) line(parent, offset(p.P, s * w / 2), { stroke: `rgba(${C[p.ink]},.55)`, 'stroke-width': .6 });
  else line(parent, p.P.pts, { stroke: `rgba(${C[p.ink]},.75)`, 'stroke-width': Math.max(.8, w), 'stroke-dasharray': p.dash ? '2 2' : 'none' });
  if (w > 2.4) line(parent, p.P.pts, { stroke: 'rgba(255,255,255,.16)', 'stroke-width': w * 0.84, 'stroke-dasharray': '1.4 8.6', 'stroke-dashoffset': (rnd() * 10).toFixed(1) });
}
for (const s of sparks) {
  const parent = g(s);
  for (let i = 0; i < s.n; i++) {
    const d = (i + 0.2 + rnd() * 0.6) / s.n * s.P.len;
    const off = s.line ? 0 : (rnd() - 0.5) * 0.6 * s.P.w;
    const [x, y] = at(s.P, d, off);
    const wake = [];
    for (let k = 0; k <= 6; k++) wake.push(at(s.P, Math.max(0, d - k * 2), off));
    line(parent, wake, { stroke: `rgba(${C[s.ink]},.45)`, 'stroke-width': s.soft ? .9 : 1.2, 'stroke-linecap': 'round' });
    if (!s.soft && rnd() < 0.35) el('circle', { cx: x, cy: y, r: 9, fill: `url(#h-${s.ink})`, opacity: .55 }, parent);
    el('circle', { cx: x, cy: y, r: s.soft ? 2.6 : 3 + rnd() * 1.1, fill: `url(#${s.soft ? 'soft' : 's'}-${s.ink})` }, parent);
  }
}
// The classifier ring's p95 arc (log scale, 2 to 250 ms) at 38 ms, and the capture bar's glow.
const frac = Math.log(38 / 2) / Math.log(125), [rx, ry, rr] = RING, a1 = -Math.PI / 2 + frac * 2 * Math.PI;
el('path', { d: `M ${rx} ${ry - rr} A ${rr} ${rr} 0 1 1 ${rx + rr * Math.cos(a1)} ${ry + rr * Math.sin(a1)}`,
  fill: 'none', stroke: `rgb(${C.callout})`, 'stroke-width': 2.4, 'stroke-linecap': 'round' }, plain);
el('rect', { x: DEST_X - 3, y: STORE[1] - 6, width: 14, height: 42, rx: 4, fill: `rgba(${C.ledger},.3)`, filter: 'url(#haze)' }, plain);

// Over the flow: the execute node, the store node, the bars and every label.
const over = el('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}` });
app.appendChild(over);
el('rect', { x: NODE[0], y: NODE[1], width: NODE[2], height: NODE[3], rx: 4, fill: '#18171a', stroke: 'rgba(236,236,241,.18)' }, over);
text(over, 'execute', RING[0], NODE[1] + 20, { s: 15, w: 600, a: 'middle' });
text(over, 'decides destination', RING[0], NODE[1] + 36, { s: 11, c: MUTED, a: 'middle' });
text(over, 'p95 12 ms', RING[0], NODE[1] + 54, { s: 12, f: MONO, w: 500, c: '#d4d4dc', a: 'middle' });
el('rect', { x: NODE[0] + 12, y: NODE[1] + 59, width: NODE[2] - 24, height: 3, rx: 1.5, fill: '#2a2a30' }, over);
el('rect', { x: NODE[0] + 24, y: NODE[1] + 58.5, width: 28, height: 4, rx: 1.5, fill: `rgb(${C.req})` }, over);

el('rect', { x: STORE[0], y: STORE[1], width: STORE[2], height: STORE[3], rx: 4, fill: '#18171a', stroke: 'rgba(236,236,241,.2)', 'stroke-dasharray': '3 3' }, over);
text(over, 'object-storage', STORE[0] + STORE[2] / 2, STORE[1] + 19, { s: 13, w: 600, a: 'middle' });
el('rect', { x: DEST_X, y: STORE[1] - 2, width: 8, height: STORE[3] + 4, rx: 2, fill: `rgb(${C.ledger})` }, over);
text(over, 'Capture store', LABEL_X, OBS_Y - 3, { s: 15, w: 600 });
text(over, '70 writes/s', LABEL_X, OBS_Y + 14, { s: 12, f: MONO, w: 500, c: `rgb(${C.ledger})` });

for (const [x, y, w, h, ink] of bars) el('rect', { x, y, width: w, height: h, rx: 1, fill: `rgb(${C[ink]})` }, over);
CALLERS.forEach(([name, r, folded], i) => {
  const y = CY0 + CSTEP * i;
  text(over, name, BAR_X - 8, y + 1, { s: 14, w: folded ? 500 : 600, a: 'end', c: folded ? MUTED : TEXT });
  text(over, fRate(r) + '/s', BAR_X - 8, y + 16, { s: 12, f: MONO, c: MUTED, a: 'end' });
});
MODELS.forEach((m) => {
  text(over, m.name, LABEL_X, m.y + 1, { s: 15, w: 600 });
  text(over, m.figs, LABEL_X, m.y + 18, { s: 12, f: MONO, c: MUTED });
});
</script>
</body>
</html>
