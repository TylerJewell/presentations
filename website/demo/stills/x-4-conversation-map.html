<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent SDK: a conversation's flow map</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=block" rel="stylesheet">
<link rel="stylesheet" href="stills.css">
<style>.text { width: 2200px; }</style>
</head>
<body>
<div id="root"></div>
<script>
window.STILL = {
  eyebrow: 'Agent SDK',
  title: 'See how a conversation actually went.',
  sub: 'The designed flow, with every step the conversation reached.',
  src: 'src/conversation-map-2560.webp',
  crop: [300, 360],
  win: [160, 400, 2240, 1060],
  tilt: 0,
  spot: [345, 985, 2100, 352],
  // The one step the conversation reached, outlined on the node's own border.
  overlay(layer, toWin) {
    const [x, y] = toWin(1423, 1073), [x2, y2] = toWin(1734, 1175);
    layer.insertAdjacentHTML('beforeend', `<svg style="position:absolute;inset:0;overflow:visible" width="100%" height="100%"><rect x="${x - 4}" y="${y - 4}" width="${x2 - x + 8}" height="${y2 - y + 8}" rx="8" fill="none" stroke="#ffce4a" stroke-width="3"/></svg>`);
  },
  callouts: [
    { at: [1580, 1073], text: 'Reached: Extend deadline', side: 'top' },
    { at: [1943, 1243], text: 'Dropped before Close', side: 'bottom' },
  ],
};
</script>
<script src="stills.js"></script>
</body>
</html>
