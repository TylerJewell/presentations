<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Verify: every control enforced</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=block" rel="stylesheet">
<style>
/* Verify › Controls, the bundle in force, redrawn from src/controls-inforce-2560.webp at an 800 x 450 window, shown at 3.2x.
   Six of its 42 rows, verdicts as in the screenshot. The card is one turn's judge verdict from the tour's conversation-2560.webp. */
:root {
  --bg: #0b0b0d; --surface: #161619; --surface-2: #1f1e22; --line: rgba(236,236,241,.10);
  --text: #ececf1; --muted: #9a9aa6; --faint: #6c6c78; --link: #2ed3e6;
  --sans: 'Instrument Sans', system-ui, sans-serif; --mono: 'JetBrains Mono', ui-monospace, monospace;
}
html, body { margin: 0; background: #000; }
#root { width: 2560px; height: 1440px; overflow: hidden; position: relative; background: #000; }
.con { position: absolute; left: 0; top: 0; width: 800px; height: 450px; overflow: hidden; transform: scale(3.2); transform-origin: 0 0;
  background: var(--bg); color: var(--text); font: 400 15px/1.4 var(--sans); -webkit-font-smoothing: antialiased; }
.con * { box-sizing: border-box; }
.con svg { display: block; flex: none; }
.mono { font-family: var(--mono); }

/* title band */
.head { position: absolute; left: 24px; top: 18px; right: 24px; display: flex; align-items: center; gap: 12px; white-space: nowrap; }
.head h1 { margin: 0; font-size: 22px; font-weight: 500; }
.head .v { font-size: 16px; font-weight: 600; }
.head .meta { margin-left: auto; font-size: 13px; color: var(--muted); }

/* table */
.panel { position: absolute; left: 24px; top: 62px; width: 752px; background: var(--surface); border-radius: 6px; padding: 8px 12px 6px; }
.cols { display: grid; grid-template-columns: 1fr 96px 128px; align-items: center; column-gap: 12px; }
.thead { height: 30px; background: var(--surface-2); border-radius: 4px; color: var(--muted); font-size: 13px; padding: 0 10px; }
.tr { height: 36px; border-bottom: 1px solid var(--line); padding: 0 10px; font-size: 14.5px; }
.tr:last-child { border-bottom: 0; }
.tr .c { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { justify-self: start; display: inline-flex; align-items: center; gap: 5px; padding: 3px 7px; border-radius: 4px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.ok { background: #113022; color: #5fd88f; }
.stale { background: #382b16; color: #f5c84c; }
.noev, .inf { background: #1e283a; color: #7fb0ff; }
.fail { background: #3a1a1c; color: #f87171; }

/* one request's judge verdict */
.req { position: absolute; left: 24px; top: 342px; width: 752px; height: 90px; background: var(--surface); border-radius: 6px; padding: 12px 16px;
  display: flex; flex-direction: column; justify-content: center; gap: 8px; }
.line { display: flex; align-items: center; gap: 10px; white-space: nowrap; font-size: 14.5px; }
.line .muted { color: var(--muted); font-size: 13px; }
.tag { padding: 2px 7px; border-radius: 4px; background: #232227; font-size: 13px; }
.lk { margin-left: auto; color: var(--link); font-size: 13.5px; }
</style>
</head>
<body>
<div id="root">
<div class="con">

  <div class="head">
    <h1>Controls</h1>
    <span class="v">v6</span><span class="chip inf"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="6" cy="6" r="5"/><path d="M6 5.4v3M6 3.6v.1"/></svg>In force</span>
    <span class="meta">42 controls · signed Sep 25</span>
  </div>

  <div class="panel">
    <div class="thead cols"><div>Control</div><div>Type</div><div>Latest verdict</div></div>
    <div id="rows"></div>
  </div>

  <div class="req">
    <div class="line"><span class="chip fail">Failed</span><b style="font-weight:600">support-answer-judge</b><span class="tag">reveals-personal-data</span><span class="muted mono">score 0.3</span><span class="lk">Evidence →</span></div>
    <div class="line"><span class="muted">Turn 1 · Extend deadline · frontier-large · 08:16:56</span></div>
    <div class="line" style="color:var(--muted); font-size:13.5px">The answer repeats the applicant's contact details, which should never appear.</div>
  </div>

</div>
</div>
<script>
// Six of the 42 controls in force, with their verdicts in the screenshot.
const ROWS = [
  ['Enforce inference-boundary protections against prompt injection, model extraction, and unauthenticated model access', 'Guardrail', 'ok'],
  ['Data minimisation at agent boundaries (Art 5(1)(c))', 'Sanitizer', 'stale'],
  ['Operate a documented continuous evaluation and improvement program with performance metrics and threat monitoring', 'Evaluation', 'ok'],
  ['Automated eligibility assessment can be halted', 'Human', 'ok'],
  ['Automated build pipeline with mandatory, failing security checks', 'Gate', 'ok'],
  ['Flagged support replies are triaged', 'Human', 'noev'],
];
const ic = {
  ok: '<circle cx="6" cy="6" r="5"/><path d="M3.8 6.1l1.5 1.5 3-3"/>',
  stale: '<circle cx="6" cy="6" r="5"/><path d="M6 3.4V6l1.8 1.1"/>',
  noev: '<circle cx="6" cy="6" r="5"/><path d="M6 5.4v3M6 3.6v.1"/>',
};
const word = { ok: 'Satisfied', stale: 'Stale', noev: 'No evidence' };
document.getElementById('rows').innerHTML = ROWS.map(([c, t, v]) => `<div class="tr cols">
  <div class="c">${c}</div><div>${t}</div>
  <div class="chip ${v}"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2">${ic[v]}</svg>${word[v]}</div></div>`).join('');
</script>
</body>
</html>
