<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Optimize: a canary experiment</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=block" rel="stylesheet">
<link rel="stylesheet" href="stills.css">
<style>
  /* Inference › Experiments, the detail of a running canary: the loop and the limits only, laid out in an
     800 x 450 window and scaled 3.2x to 2560x1440. */
  :root {
    --bg: #0b0b0d; --surface: #161619; --surface-2: #222125; --line: rgba(236,236,241,.09);
    --text: #ececf1; --muted: #9a9aa6; --faint: #6c6c78;
    --green-text: #8ee4a8; --green-bar: #1b382a; --green-bar-line: #27503b; --chip-green: #143221;
    --blue: #7fb2ff; --blue-bg: rgba(96,165,250,.14);
  }
  #root { background: #000; }
  .app { position: absolute; left: 0; top: 0; width: 800px; height: 450px; transform: scale(3.2); transform-origin: 0 0;
    font-family: var(--sans); color: var(--text); background: var(--bg); overflow: hidden; -webkit-font-smoothing: antialiased; }
  .app * { box-sizing: border-box; }
  .abs { position: absolute; }
  .panel { position: absolute; background: var(--surface); border-radius: 6px; }

  .crumb { left: 20px; top: 18px; font: 500 15px/1 var(--sans); color: var(--muted); }
  .crumb b { font-weight: 500; color: var(--text); }
  .head { left: 20px; top: 46px; display: flex; align-items: center; gap: 12px; }
  .head h1 { margin: 0; font: 600 24px/1 var(--sans); letter-spacing: -.01em; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 3px; font: 500 13px/1 var(--sans); }
  .chip svg { width: 13px; height: 13px; }
  .chip.blue { background: var(--blue-bg); color: var(--blue); }
  .chip.green { background: var(--chip-green); color: var(--green-text); }
  .sub { left: 20px; top: 82px; font: 400 14px/1 var(--sans); color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .sub code { font: 500 12px/1 var(--mono); color: var(--text); background: #1d1c20; border-radius: 3px; padding: 4px 6px; }

  .limits h2 { margin: 0; font: 600 18px/1 var(--sans); }
  .row { position: absolute; left: 20px; right: 20px; height: 44px; }
  .row + .row::before { content: ''; position: absolute; left: 0; right: 0; top: -11px; border-top: 1px solid var(--line); }
  .row .lab { position: absolute; left: 0; top: 0; font: 500 15px/1 var(--sans); }
  .row .lab small { display: block; margin-top: 6px; font: 400 12px/1 var(--sans); color: var(--muted); }
  .track { position: absolute; left: 116px; top: 3px; width: 160px; height: 24px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
  .track .fill { position: absolute; top: 0; bottom: 0; background: var(--green-bar); box-shadow: inset 0 0 0 1px var(--green-bar-line); }
  .track .tick { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(236,236,241,.16); }
  .track .limit { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #9ea0a3; }
  .track .dot { position: absolute; top: 50%; width: 13px; height: 13px; margin: -6.5px 0 0 -6.5px; border-radius: 50%; background: #e9e9ec; box-shadow: 0 0 0 1.5px #111; }
  .track .hollow { position: absolute; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; border: 1.8px solid #aeb0b4; }
  .row .val { position: absolute; right: 88px; top: 8px; font: 500 13px/1 var(--mono); white-space: pre; }
  .row .chip { position: absolute; right: 0; top: 3px; }
</style>
</head>
<body>
<div id="root">
<div class="app">
  <div class="abs crumb">Inference › <b>Experiments</b></div>
  <div class="abs head"><h1>Smaller model for ticket triage</h1>
    <span class="chip blue"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="6" cy="6" r="5"/><path d="M6 5.4v3M6 3.4v.2" stroke-linecap="round"/></svg>Running</span></div>
  <div class="abs sub">ticket-triage, <code>claude-sonnet-4-5</code> to <code>triage-slm-v3</code></div>

  <!-- The experiment loop, at Canary -->
  <div class="panel" style="left:16px; top:110px; width:276px; height:324px">
    <svg id="loop" width="276" height="324" viewBox="0 0 276 324" font-family="Instrument Sans, sans-serif"></svg>
  </div>

  <!-- Your limits -->
  <div class="panel limits" style="left:304px; top:110px; width:480px; height:324px">
    <h2 class="abs" style="left:20px; top:24px">Your limits</h2>
    <div class="abs" style="right:20px; top:27px; font-size:13px; color:var(--muted)">Canary, n = 6,120</div>
    <div class="row" style="top:76px"><div class="lab">Quality<small>at least (3.0)%</small></div>
      <div class="track"><div class="fill" style="left:16.8%; right:0"></div><div class="tick" style="left:83.4%"></div><div class="limit" style="left:16.8%"></div><div class="hollow" style="left:30%"></div><div class="dot" style="left:54.6%"></div></div>
      <div class="val">(1.3)%</div><span class="chip green"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="6" cy="6" r="5"/><path d="M3.8 6.1l1.5 1.5 2.9-3" stroke-linecap="round" stroke-linejoin="round"/></svg>Within</span></div>
    <div class="row" style="top:138px"><div class="lab">Cost per call<small>at most (40.0)%</small></div>
      <div class="track"><div class="fill" style="left:0; width:16.8%"></div><div class="tick" style="left:83.4%"></div><div class="limit" style="left:16.8%"></div></div>
      <div class="val">–</div></div>
    <div class="row" style="top:200px"><div class="lab">Latency p95<small>at most 150 ms</small></div>
      <div class="track"><div class="fill" style="left:0; width:83.4%"></div><div class="tick" style="left:70.6%"></div><div class="limit" style="left:83.4%"></div><div class="dot" style="left:16.6%"></div><div class="hollow" style="left:20.1%"></div></div>
      <div class="val">(630) ms</div><span class="chip green"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="6" cy="6" r="5"/><path d="M3.8 6.1l1.5 1.5 2.9-3" stroke-linecap="round" stroke-linejoin="round"/></svg>Within</span></div>
    <div class="row" style="top:262px"><div class="lab">Errors<small>at most 0.5 pt</small></div>
      <div class="track"><div class="fill" style="left:0; width:83.4%"></div><div class="tick" style="left:16.8%"></div><div class="limit" style="left:83.4%"></div><div class="dot" style="left:30%"></div><div class="hollow" style="left:43.4%"></div></div>
      <div class="val">0.1 pt</div><span class="chip green"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="6" cy="6" r="5"/><path d="M3.8 6.1l1.5 1.5 2.9-3" stroke-linecap="round" stroke-linejoin="round"/></svg>Within</span></div>
  </div>
</div>
</div>
<script>
/* The loop's six steps on a hexagon, Propose at the top, running clockwise; done steps green, the current one gold. */
const svg = document.getElementById('loop'), CX = 138, CY = 164, R = 106, NR = 33;
const STEPS = [
  { name: 'Propose', state: 'done' }, { name: 'Evaluate', state: 'done' }, { name: 'Shadow', state: 'done' },
  { name: 'Canary', state: 'now', sub: 'Step 3 of 4' }, { name: 'Decide' }, { name: 'Watch' },
];
const INK = { done: '#3ccf72', now: '#ecc458', next: '#77777f' };
const pos = STEPS.map((_, i) => { const a = -Math.PI / 2 + i * Math.PI / 3; return [CX + R * Math.cos(a), CY + R * Math.sin(a)]; });
let html = '<defs>' + Object.entries(INK).map(([k, c]) =>
  `<marker id="a-${k}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${c}"/></marker>`).join('') + '</defs>';
STEPS.forEach((s, i) => {
  const [ax, ay] = pos[i], [bx, by] = pos[(i + 1) % 6], d = Math.hypot(bx - ax, by - ay), ux = (bx - ax) / d, uy = (by - ay) / d;
  const x0 = ax + ux * (NR + 5), y0 = ay + uy * (NR + 5), x1 = bx - ux * (NR + 8), y1 = by - uy * (NR + 8);
  const mx = (ax + bx) / 2, my = (ay + by) / 2, ox = mx - CX, oy = my - CY, ol = Math.hypot(ox, oy);
  const k = s.state === 'done' ? 'done' : s.state === 'now' ? 'now' : 'next';
  html += `<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} Q${(mx + ox / ol * 12).toFixed(1)} ${(my + oy / ol * 12).toFixed(1)} ${x1.toFixed(1)} ${y1.toFixed(1)}"
    fill="none" stroke="${INK[k]}" stroke-width="2.2"${k === 'next' ? ' stroke-dasharray="3.5 3.5"' : ''} marker-end="url(#a-${k})"/>`;
});
STEPS.forEach((s, i) => {
  const [x, y] = pos[i];
  html += `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})" text-anchor="middle">`;
  if (s.state === 'done') html += `<circle r="${NR}" fill="#1e3325" stroke="#2fc764" stroke-width="2"/><text y="0" fill="#ececf1" font-size="14" font-weight="600">${s.name}</text><text y="17" fill="#7fbf95" font-size="12">✓</text>`;
  else if (s.state === 'now') html += `<circle r="${NR + 6}" fill="none" stroke="#4a4740" stroke-width="1.5"/><circle r="${NR}" fill="#3a3322" stroke="#ecc458" stroke-width="2.5"/><text y="-1" fill="#ececf1" font-size="14" font-weight="600">${s.name}</text><text y="15" fill="#c9bf9f" font-size="11">${s.sub}</text>`;
  else html += `<circle r="${NR}" fill="none" stroke="#3b3b41" stroke-width="2"/><text y="5" fill="#b9b9c2" font-size="14">${s.name}</text>`;
  html += '</g>';
});
html += `<g text-anchor="middle"><text x="${CX}" y="${CY + 4}" fill="#ececf1" font-size="34" font-weight="700">25%</text>
  <text x="${CX}" y="${CY + 24}" fill="#9a9aa6" font-size="14">served, day 7</text></g>`;
svg.innerHTML = html;
</script>
</body>
</html>
