<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>An Integrated Platform | Akka</title>
<link rel="icon" href="https://akka.io/favicon.ico" type="image/x-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=optional" rel="stylesheet">
<style>
 /* Local preview only: page chrome that akka.io's theme supplies in production. */
 *{box-sizing:border-box}
 html,body{margin:0}
 body{background:#000;padding-top:78px;font-family:'Instrument Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
 .site-hdr{position:fixed;top:0;left:0;right:0;z-index:10;height:78px;display:flex;align-items:center;
  justify-content:space-between;padding:0 32px;background:#06090D;border-bottom:1px solid #313131}
 .site-hdr img{height:25px;width:auto;display:block}
 .site-hdr .r{display:flex;align-items:center;gap:18px;color:#F1F1F1}
 .site-hdr .contact{font-size:14px;border:1px solid #00DBDD;padding:9px 16px}
 .site-hdr svg{width:24px;height:24px;stroke:#00DBDD;fill:none;stroke-width:2}
 @media (max-width:720px){ body{padding-top:64px} .site-hdr{height:64px;padding:0 16px} }
</style>
</head>
<body>
<header class="site-hdr">
 <img src="https://akka.io/hubfs/AKKA-2024/Images/akka_logo.svg" alt="Akka" width="109" height="25">
 <div class="r">
  <span class="contact">Contact</span>
  <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
 </div>
</header>

<!-- tour:start  (port_tour.py lifts this block into the akka.io/platform/tour template) -->
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
 .ptour{
  --pt-white:#F1F1F1;--pt-medium-black:#141414;--pt-yellow:#FFCE4A;--pt-blue:#00DBDD;
  --pt-soft-grey:#A6A6A6;--pt-medium-grey:#4E4E4E;
  --pt-line:#262626;--pt-seg:#2A2A2A;--pt-seg-done:#6E6E6E;
  --pt-mono:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace;
  --pt-pad:clamp(16px,6vw,123px);
  /* Height spent on everything but the stage: site header, rail, title row, the install
     bar under the stage, padding. */
  --pt-chrome:281px;
  box-sizing:border-box;background:#000;color:var(--pt-white);line-height:1.5;-webkit-font-smoothing:antialiased;
  min-height:calc(100svh - 78px)}
 .ptour *{box-sizing:border-box}
 .ptour button{font:inherit;color:inherit}

 .ptour-in{width:min(1180px, calc(100vw - 2 * var(--pt-pad)), calc((100svh - var(--pt-chrome)) * 16 / 9));
  margin:0 auto;padding:32px 0 0}

 /* Section rail: one group per section, one segment per screen. The rail is built by
    script, so its height is reserved here. */
 .ptour .rail{position:relative;display:flex;gap:14px;margin-bottom:18px;min-height:41px}
 .ptour .grp{flex:var(--n) 1 0;min-width:max-content}
 .ptour .grp-name{font-family:var(--pt-mono);font-size:11px;line-height:16px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--pt-soft-grey);transition:color .2s}
 .ptour .grp.on .grp-name{color:var(--pt-white)}
 .ptour .segs{display:flex;gap:4px;margin-top:2px}
 .ptour .seg{flex:1 1 0;min-width:10px;height:22px;padding:0;border:0;background:none;cursor:pointer}
 .ptour .seg::before{content:"";display:block;height:3px;border-radius:2px;background:var(--pt-seg);transition:background .2s}
 .ptour .seg.done::before{background:var(--pt-seg-done)}
 .ptour .seg.on::before{background:var(--pt-yellow)}
 .ptour .seg:hover::before,.ptour .seg:focus-visible::before{background:var(--pt-blue)}
 .ptour .seg:focus-visible{outline:none}

 .ptour .head{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:18px}
 .ptour .label{margin:0;min-height:31px;font-family:inherit;font-size:26px;font-weight:600;letter-spacing:-.015em;
  line-height:31px;color:var(--pt-white)}
 .ptour .caption{margin:4px 0 0;color:var(--pt-soft-grey);font-size:16px;max-width:70ch}
 .ptour .ctrls{display:flex;gap:10px;flex:none}
 .ptour .ctrls button{width:46px;height:46px;border-radius:50%;border:1px solid #3A3A3A;background:var(--pt-medium-black);
  display:grid;place-items:center;cursor:pointer;padding:0;transition:border-color .2s}
 .ptour .ctrls svg{width:18px;height:18px;stroke:var(--pt-white);fill:none;stroke-width:2;transition:stroke .2s}
 .ptour .ctrls button:hover:not(:disabled),.ptour .ctrls button:focus-visible{border-color:var(--pt-blue);outline:none}
 .ptour .ctrls button:hover:not(:disabled) svg,.ptour .ctrls button:focus-visible svg{stroke:var(--pt-blue)}
 .ptour .ctrls button:disabled{opacity:.3;cursor:default}

 .ptour .frame{border-radius:12px;box-shadow:0 0 0 1px rgba(255,255,255,.02),0 24px 70px -20px rgba(0,0,0,.9)}
 .ptour .stage{position:relative;aspect-ratio:16/9;border-radius:12px 12px 0 0;overflow:hidden;background:#0A0A0A;
  border:1px solid var(--pt-line);touch-action:pan-y;user-select:none}
 .ptour .stage img{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;opacity:0;
  transition:opacity .32s ease}
 .ptour .stage img.on{opacity:1}

 /* The install line is a bar docked under the stage, closed by the same frame, on every screen. */
 .ptour .end button.akka-install{padding:9px 14px;background:#0A0A0A;border:1px solid var(--pt-line);border-top:0;
  border-radius:0 0 12px 12px;font-size:12.5px}
 .ptour .end .akka-install__cp{border-color:var(--pt-line);padding:4px 7px}

 @media (max-width:720px){
  .ptour{min-height:calc(100svh - 64px)}
  .ptour-in{padding-top:20px}
  .ptour .rail{overflow-x:auto;scrollbar-width:thin;scrollbar-color:var(--pt-medium-grey) var(--pt-medium-black);
   padding-bottom:6px;min-height:47px}
  .ptour .rail::-webkit-scrollbar{height:10px}
  .ptour .rail::-webkit-scrollbar-track{background:var(--pt-medium-black)}
  .ptour .rail::-webkit-scrollbar-thumb{background:var(--pt-medium-grey);border-radius:0}
  .ptour .rail::-webkit-scrollbar-thumb:hover{background:var(--pt-blue)}
  .ptour .seg{min-width:14px}
  .ptour .label{font-size:21px;line-height:26px;min-height:26px}
 }
 @media (prefers-reduced-motion:reduce){
  .ptour .stage img,.ptour .seg::before,.ptour .grp-name,.ptour .ctrls button,.ptour .ctrls svg{transition:none}
 }
</style>
<div class="ptour">
 <main class="ptour-in">
  <nav class="rail" id="pt-rail" aria-label="Sections"></nav>
  <div class="head">
   <div>
    <h1 class="label" id="pt-label" aria-live="polite"></h1>
    <p class="caption" id="pt-caption" hidden></p>
   </div>
   <div class="ctrls">
    <button id="pt-prev" aria-label="Previous screen"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button id="pt-next" aria-label="Next screen"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
   </div>
  </div>
  <div class="frame">
  <div class="stage" id="pt-stage">
   <img alt="" width="1280" height="720" sizes="(max-width: 1180px) 100vw, 1180px">
   <img alt="" width="1280" height="720" sizes="(max-width: 1180px) 100vw, 1180px">
  </div>
  <div class="end" id="pt-end"><button type="button" class="akka-install akka-install--panel akka-install--lead"><span class="akka-install__lead">In your AI harness:</span><span class="akka-install__s">install Akka from akka.ai</span><span class="akka-install__cp" aria-live="polite">Copy</span></button></div>
  </div>
 </main>
</div>
<script src="tour.js"></script>
<script>
(function () {
  var S = TOUR.screens, i = 0;
  var $ = function (id) { return document.getElementById(id); };
  var stage = $("pt-stage"), rail = $("pt-rail"), segs = [], groups = [];
  var SIZES = "(max-width: 1180px) 100vw, 1180px";
  var smooth = !matchMedia("(prefers-reduced-motion: reduce)").matches;

  TOUR.sections.forEach(function (name) {
    var g = document.createElement("div"), row = document.createElement("div");
    var count = 0;
    g.className = "grp";
    g.innerHTML = '<div class="grp-name">' + name + "</div>";
    row.className = "segs";
    S.forEach(function (s, k) {
      if (s.section !== name) return;
      var b = document.createElement("button");
      b.className = "seg";
      b.title = (k + 1) + " · " + (s.title || s.label);
      b.setAttribute("aria-label", "Screen " + (k + 1) + ": " + (s.title || s.label));
      b.onclick = function () { go(k); };
      segs[k] = b;
      row.appendChild(b);
      count++;
    });
    g.style.setProperty("--n", count);
    g.appendChild(row);
    g.dataset.section = name;
    groups.push(g);
    rail.appendChild(g);
  });

  function go(k) {
    i = Math.max(0, Math.min(S.length - 1, k));
    var s = S[i];
    segs.forEach(function (b, k) {
      b.classList.toggle("on", k === i);
      b.classList.toggle("done", k < i);
    });
    groups.forEach(function (g) {
      var on = g.dataset.section === s.section;
      g.classList.toggle("on", on);
      if (on && rail.scrollWidth > rail.clientWidth) {
        rail.scrollTo({ left: g.offsetLeft, behavior: smooth ? "smooth" : "auto" });
      }
    });
    $("pt-label").textContent = s.title || s.label;
    $("pt-caption").textContent = s.caption || "";
    $("pt-caption").hidden = !s.caption;
    $("pt-prev").disabled = i === 0;
    $("pt-next").disabled = i === S.length - 1;
    TOUR.show(stage, s);
    [S[i + 1], S[i - 1]].forEach(function (n) { if (n) TOUR.preload(n, SIZES); });
    history.replaceState(null, "", "#" + s.id);
  }

  function fromHash() {
    var id = location.hash.slice(1), k = S.findIndex(function (s) { return s.id === id; });
    return k < 0 ? 0 : k;
  }

  $("pt-prev").onclick = function () { go(i - 1); };
  $("pt-next").onclick = function () { go(i + 1); };
  // Left and right arrows only: the page scrolls to the footer, so vertical keys stay with the browser.
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if (e.key === "ArrowRight") { go(i + 1); e.preventDefault(); }
    else if (e.key === "ArrowLeft") { go(i - 1); e.preventDefault(); }
  });

  var x0 = null;
  stage.addEventListener("pointerdown", function (e) { x0 = e.clientX; });
  stage.addEventListener("pointerup", function (e) {
    if (x0 === null) return;
    var dx = e.clientX - x0;
    x0 = null;
    if (Math.abs(dx) > 40) go(i + (dx < 0 ? 1 : -1));
  });
  window.addEventListener("hashchange", function () { go(fromHash()); });

  go(fromHash());
})();
</script>
<!-- install-line:start (written by tools/hubspot/install_line.py; edit install-line/ instead) -->
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&display=optional" rel="stylesheet">
<style>
/* The install line: one button that copies "install Akka from akka.ai".
   Sizes: inline (no modifier), --quiet, --chip and --panel. Selectors carry the element
   name so the HubSpot theme's button rules do not outrank them. */
button.akka-install{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:12px;cursor:pointer;
  font:500 14px/1 "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#F1F1F1;
  white-space:nowrap;-webkit-font-smoothing:antialiased;text-transform:none;letter-spacing:0}
button.akka-install *{font-family:inherit}
button.akka-install .akka-install__g{color:#FFCE4A;font-weight:600}
button.akka-install .akka-install__cp{font:600 10px/1 "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  letter-spacing:.16em;text-transform:uppercase;color:#A6A6A6;transition:color .15s}
button.akka-install:hover .akka-install__cp,button.akka-install:focus-visible .akka-install__cp{color:#00DBDD}
button.akka-install:focus-visible{outline:1px solid #00DBDD;outline-offset:6px}
button.akka-install.is-copied .akka-install__cp{color:#72D35B}

button.akka-install--quiet{color:#A6A6A6;font-size:13px}
button.akka-install--quiet .akka-install__g{color:#A6A6A6}
button.akka-install--quiet:hover,button.akka-install--quiet:focus-visible{color:#F1F1F1}
button.akka-install--quiet:hover .akka-install__g,button.akka-install--quiet:focus-visible .akka-install__g{color:#FFCE4A}

button.akka-install--chip{padding:12px 14px;background:#141414;border:1px solid rgba(241,241,241,.22);transition:border-color .15s}
button.akka-install--chip:hover,button.akka-install--chip:focus-visible{border-color:#00DBDD;outline:none}

button.akka-install--panel{display:flex;width:100%;padding:22px 24px;background:#141414;border:1px solid rgba(241,241,241,.22);font-size:18px}
button.akka-install--panel .akka-install__cp{margin-left:auto;border:1px solid rgba(241,241,241,.22);padding:8px 10px}
button.akka-install--panel:hover .akka-install__cp,button.akka-install--panel:focus-visible .akka-install__cp{border-color:#00DBDD}
button.akka-install--panel:focus-visible{outline-offset:4px}

/* --mini is the /install panel at menu scale. */
button.akka-install--mini{display:flex;width:100%;gap:7px;padding:8px 9px;background:#141414;border:1px solid rgba(241,241,241,.22);font-size:11px}
button.akka-install--mini .akka-install__cp{margin-left:auto;border:1px solid rgba(241,241,241,.22);padding:4px 5px;font-size:8px}
button.akka-install--mini:hover .akka-install__cp,button.akka-install--mini:focus-visible .akka-install__cp{border-color:#00DBDD}
button.akka-install--mini:focus-visible{outline-offset:3px}

/* --lead names where the instruction goes: "In your AI harness:" in the page's sans face,
   then the instruction in quotes. It replaces the glyph, and below 480px the lead wraps
   above the instruction. */
button.akka-install--lead{flex-wrap:wrap;row-gap:8px}
button.akka-install .akka-install__lead{font-family:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  font-weight:500;color:#A6A6A6;letter-spacing:0}
button.akka-install--lead .akka-install__s::before{content:"\201C";color:#A6A6A6}
button.akka-install--lead .akka-install__s::after{content:"\201D";color:#A6A6A6}
button.akka-install--lead.is-copied .akka-install__s::before,button.akka-install--lead.is-copied .akka-install__s::after{color:#72D35B}

/* Below 480px the chip with its label is wider than the column. The label leaves the layout
   but stays in the accessibility tree, so the copied state is still announced, and the glyph
   carries the copied state instead. */
@media (max-width:480px){
  button.akka-install .akka-install__cp{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  button.akka-install.is-copied .akka-install__g{color:#72D35B}
  button.akka-install--panel{font-size:15px;padding:18px 16px}
}
</style>
<script>
/* Copies "install Akka from akka.ai" from any .akka-install button. A page can carry the
   script more than once (the footer and the page body both include it); the flag keeps
   one listener. */
(function () {
  if (window.__akkaInstallLine) return;
  window.__akkaInstallLine = true;
  var TEXT = "install Akka from akka.ai";

  function fallback() {
    var a = document.createElement("textarea");
    a.value = TEXT;
    a.setAttribute("readonly", "");
    a.style.position = "fixed";
    a.style.opacity = "0";
    document.body.appendChild(a);
    a.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(a);
  }

  function copy() {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(TEXT).catch(fallback);
    } else {
      fallback();
    }
  }

  document.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("button.akka-install") : null;
    if (!b) return;
    copy();
    var cp = b.querySelector(".akka-install__cp");
    b.classList.add("is-copied");
    if (cp) cp.textContent = "Copied";
    clearTimeout(b._akkaInstallTimer);
    b._akkaInstallTimer = setTimeout(function () {
      b.classList.remove("is-copied");
      if (cp) cp.textContent = "Copy";
    }, 1600);
  });
})();
</script>
<!-- install-line:end -->
<!-- tour:end -->
</body>
</html>
