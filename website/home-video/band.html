<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home video band | Akka</title>
<link rel="icon" href="https://akka.io/favicon.ico" type="image/x-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=optional" rel="stylesheet">
<style>
 html,body{margin:0}
 /* Page background between bands, sampled from the akka.io home page. */
 body{background:#040C15;color:#F1F1F1}
 .neighbour{height:160px;background:linear-gradient(180deg,#0E2131,#0A1826)}
</style>
</head>
<body>
<div class="neighbour" aria-hidden="true"></div>

<!-- band:start  (tools/hubspot/port_home_video.py publishes this block as the Home Video Band module) -->
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&display=optional" rel="stylesheet">
<style>
#hv-band{--hv-b:#00DBDD;--hv-w:#F1F1F1;--hv-g:#A6A6A6;
  --hv-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  position:relative;height:clamp(420px,64vh,660px);overflow:hidden;background:#0B1A2A;color:var(--hv-w);
  font-family:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;
  /* The home page's bands sit 20px apart on the page's #040C15, which shows as a dark strip
     between them; the band's own navy keeps the strip visible above and below it. */
  margin-top:20px}
#hv-band *,#hv-band *::before,#hv-band *::after{box-sizing:border-box}
#hv-band button{font-family:inherit}
/* The film plays muted and dimmed as a backdrop; the band's edges fade into its navy. */
#hv-band .hv-auto{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover;background:#0B1A2A;
  opacity:0;transform:scale(1.04);transition:opacity 1.6s ease,transform 6s ease-out}
#hv-band.hv-in .hv-auto{opacity:.42;transform:none}
#hv-band::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,#0B1A2A 0,rgba(11,26,42,0) 24%,rgba(11,26,42,0) 76%,#0B1A2A 100%),
  radial-gradient(ellipse 70% 80% at 50% 50%,rgba(11,26,42,0) 35%,rgba(11,26,42,.88) 100%)}
#hv-band .hv-play{appearance:none;position:absolute;left:50%;top:50%;z-index:2;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:14px;margin:0;padding:0;border:0;background:none;
  color:var(--hv-w);cursor:pointer}
#hv-band .hv-ring{display:grid;place-items:center;width:92px;height:92px;border-radius:50%;
  border:1px solid rgba(241,241,241,.55);background:rgba(4,12,21,.55);transition:border-color .2s,transform .2s,color .2s}
#hv-band .hv-ring svg{width:30px;height:30px;margin-left:4px}
#hv-band .hv-play:hover .hv-ring,#hv-band .hv-play:focus-visible .hv-ring{border-color:var(--hv-b);color:var(--hv-b);transform:scale(1.05)}
#hv-band .hv-play:focus-visible{outline:none}
#hv-band .hv-len{font:600 12px/1 var(--hv-mono);letter-spacing:.12em;color:var(--hv-g)}
/* Pauses the backdrop for anyone who wants it still. */
#hv-band .hv-hold{appearance:none;position:absolute;right:16px;bottom:16px;z-index:2;display:grid;place-items:center;
  width:32px;height:32px;margin:0;padding:0;border:1px solid rgba(241,241,241,.18);border-radius:50%;
  background:rgba(4,12,21,.55);color:var(--hv-g);cursor:pointer;transition:border-color .15s,color .15s}
#hv-band .hv-hold:hover,#hv-band .hv-hold:focus-visible{border-color:var(--hv-b);color:var(--hv-w);outline:none}
#hv-band .hv-hold svg{width:12px;height:12px}
#hv-band .hv-hold .on,#hv-band .hv-hold.held .off{display:none}
#hv-band .hv-hold.held .on{display:block}
#hv-band .hv-lb{position:fixed;inset:0;z-index:2147483000;display:none;align-items:center;justify-content:center;
  padding:56px 16px 16px;background:rgba(0,0,0,.94)}
#hv-band .hv-lb.open{display:flex}
#hv-band .hv-lb video{display:block;width:min(100%,calc((100vh - 96px) * 16 / 9));height:auto;max-height:calc(100vh - 96px);background:#000}
#hv-band .hv-x{appearance:none;position:absolute;top:14px;right:16px;margin:0;padding:8px 12px;
  border:1px solid rgba(241,241,241,.22);border-radius:999px;background:none;color:var(--hv-g);
  font:600 11px/1 var(--hv-mono);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
#hv-band .hv-x:hover,#hv-band .hv-x:focus-visible{border-color:var(--hv-b);color:var(--hv-w);outline:none}
/* Reduced motion keeps the backdrop playing (the pause control stops it) and drops the zoom. */
@media (prefers-reduced-motion:reduce){
  #hv-band .hv-auto{transform:none;transition:opacity 1.6s ease}
}
</style>
<section id="hv-band" aria-label="Akka demo video">
  <video class="hv-auto" muted playsinline loop preload="none" aria-hidden="true"
    poster="https://akka.io/hubfs/website/home-video/akka-demo-poster.jpeg"
    data-src="https://akka.io/hubfs/website/home-video/akka-demo.mp4"></video>
  <button type="button" class="hv-play" aria-label="Play the Akka demo video with sound, 5 minutes 22 seconds">
    <span class="hv-ring"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg></span>
    <span class="hv-len">5:22</span>
  </button>
  <button type="button" class="hv-hold" aria-label="Pause the background video" aria-pressed="false">
    <svg class="off" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 2h2v8H3zM7 2h2v8H7z" fill="currentColor"/></svg>
    <svg class="on" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 1.5v9l7-4.5z" fill="currentColor"/></svg>
  </button>
  <div class="hv-lb" role="dialog" aria-modal="true" aria-label="Akka demo video">
    <button type="button" class="hv-x">Close</button>
    <video controls playsinline preload="none"></video>
  </div>
</section>
<script>
(function () {
  var band = document.getElementById('hv-band');
  if (!band) return;
  var v = band.querySelector('.hv-auto'), hold = band.querySelector('.hv-hold');
  var play = band.querySelector('.hv-play'), lb = band.querySelector('.hv-lb'), full = lb.querySelector('video');
  var held = false, inView = false;
  // The backdrop loads once the band is near and plays while half of it is on screen.
  function load() { if (!v.src) v.src = v.dataset.src; }
  function run() { if (inView && !held && !lb.classList.contains('open')) { load(); v.play().catch(function () {}); } else v.pause(); }
  new IntersectionObserver(function (es) { if (es[0].isIntersecting) load(); },
    { rootMargin: '600px 0px' }).observe(band);
  new IntersectionObserver(function (es) {
    var r = es[0].intersectionRatio;
    band.classList.toggle('hv-in', r >= 0.15);
    inView = r >= 0.5;
    run();
  }, { threshold: [0, 0.15, 0.5, 1] }).observe(band);
  hold.addEventListener('click', function () {
    held = !held;
    hold.classList.toggle('held', held);
    hold.setAttribute('aria-pressed', String(held));
    hold.setAttribute('aria-label', held ? 'Play the background video' : 'Pause the background video');
    run();
  });
  function close() {
    full.pause(); full.removeAttribute('src'); full.load();
    lb.classList.remove('open'); document.documentElement.style.overflow = '';
    play.focus(); run();
  }
  play.addEventListener('click', function () {
    full.src = v.dataset.src; lb.classList.add('open'); document.documentElement.style.overflow = 'hidden';
    v.pause(); full.play().catch(function () {});
    lb.querySelector('.hv-x').focus();
  });
  lb.querySelector('.hv-x').addEventListener('click', close);
  lb.addEventListener('click', function (e) { if (e.target === lb) close(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && lb.classList.contains('open')) close(); });
})();
</script>
<!-- band:end -->

<div class="neighbour" aria-hidden="true"></div>
</body>
</html>
