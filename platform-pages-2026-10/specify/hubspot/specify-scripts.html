<script>
/* Copies "install Akka from akka.ai" from any .akka-install button. A page can carry the
   script more than once (the footer and the page body both include it); the flag keeps
   one listener. */
(function () {
  if (window.__akkaInstallLine) return;
  window.__akkaInstallLine = true;
  var TEXT = "install Akka from akka.ai";

  function fallback() {
    var a = document.createElement("textarea");
    a.value = TEXT;
    a.setAttribute("readonly", "");
    a.style.position = "fixed";
    a.style.opacity = "0";
    document.body.appendChild(a);
    a.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(a);
  }

  function copy() {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(TEXT).catch(fallback);
    } else {
      fallback();
    }
  }

  document.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("button.akka-install") : null;
    if (!b) return;
    copy();
    var cp = b.querySelector(".akka-install__cp");
    b.classList.add("is-copied");
    if (cp) cp.textContent = "Copied";
    clearTimeout(b._akkaInstallTimer);
    b._akkaInstallTimer = setTimeout(function () {
      b.classList.remove("is-copied");
      if (cp) cp.textContent = "Copy";
    }, 1600);
  });
})();
</script>
<script>
/* ── spd-01-what ── */
/* ── Hero counters ─────────────────────────────────── */
function animateCount(el, target) {
  const dur = 1600, t0 = performance.now();
  (function tick(now) {
    const p = Math.min((now - t0) / dur, 1);
    el.textContent = Math.floor((1 - Math.pow(1 - p, 3)) * target);
    if (p < 1) requestAnimationFrame(tick); else el.textContent = target;
  })(t0);
}
new IntersectionObserver(entries => {
  if (entries[0].isIntersecting)
    document.querySelectorAll('.stat-num').forEach(el => animateCount(el, +el.dataset.target));
}, { threshold: 0.6 }).observe(document.querySelector('.hero-stats'));

/* ── spd-02-specs ── */
/* ── Slide 04 specifications ──────────────────────── */
const specRevealObs = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) e.target.classList.add('visible');
  });
}, { threshold: 0.15 });
document.querySelectorAll('[data-spec="0"], [data-spec="1"], [data-spec="2"], [data-spec="3"]').forEach(el => specRevealObs.observe(el));


/* ── spd-03-weeks ── */
(function() {
  var script = [
    { type:'cmd', text:'/akka:specify "Customer loyalty program with points, tiers, and rewards"', phase:'specify' },
    { type:'ai',  text:'How should points expire? Fixed calendar window, rolling from last activity, or never?' },
    { type:'ok',  text:'[specify] spec.md written \u2714  Branch: 001-loyalty-service' },
    { type:'blank' },

    { type:'cmd', text:'/akka:clarify "Rolling 12-month expiry. Grace period before tier downgrade."', phase:'specify' },
    { type:'ok',  text:'[clarify] spec.md updated \u2714  2 decisions captured', trigger:'spec' },
    { type:'blank' },

    { type:'cmd', text:'/akka:plan "High-perf APIs, read data in views. Host client app in backend."', phase:'specify' },
    { type:'ok',  text:'[plan] plan.md written \u2714  Event Sourced Entities, Views, Endpoints + SPA' },
    { type:'blank' },

    { type:'cmd', text:'/akka:tasks && /akka:implement && /akka:build', phase:'implement' },
    { type:'lines', items: [
      { text:'[tasks] 6 tasks generated, dependency-ordered \u2714', cls:'ok' },
      { text:'[implement] Writing entities, endpoints, views, workflow...', cls:'ai' },
      { text:'[implement] 989 lines across 12 files \u2714  50/50 tests passing', cls:'ok' },
      { text:'[build] mvn compile \u2714  mvn test \u2714  running on :8080', cls:'ok' },
    ], trigger:'arch'},
    { type:'blank' },

    { type:'cmd', text:'/akka:review && /akka:analyze && /akka:deploy', phase:'deploy' },
    { type:'lines', items: [
      { text:'[review] Spec compliance 100% \u2714  Coverage 94%', cls:'ok' },
      { text:'[analyze] Full cross-artifact traceability \u2714', cls:'ok' },
      { text:'[deploy] Container built \u2714  Routes configured \u2714  loyalty.acme.akka.app', cls:'ai' },
      { text:'[deploy] Live on your Akka cloud \u2714  Active-active HA, 3 replicas', cls:'ok' },
    ]},
    { type:'blank' },
    { type:'warn', text:'\u2728 loyalty-service is live in production \u2014 governed, monitored, running.' },
  ];

  var body = document.getElementById('s5TermBody');
  var specCard = document.getElementById('s5Spec');
  var archCard = document.getElementById('s5Arch');
  var props = document.querySelectorAll('.s5-prop');
  var currentPhase = null;
  var cursorEl = null;

  var CMD_CHAR_MS  = 24;
  var PAUSE_AFTER_CMD = 350;
  var WAIT_BEFORE_RESPONSE = 450;
  var PAUSE_AFTER_STEP = 380;

  function scroll() { body.scrollTop = body.scrollHeight; }

  function removeCursor() {
    if (cursorEl) { cursorEl.remove(); cursorEl = null; }
  }

  function addCursor(parent) {
    removeCursor();
    cursorEl = document.createElement('span');
    cursorEl.className = 's5-cursor';
    parent.appendChild(cursorEl);
  }

  function highlightProp(phase) {
    if (phase && phase !== currentPhase) {
      currentPhase = phase;
      props.forEach(function(p) {
        p.classList.toggle('active', p.getAttribute('data-phase') === phase);
      });
    }
  }

  /* Artifact reveal + terminal reset logic */
  var revealQueue = [specCard, archCard];
  var revealIdx = 0;
  var s5Anchored = false;
  var s5Running = false;
  var s5DownCount = 0;
  var s5WrapperEl = document.getElementById('s5-wrapper');

  var s5UpCount = 0;
  var s5State = 'idle'; /* idle | forward | reverse | done */
  var runToken = 0;     /* incremented on reset to invalidate in-flight typing chains */

  function fillTerminalFull() {
    body.innerHTML = '';
    removeCursor();
    for (var i = 0; i < script.length; i++) {
      var step = script[i];
      if (step.type === 'cmd') {
        var d = document.createElement('div');
        d.className = 's5-tline';
        d.innerHTML = '<span class="prompt">$ </span><span class="cmd">' + step.text + '</span>';
        body.appendChild(d);
      } else if (step.type === 'blank') {
        var d = document.createElement('div');
        d.className = 's5-tline';
        d.innerHTML = '&nbsp;';
        body.appendChild(d);
      } else if (step.type === 'lines') {
        for (var j = 0; j < step.items.length; j++) {
          var item = step.items[j];
          var c = item.cls === 'ok' ? 'success' : 'ai';
          instantLine(c, item.text, j === 0);
        }
      } else {
        var cls = step.type === 'ok' ? 'success' : (step.type === 'warn' ? 'warn' : step.type);
        instantLine(cls, step.text, true);
      }
    }
    var end = document.createElement('div');
    end.className = 's5-tline';
    end.innerHTML = '<span class="prompt">$ </span>';
    body.appendChild(end);
    addCursor(end);
  }

  function resetS5() {
    runToken++;
    body.innerHTML = '';
    removeCursor();
    specCard.classList.remove('show');
    archCard.classList.remove('show');
    revealIdx = 0;
    s5DownCount = 0;
    s5UpCount = 0;
    currentPhase = null;
    props.forEach(function(p) { p.classList.remove('active'); });
    s5Running = false;
    s5Anchored = false;
    s5State = 'idle';
  }

  /* force: skip the mid-run guard, so a click can finish the sequence whether
     or not the typing has started yet. */
  function completeS5(force) {
    if (s5State === 'done') return;
    if (!force && (s5State !== 'forward' || !s5Running)) return;
    runToken++;
    fillTerminalFull();
    specCard.classList.add('show');
    archCard.classList.add('show');
    revealIdx = revealQueue.length;
    s5DownCount = 0;
    currentPhase = null;
    props.forEach(function(p) { p.classList.remove('active'); });
    s5Running = false;
    s5State = 'done';
  }

  function checkS5() {
    var wTop = s5WrapperEl.offsetTop;
    var wHeight = s5WrapperEl.offsetHeight;
    var wBottom = wTop + wHeight;
    var scrollY = window.scrollY;
    var viewBottom = scrollY + window.innerHeight;

    var progress = (scrollY - wTop) / (wHeight - window.innerHeight);

    var pastBelow = scrollY > wBottom;
    var pastAbove = viewBottom < wTop;
    var inView = !pastAbove && !pastBelow;
    var anchored = progress >= 0 && progress <= 1;

    if (pastAbove || pastBelow) {
      if (s5State !== 'idle') resetS5();
      return;
    }

    if (s5State === 'idle' && inView) {
      /* Wrapper just entered viewport — determine direction */
      if (viewBottom > wBottom - 10) {
        /* Bottom of wrapper is near bottom of viewport = scrolling up from below */
        s5State = 'reverse';
        s5Running = true;
        s5Anchored = true;
        fillTerminalFull();
        specCard.classList.add('show');
        archCard.classList.add('show');
        revealIdx = 2;
        s5UpCount = 0;
      } else {
        /* Forward entry — section in view (nav jump or scroll-in from above) */
        s5State = 'forward';
        s5Anchored = true;
        s5Running = true;
        var t = runToken;
        setTimeout(function() { run(0, t); }, 600);
      }
    }

    /* Forward: detect when we first anchor */
    if (s5State === 'forward' && anchored && !s5Anchored) {
      s5Anchored = true;
      if (!s5Running) {
        s5Running = true;
        var t2 = runToken;
        setTimeout(function() { run(0, t2); }, 600);
      }
    }

    /* Forward: also reveal cards by scroll progress so fast scrollers see them */
    if (s5State === 'forward' && anchored) {
      if (progress >= 0.35 && !specCard.classList.contains('show')) {
        specCard.classList.add('show');
        if (revealIdx < 1) revealIdx = 1;
      }
      if (progress >= 0.65 && !archCard.classList.contains('show')) {
        archCard.classList.add('show');
        if (revealIdx < 2) revealIdx = 2;
      }
    }

    /* Reverse: peel off artifacts based on scroll progress toward top */
    if (s5State === 'reverse' && anchored) {
      /* progress 1 = bottom of wrapper, 0 = top. As we scroll up, progress decreases */
      if (progress < 0.55 && archCard.classList.contains('show')) {
        archCard.classList.remove('show');
      }
      if (progress < 0.25 && specCard.classList.contains('show')) {
        specCard.classList.remove('show');
      }
    }
  }
  window.addEventListener('scroll', checkS5, { passive: true });

  document.addEventListener('keydown', function(e) {
    if (!s5Anchored) return;

    if (e.key === 'ArrowDown' && s5State === 'forward' && s5Running) {
      e.preventDefault();
      completeS5();
    }

  });

  /* Click anywhere in the console to skip ahead: renders the full terminal
     transcript plus the spec and architecture cards immediately. */
  var terminal = document.querySelector('.s5-terminal');
  if (terminal) {
    terminal.addEventListener('click', function() { completeS5(true); });
    terminal.setAttribute('role', 'button');
    terminal.setAttribute('tabindex', '0');
    terminal.setAttribute('title', 'Click to show the full output');
    terminal.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); completeS5(true); }
    });
  }

  function fireTrigger(t) {
    if (t === 'spec' && !specCard.classList.contains('show')) {
      specCard.classList.add('show');
      if (revealIdx < 1) revealIdx = 1;
    }
    if (t === 'arch' && !archCard.classList.contains('show')) {
      archCard.classList.add('show');
      if (revealIdx < 2) revealIdx = 2;
    }
  }

  function typeText(span, text, charMs, cb, token) {
    var i = 0;
    function tick() {
      if (token !== runToken) return;
      if (i < text.length) {
        span.textContent += text[i]; i++;
        scroll();
        setTimeout(tick, charMs);
      } else { if (cb) cb(); }
    }
    tick();
  }

  var AI_PREFIX_HTML = '<span class="ai-prefix">AI &rarr; </span>';
  var AI_INDENT_HTML = '<span class="ai-indent">       </span>';

  function instantLine(cls, text, isFirst) {
    var div = document.createElement('div');
    div.className = 's5-tline';
    div.innerHTML = (isFirst ? AI_PREFIX_HTML : AI_INDENT_HTML)
      + '<span class="' + cls + '">' + text + '</span>';
    body.appendChild(div);
    scroll();
  }

  function run(idx, token) {
    if (token !== runToken) return;
    if (idx >= script.length) {
      removeCursor();
      var end = document.createElement('div');
      end.className = 's5-tline';
      end.innerHTML = '<span class="prompt">$ </span>';
      body.appendChild(end);
      addCursor(end);
      scroll();
      props.forEach(function(p) { p.classList.remove('active'); });
      s5Running = false;
      s5State = 'done';
      return;
    }

    var step = script[idx];
    if (step.phase) highlightProp(step.phase);

    if (step.type === 'blank') {
      var bl = document.createElement('div');
      bl.className = 's5-tline';
      bl.innerHTML = '&nbsp;';
      body.appendChild(bl);
      scroll();
      setTimeout(function() { run(idx + 1, token); }, 120);

    } else if (step.type === 'cmd') {
      var line = document.createElement('div');
      line.className = 's5-tline';
      line.innerHTML = '<span class="prompt">$ </span>';
      var cmdSpan = document.createElement('span');
      cmdSpan.className = 'cmd';
      line.appendChild(cmdSpan);
      body.appendChild(line);
      addCursor(line);
      scroll();
      typeText(cmdSpan, step.text, CMD_CHAR_MS, function() {
        if (token !== runToken) return;
        removeCursor();
        setTimeout(function() { run(idx + 1, token); }, PAUSE_AFTER_CMD);
      }, token);

    } else if (step.type === 'ai' || step.type === 'ok' || step.type === 'warn') {
      var clsMap = { ai:'ai', ok:'success', warn:'warn' };
      setTimeout(function() {
        if (token !== runToken) return;
        instantLine(clsMap[step.type], step.text, true);
        if (step.trigger) fireTrigger(step.trigger);
        setTimeout(function() { run(idx + 1, token); }, PAUSE_AFTER_STEP);
      }, WAIT_BEFORE_RESPONSE);

    } else if (step.type === 'lines') {
      setTimeout(function() {
        if (token !== runToken) return;
        var clsMap = { ok:'success', ai:'ai' };
        step.items.forEach(function(item, i) {
          instantLine(clsMap[item.cls] || 'success', item.text, i === 0);
        });
        if (step.trigger) fireTrigger(step.trigger);
        setTimeout(function() { run(idx + 1, token); }, PAUSE_AFTER_STEP);
      }, WAIT_BEFORE_RESPONSE);
    }
  }

  var revObs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) {
      if (e.isIntersecting) e.target.classList.add('visible');
    });
  }, { threshold: 0.15 });
  document.querySelectorAll('#s5 .s5-reveal').forEach(function(el) { revObs.observe(el); });
})();

/* ── Fit the two artifact bodies to their boxes ───────────────────────────────
   .s5-artifact clips with overflow:hidden and the boxes are flex-compressed as
   the viewport shortens, which cut the spec's VIEWS block and the architecture's
   bottom row. Measure each body unscaled and zoom it to the space its box
   actually has. Static breakpoints cannot track a continuously varying height. */
(function(){
  function fitOne(bodySel){
    var body = document.querySelector(bodySel);
    if (!body) return;
    var card = body.closest('.s5-artifact');
    if (!card) return;
    var header = card.querySelector('.s5-artifact-header');
    /* Zooming the body changes the flex layout, which changes the box height,
       so a single pass does not converge. Iterate until it fits. */
    /* Card height is now set by the column, not by this content, so one
       measured pass converges. */
    body.style.zoom = '';
    var avail = card.clientHeight - (header ? header.offsetHeight : 0);
    var need  = body.scrollHeight;
    if (avail > 0 && need > avail) {
      body.style.zoom = Math.max(0.45, avail / need).toFixed(3);
    }
  }
  /* The architecture body holds an SVG at width:100%. Under CSS zoom, percentage
     widths re-resolve against the divided containing block, so the rendered size
     barely changes. Constrain its height directly and let the viewBox aspect
     ratio pick the width. */
  function fitArch(){
    var card = document.querySelector('#s5Arch');
    if (!card) return;
    var body = card.querySelector('.s5-arch-body');
    var svg  = body && body.querySelector('svg');
    if (!body || !svg) return;
    body.style.zoom = '';
    svg.style.maxHeight = '';
    var header = card.querySelector('.s5-artifact-header');
    var cs = getComputedStyle(body);
    var pad = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
    var avail = card.clientHeight - (header ? header.offsetHeight : 0) - pad;
    /* Keep width:100% from the stylesheet. width:auto collapses an SVG that sizes
       from its viewBox. Constraining height alone lets preserveAspectRatio scale
       the drawing down inside the box. */
    if (avail > 40) {
      svg.style.maxHeight = Math.floor(avail) + 'px';
    }
  }
  function fit(){
    fitOne('#s5Spec .s5-spec-body');
    fitArch();
  }
  window.addEventListener('load', fit);
  window.addEventListener('resize', fit);
  /* The cards fade in with .show; re-fit once that settles and again later in
     case fonts or the terminal animation change the column height. */
  setTimeout(fit, 600);
  setTimeout(fit, 1600);
  setTimeout(fit, 3000);
})();


/* ── spd-04-factory ── */
/* ── Software factory slide reveals ─────────────────── */
const factObs = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) e.target.classList.add('visible');
  });
}, { threshold: 0.15 });
document.querySelectorAll('.fact-reveal').forEach(el => factObs.observe(el));


/* ── spd-05-sdlc ── */
/* ── SDLC slide: vertical tabs (same pattern as the Verify deck) ── */
(function(){
  var tabsEl = document.getElementById('sdlcTabs');
  if (!tabsEl) return;
  var tabs = [].slice.call(document.querySelectorAll('#sdlcTabs .sdlc-tab'));
  var panels = [].slice.call(document.querySelectorAll('#sdlcPanels .sdlc-panel'));
  tabsEl.addEventListener('click', function(e){
    var b = e.target.closest('.sdlc-tab');
    if (!b) return;
    var i = +b.dataset.i;
    tabs.forEach(function(t){ t.classList.toggle('active', t === b); });
    panels.forEach(function(p, k){ p.classList.toggle('active', k === i); });
  });
})();

var sdlcObs = new IntersectionObserver(function(entries){
  entries.forEach(function(e){
    if (e.isIntersecting) e.target.classList.add('visible');
  });
}, { threshold: 0.12 });
document.querySelectorAll('.sdlc-reveal').forEach(function(el){ sdlcObs.observe(el); });

/* Nested harness install tabs inside the AI assistants panel */
(function(){
  var wrap = document.getElementById('hzTabs');
  if (!wrap) return;
  var tabs = [].slice.call(document.querySelectorAll('#hzTabs .hz-tab'));
  var panels = [].slice.call(document.querySelectorAll('#hzPanels .hz-panel'));
  wrap.addEventListener('click', function(e){
    var b = e.target.closest('.hz-tab');
    if (!b) return;
    var i = +b.dataset.h;
    tabs.forEach(function(t){ t.classList.toggle('active', t === b); });
    panels.forEach(function(p, k){ p.classList.toggle('active', k === i); });
  });
})();


/* ── spd-06-proof ── */
/* ── Customer results slide reveals ─────────────────── */
const proofObs = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) e.target.classList.add('visible');
  });
}, { threshold: 0.15 });
document.querySelectorAll('.proof-reveal').forEach(el => proofObs.observe(el));


/* ── spd-07-family ── */
/* ── family-platform: reveals + product/component selection ──────────────
   Mirrors the #s-routes behaviour in akka-overview/index.html. The box that
   starts selected comes from the section's data-active, set per deck by the
   registry's "product" key. */
(function () {
  var famObs = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) { if (e.isIntersecting) e.target.classList.add('visible'); });
  }, { threshold: 0.15 });
  document.querySelectorAll('.fam-reveal').forEach(function (el) { famObs.observe(el); });

  var root = document.getElementById('family');
  if (!root) return;
  var picks  = root.querySelectorAll('.rt-pick');
  var comps  = root.querySelectorAll('.rt-comp');
  var bodies = root.querySelectorAll('.rt-panel-body');
  if (!picks.length) return;

  /* bodyKey = which summary shows; boxKey = which product box stays lit. */
  function show(bodyKey, boxKey) {
    picks.forEach(function (p) { p.setAttribute('aria-pressed', String(p.dataset.rt === boxKey)); });
    comps.forEach(function (c) { c.setAttribute('aria-pressed', String(c.dataset.comp === bodyKey)); });
    bodies.forEach(function (b) { b.hidden = (b.dataset.rtBody !== bodyKey); });
  }

  picks.forEach(function (p) {
    p.addEventListener('click', function () { show(p.dataset.rt, p.dataset.rt); });
    p.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); show(p.dataset.rt, p.dataset.rt); }
    });
  });

  comps.forEach(function (c) {
    c.addEventListener('click', function (e) {
      e.stopPropagation();
      show(c.dataset.comp, 'sdk');
    });
    c.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault(); e.stopPropagation();
        show(c.dataset.comp, 'sdk');
      }
    });
  });

  // This deck's own product starts selected; fall back to Specify.
  var active = root.dataset.active || 'specify';
  if (!root.querySelector('.rt-pick[data-rt="' + active + '"]')) active = 'specify';
  show(active, active);
})();


/* ── spd-08-close ── */
const closingObserver = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) e.target.classList.add('visible');
  });

      var pinned = null;
      var kids = el.querySelectorAll('*');
      for (var k = 0; k < kids.length; k++) {
        if (getComputedStyle(kids[k]).position === 'sticky') { pinned = kids[k]; break; }
      }
      /* Only anchor where the pinned child comes to rest at the header line. Some
         wrappers pin a full-viewport child at top:0, which leaves its first 78px
         under the header; passing through that is one thing, but landing on it
         would park the reader on a clipped title. */
      if (pinned && Math.abs(parseFloat(getComputedStyle(pinned).top) - HDR) > 4) return;
      var limit = pinned ? h - pinned.offsetHeight : h - band;
      if (getComputedStyle(el).position === 'static') el.style.position = 'relative';
      for (var y = band; y <= limit + 4 && y + 40 < h; y += band) {
        var a = document.createElement('div');
        a.className = 'r4-snap';
        a.style.cssText = 'position:absolute;left:0;width:1px;height:1px;'
          + 'pointer-events:none;visibility:hidden;top:' + y + 'px;'
          + 'scroll-snap-align:start;scroll-margin-top:' + HDR + 'px;';
        el.appendChild(a);
      }
    });
  }

  function schedule(){
    /* First rAF pair handles the fast-path (CSS parsed, DOM laid out).
       Additional timeouts catch late-loading images, fonts, iframes that
       change section heights after load. */
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      fitAll(); snapAnchors();
    }); });
    setTimeout(function(){ fitAll(); snapAnchors(); }, 400);
    setTimeout(function(){ fitAll(); snapAnchors(); }, 1200);
  }

  if (document.readyState === 'complete') schedule();
  else window.addEventListener('load', schedule);

  var raf = 0;
  window.addEventListener('resize', function(){
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(function(){
      document.querySelectorAll(SEL).forEach(reset);
      requestAnimationFrame(function(){ fitAll(); snapAnchors(); });
    });
  });
})();
</script>
