<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Band preview</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
.bidx{--black:#000;--medium-black:#141414;--white:#F1F1F1;--yellow:#FFCE4A;--blue:#00DBDD;--soft-grey:#A6A6A6;--medium-grey:#4E4E4E;
 --display:'Instrument Sans',-apple-system,sans-serif;--mono:'JetBrains Mono',ui-monospace,Consolas,monospace;--measure:1440px;
 background:var(--black);color:var(--white);font-family:var(--display)}
.bidx *{box-sizing:border-box}.bidx a{color:inherit;text-decoration:none}
.bidx__band{position:relative;overflow:hidden;margin-top:15px;min-height:520px;display:flex}
.bidx__band img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  display:block;z-index:0}
.bidx__wash{position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,
  rgba(7,18,35,.88) 0%,rgba(7,18,35,.72) 30%,rgba(7,18,35,.26) 60%,rgba(7,18,35,.12) 100%)}
.bidx__bandinner{position:relative;z-index:2;max-width:var(--measure);width:100%;
  margin:0 auto;padding:88px 66px;align-self:center}
.bidx__eyebrow{font-size:13px;font-weight:400;letter-spacing:.15em;line-height:1;
  text-transform:uppercase;color:var(--soft-grey);margin:0 0 21px}
.bidx__bandtitle{font-size:clamp(32px,4vw,48px);line-height:1.08;font-weight:600;
  letter-spacing:-0.02em;color:var(--white);max-width:760px;margin:0;text-wrap:balance}
.bidx__bandtitle a:hover{color:var(--blue)}
.bidx__dek{font-size:18px;line-height:1.5;color:var(--soft-grey);max-width:620px;margin:20px 0 0}
.bidx__meta{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--soft-grey);
  margin:22px 0 0;font-variant-numeric:tabular-nums}
.bidx__arrow{display:inline-flex;align-items:center;gap:12px;margin-top:26px;
  font-size:17px;font-weight:600;color:var(--blue)}
.bidx__arrow svg{transition:transform .15s ease}
.bidx__arrow:hover svg{transform:translateX(6px)}
</style></head><body><div class="bidx">
<section class="bidx__band"><img src="../blog-band-human-oversight.jpg" alt="">
<div class="bidx__wash"></div><div class="bidx__bandinner">
<p class="bidx__eyebrow">AI &middot; GOVERNANCE</p>
<h2 class="bidx__bandtitle"><a href="#">14 Human Oversight Patterns for AI Systems</a></h2>
<p class="bidx__dek">We mapped how people oversee AI systems across regulations, customer systems and our own services.</p>
<p class="bidx__meta"><time>November 2, 2026</time></p>
<a class="bidx__arrow" href="#">Read <svg width="26" height="18" viewBox="0 0 26 18" fill="none"><path d="M0.75 9.03H24.25" stroke="currentColor"></path><path d="M17.25 17.03L25.25 9.03L17.25 1.03" stroke="currentColor"></path></svg></a>
</div></section></div></body></html>
