<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Band: 14 Human Oversight Patterns</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1792px;height:592px;background:#050810;overflow:hidden}
.band{position:relative;width:1792px;height:592px;overflow:hidden;background:#050810}
.col{position:absolute;top:0;width:330px;display:flex;flex-direction:column;gap:10px}
.t{position:relative;overflow:hidden;border-radius:7px;border:1px solid rgba(255,255,255,.08);background:#0b0f18;flex:none}
.t img{position:absolute;display:block;max-width:none;filter:brightness(.82)}
.band::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,
 rgba(3,6,14,1) 0%,rgba(3,6,14,1) 34%,rgba(3,6,14,.7) 41%,rgba(3,6,14,.38) 49%,rgba(3,6,14,.1) 58%,rgba(3,6,14,0) 66%)}
</style></head><body><div class="band" id="b"></div>
<script>
// [source, x, y, w, h] in the 2000-px-wide display space of each 2880x1800 capture; tile width in css px.
const S=n=>`sources-${n}.png`;
const COLS=[
 {x:770,top:12,tiles:[
  [S('band-halt-votes'),405,783,1017,277,330],
  [S('d-decision-review'),1465,358,287,287,230],
  [S('appeal-2'),1300,730,615,165,330],
  [S('band-halt-allpass'),405,330,1017,180,330],
  [S('d-exception'),435,775,960,185,330]]},
 {x:1115,top:-3,tiles:[
  [S('d-override'),1300,745,620,235,330],
  [S('d-exception'),435,408,975,235,330],
  [S('band-att'),430,695,812,150,330],
  [S('d-match-adjudication'),425,405,805,115,330],
  [S('d-oversight-quality'),430,370,790,145,330],
  [S('d-outcome-reconciliation'),435,740,780,175,330],
  [S('d-match-adjudication'),435,630,780,165,330]]},
 {x:1460,top:8,tiles:[
  [S('s-outcome-reconciliation'),1295,850,625,300,330],
  [S('appeal-2'),425,880,790,130,330],
  [S('d-decision-review'),1300,935,615,215,330],
  [S('d-triage'),430,330,790,115,330],
  [S('d-oversight-quality'),430,680,790,215,330],
  [S('d-attestation'),430,425,790,135,330]]}
];
const b=document.getElementById('b');
for(const c of COLS){const d=document.createElement('div');d.className='col';d.style.left=c.x+'px';d.style.top=c.top+'px';
 for(const [s,x,y,w,h,tw] of c.tiles){const k=tw/w,t=document.createElement('div');t.className='t';t.style.width=tw+'px';t.style.height=Math.round(h*k)+'px';
  const i=document.createElement('img');i.src=s;i.style.width=(2000*k)+'px';i.style.left=(-x*k)+'px';i.style.top=(-y*k)+'px';t.appendChild(i);d.appendChild(t);}
 b.appendChild(d);}
</script></body></html>
