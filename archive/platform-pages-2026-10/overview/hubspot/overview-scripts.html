<script>
    (function(){
      var SCALE = 0.9;   // keep in sync with .rsc-diagram .scene transform:scale()
      var DEFS = '<defs><marker id="rsc-ah" markerWidth="9" markerHeight="9" refX="7.5" refY="3.4" orient="auto">'
               + '<path d="M0,0 L8,3.4 L0,6.8 Z" fill="#FFCE4A"/></marker></defs>';
      var WIRES = [
        {from:'.ext-left',      to:'#rsc-gw',      label:'model calls'},
        {from:'.ext-left',      to:'#rsc-trace',   label:'traces'},
        {from:'#rsc-consumers', to:'#rsc-agents',  label:'requests'},
        {from:'.platform',      to:'#rsc-sem',     label:'integrations'}
      ];
      function draw(){
        var scene = document.querySelector('.rsc-diagram .scene');
        var svg = document.getElementById('rsc-wires');
        var scaler = document.querySelector('.rsc-scaler');
        if(!scene || !svg) return;
        // position in the scene's own (unscaled) coordinate space via the offset chain —
        // immune to CSS transform:scale() AND the mobile zoom fit, so arrows stay correct
        // both in-page and inside the zoom lightbox clone.
        function rel(el){
          var x=0, y=0, n=el;
          while(n && n !== scene){ x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; }
          return {left:x, top:y, right:x+el.offsetWidth, bottom:y+el.offsetHeight,
                  width:el.offsetWidth, height:el.offsetHeight};
        }
        function cyOf(sel){ var r = rel(scene.querySelector(sel)); return (r.top + r.bottom)/2; }
        function centerOn(sel, cy){
          var b = scene.querySelector(sel); if(!b) return;
          b.style.alignSelf='start'; b.style.height=''; b.style.marginTop='0px';
          var r = rel(b);
          b.style.marginTop = (cy - r.top - r.height/2) + 'px';
        }
        // slide a container so one of its children (not the whole box) centers on cy
        function alignChildOn(containerSel, childSel, cy){
          var c = scene.querySelector(containerSel); if(!c) return;
          c.style.alignSelf='start'; c.style.marginTop='0px';
          var chr = rel(scene.querySelector(childSel));
          c.style.marginTop = (cy - (chr.top + chr.height/2)) + 'px';
        }
        alignChildOn('.ext-right', '#rsc-consumers', cyOf('#rsc-agents'));
        centerOn('.ext-left', (cyOf('#rsc-gw') + cyOf('#rsc-trace'))/2 - 12);
        var parts = DEFS;
        WIRES.forEach(function(w){
          var src = scene.querySelector(w.from), el = scene.querySelector(w.to);
          if(!src || !el) return;
          var s = rel(src), r = rel(el);
          var y = r.top + r.height/2, startX, endX, pointsRight = s.left < r.left;
          if(pointsRight){ startX=s.right+2; endX=r.left-1; }
          else { startX=s.left-2; endX=r.right+1; }
          parts += '<line x1="'+startX+'" y1="'+y+'" x2="'+endX+'" y2="'+y+'" stroke="#FFCE4A" '
                 + 'stroke-width="2.1" stroke-dasharray="5 4" marker-end="url(#rsc-ah)" opacity="0.9"/>';
          parts += '<text x="'+startX+'" y="'+(y-7)+'" text-anchor="'+(pointsRight?'start':'end')+'">'+w.label+'</text>';
        });
        svg.setAttribute('viewBox','0 0 '+scene.offsetWidth+' '+scene.offsetHeight);
        svg.innerHTML = parts;
        // keep the reserved footprint in sync, then reveal (positioned, no visible jump)
        if(scaler){ scaler.style.width=(scene.offsetWidth*SCALE)+'px'; scaler.style.height=(scene.offsetHeight*SCALE)+'px'; }
        scene.style.opacity = '1';
      }
      window.addEventListener('load', draw);
      window.addEventListener('resize', draw);
      setTimeout(draw, 400);
    })();
    </script>
<script>
/* Copies "install Akka from akka.ai" from any .akka-install button. A page can carry the
   script more than once (the footer and the page body both include it); the flag keeps
   one listener. */
(function () {
  if (window.__akkaInstallLine) return;
  window.__akkaInstallLine = true;
  var TEXT = "install Akka from akka.ai";

  function fallback() {
    var a = document.createElement("textarea");
    a.value = TEXT;
    a.setAttribute("readonly", "");
    a.style.position = "fixed";
    a.style.opacity = "0";
    document.body.appendChild(a);
    a.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(a);
  }

  function copy() {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(TEXT).catch(fallback);
    } else {
      fallback();
    }
  }

  document.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("button.akka-install") : null;
    if (!b) return;
    copy();
    var cp = b.querySelector(".akka-install__cp");
    b.classList.add("is-copied");
    if (cp) cp.textContent = "Copied";
    clearTimeout(b._akkaInstallTimer);
    b._akkaInstallTimer = setTimeout(function () {
      b.classList.remove("is-copied");
      if (cp) cp.textContent = "Copy";
    }, 1600);
  });
})();
</script>
<script>
  // reveal on scroll
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
  }, { threshold: 0.12 });
  document.querySelectorAll('.reveal, .s13-reveal, .pkg-reveal, .pkg-tier').forEach(el => io.observe(el));

  /* #platform flywheels — the cake's chip lists swap for the loop each box
     runs. Never automatic: the reader gets to read the slide as it stands, and the
     flywheels run only on a click or after a few deliberate wheel notches.
     Guarded and self-contained: a throw here must not abandon the block and take
     the deck's keyboard nav with it (see HUBSPOT_PORT_RULES). */
  (function(){
    const sec = document.getElementById('platform');
    if (!sec) return;

    const HOLD_PX = 420;          // ≈ 4 wheel notches; also fair on a trackpad
    let revealed = false, acc = 0;

    function reveal(){ revealed = true; acc = 0; sec.classList.add('revealed'); }
    function reset(){  revealed = false; acc = 0; sec.classList.remove('revealed'); }

    function mostlyInView(){
      const r = sec.getBoundingClientRect(), vh = window.innerHeight;
      const vis = Math.min(r.bottom, vh) - Math.max(r.top, 0);
      return vis > 0 && vis / Math.min(r.height, vh) >= 0.6;
    }

    /* Hold the reader on the slide for a few downward notches, then run the
       flywheels. The hold is necessary rather than cosmetic: scroll-snap-stop is
       `always` on this deck, so one notch would otherwise carry the reader to the
       next slide before any count could accumulate. Keyboard nav is never
       intercepted, so PgDn/arrows always leave immediately. */
    window.addEventListener('wheel', function(e){
      if (!mostlyInView()) return;
      // Downward notches run the flywheels; upward notches on a revealed slide put
      // it back. Any other direction releases the count and the reader leaves.
      const holding = revealed ? e.deltaY < 0 : e.deltaY > 0;
      if (!holding) { acc = 0; return; }
      e.preventDefault();
      acc += e.deltaY;
      if (acc >= HOLD_PX) reveal();
      else if (acc <= -HOLD_PX) reset();
    }, { passive: false });

    // click the cake to run or replay it by hand; scoped so stray clicks elsewhere
    // on the slide cannot fire it during navigation
    const cake = sec.querySelector('.cake-wrap');
    if (cake) cake.addEventListener('click', () => { revealed ? reset() : reveal(); });
  })();

  /* routing slide: pick a product box, swap the summary on the right */
  (function(){
    var picks  = document.querySelectorAll('#explore .rt-pick');
    var comps  = document.querySelectorAll('#explore .rt-comp');
    var bodies = document.querySelectorAll('#explore .rt-panel-body');
    if (!picks.length) return;

    /* bodyKey = which summary to show; boxKey = which product box stays lit.
       Selecting an SDK component keeps the SDK box lit. */
    function show(bodyKey, boxKey){
      picks.forEach(function(p){ p.setAttribute('aria-pressed', String(p.dataset.rt === boxKey)); });
      comps.forEach(function(c){ c.setAttribute('aria-pressed', String(c.dataset.comp === bodyKey)); });
      bodies.forEach(function(b){ b.hidden = (b.dataset.rtBody !== bodyKey); });
    }

    picks.forEach(function(p){
      p.addEventListener('click', function(){ show(p.dataset.rt, p.dataset.rt); });
      p.addEventListener('keydown', function(e){
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); show(p.dataset.rt, p.dataset.rt); }
      });
    });

    comps.forEach(function(c){
      c.addEventListener('click', function(e){
        e.stopPropagation();               // don't also re-select the SDK box
        show(c.dataset.comp, 'sdk');
      });
      c.addEventListener('keydown', function(e){
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault(); e.stopPropagation();
          show(c.dataset.comp, 'sdk');
        }
      });
    });

    // Initial selection (cake markup is neutral; synced from family-platform).
    var rootEl = document.getElementById('explore');
    var active = (rootEl && rootEl.dataset.active) || 'specify';
    if (!document.querySelector('#explore .rt-pick[data-rt="' + active + '"]')) active = 'specify';
    show(active, active);
  })();

  // count-up for proof stats
  function countUp(el){
    const target = +el.dataset.count; let t0 = null;
    function tick(now){ if(t0===null) t0=now; const p=Math.min(1,(now-t0)/1100); el.textContent=Math.round(target*(1-Math.pow(1-p,3))); if(p<1) requestAnimationFrame(tick); }
    requestAnimationFrame(tick);
  }
  const cio = new IntersectionObserver((es) => { es.forEach(e => { if(e.isIntersecting){ countUp(e.target); cio.unobserve(e.target); } }); }, { threshold: 0.4 });
  document.querySelectorAll('.cnt').forEach(el => cio.observe(el));

  // section nav
  const secs = [...document.querySelectorAll('section')];
  // offsetTop is relative to offsetParent. On HubSpot the deck lives inside
  // positioned wrapper divs (.overview-content etc.), so offsetTop measures
  // from the wrapper, not the document. window.scrollTo needs an absolute
  // document position — walk the offsetParent chain to get it.
  function docTop(el) {
    let y = 0;
    while (el) { y += el.offsetTop; el = el.offsetParent; }
    return y;
  }
  function go(dir){
    const HDR = 78;
    const y = window.scrollY;
    const targets = secs.map(docTop);
    const currentY = y + HDR;
    if (dir > 0){
      const n = targets.find(t => t > currentY + 20);
      if (n != null) {
        window.scrollTo({top: Math.max(0, n - HDR), behavior:'smooth'});
      } else {
        // No more sections above current — the CTA/last slide is showing.
        // PgDn should continue down to the FOOTER (page bottom), not stop.
        const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
        if (y < maxScroll - 10) window.scrollTo({top: maxScroll, behavior:'smooth'});
      }
    } else {
      const prev = [...targets].reverse().find(t => t < currentY - 20);
      if (prev != null) window.scrollTo({top: Math.max(0, prev - HDR), behavior:'smooth'});
    }
  }

  /* All that survives of the #s-morph block: the deck's PgDn/PgUp nav. The rest
     drove an animation on a slide the efficiency redesign removed. Keep this
     registration free of any lookup that can return null — anything that throws
     here silently disables keyboard navigation for the whole deck. */
  window.addEventListener('keydown', (e) => {
    const fwd = ['PageDown','ArrowDown','ArrowRight',' '].includes(e.key);
    const back = ['PageUp','ArrowUp','ArrowLeft'].includes(e.key);
    if (!fwd && !back) return;
    e.preventDefault(); go(fwd ? 1 : -1);
  });

  // resilience demo (ported from 11-resilience/slide.js) — reveal + expand toggle + iframe fit
  (function() {
    var revObs = new IntersectionObserver(function(entries) {
      entries.forEach(function(e) {
        if (e.isIntersecting) e.target.classList.add('visible');
      });
    }, { threshold: 0.15 });
    document.querySelectorAll('#resilience .s6-reveal').forEach(function(el) { revObs.observe(el); });

    var frame = document.querySelector('#resilience .s6-frame-wrap');
    var toggle = document.querySelector('#resilience .s6-expand-toggle');
    if (frame && toggle) {
      toggle.addEventListener('click', function() {
        var expanded = frame.classList.toggle('s6-expanded');
        toggle.textContent = expanded ? '-' : '+';
        toggle.setAttribute('aria-label', expanded ? 'Collapse resilience tester' : 'Expand resilience tester');
        toggle.setAttribute('aria-expanded', expanded ? 'true' : 'false');
      });
    }

    // Dynamically fit the iframe so the tester content fits vertically without a
    // scrollbar at any viewport. The static 119%/scale(0.84) works on large
    // screens but leaves a scrollbar on smaller ones. Measure the tester's
    // natural content height on load and compute the scale needed to fit.
    var iframe = document.querySelector('#resilience .s6-frame-wrap iframe');
    if (iframe) {
      var lastScale = null;
      function fitIframe() {
        var wrap = iframe.parentElement;
        if (!wrap) return;
        var doc;
        try { doc = iframe.contentDocument; } catch (e) { return; }
        if (!doc || !doc.body) return;
        var wrapH = wrap.clientHeight;
        var wrapW = wrap.clientWidth;
        if (wrapH < 40 || wrapW < 40) return;
        // Reset transforms so we measure natural
        iframe.style.width = ''; iframe.style.height = ''; iframe.style.transform = '';
        var contentH = Math.max(doc.body.scrollHeight, doc.documentElement.scrollHeight);
        var contentW = Math.max(doc.body.scrollWidth,  doc.documentElement.scrollWidth);
        // Choose the tighter of vertical / horizontal fit; cap at 1 (never enlarge)
        var scale = Math.min(1, wrapH / contentH, wrapW / contentW);
        // Add a tiny safety margin so no scrollbar at the rounding boundary
        scale = Math.max(0.3, scale * 0.98);
        var inv = 100 / scale;
        iframe.style.width = inv + '%';
        iframe.style.height = inv + '%';
        iframe.style.transform = 'scale(' + scale + ')';
        iframe.style.transformOrigin = 'top left';
        lastScale = scale;
      }
      iframe.addEventListener('load', function(){
        // rAFs let the iframe's inner layout settle before measuring
        requestAnimationFrame(function(){ requestAnimationFrame(fitIframe); });
      });
      var rafId = 0;
      window.addEventListener('resize', function(){
        cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(fitIframe);
      });
      // Also refit when the expand toggle changes the frame size
      if (toggle) toggle.addEventListener('click', function(){
        requestAnimationFrame(function(){ requestAnimationFrame(fitIframe); });
      });
      // In case iframe was already loaded (cached), attempt once
      if (iframe.contentDocument && iframe.contentDocument.readyState === 'complete') {
        requestAnimationFrame(function(){ requestAnimationFrame(fitIframe); });
      }
    }
  })();
</script>
<script>
(function(){
  var mq = window.matchMedia('(max-width:640px)');
  var sel = '.rsc-diagram, .cake-wrap';
  var graphics = Array.prototype.slice.call(document.querySelectorAll(sel));

  // fullscreen overlay — append inside the deck wrapper (if present, e.g. on
  // HubSpot) so the scoped .overview-content CSS matches. Falls back to body
  // for the standalone GitHub Pages build.
  var ov = document.createElement('div');
  ov.id = 'gzoom';
  ov.innerHTML = '<div id="gzoom-tip">Pinch to zoom · drag to pan</div>'
               + '<button id="gzoom-x" aria-label="Close">✕</button>'
               + '<div id="gzoom-scroll"></div>';
  var host = document.querySelector('.overview-content') || document.body;
  host.appendChild(ov);
  var scroll = ov.querySelector('#gzoom-scroll');
  function closeZoom(){ ov.classList.remove('on'); scroll.innerHTML=''; document.body.style.overflow=''; }
  function openZoom(g){
    var clone = g.cloneNode(true);
    clone.style.zoom = ''; clone.classList.remove('gz-fit');   // full natural size in the overlay
    var b = clone.querySelector('.gz-badge'); if(b) b.remove();
    scroll.innerHTML=''; scroll.appendChild(clone);
    ov.classList.add('on'); document.body.style.overflow='hidden'; scroll.scrollTop = 0;
  }
  ov.querySelector('#gzoom-x').addEventListener('click', closeZoom);
  ov.addEventListener('click', function(e){ if(e.target === ov || e.target === scroll) closeZoom(); });
  window.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeZoom(); });

  graphics.forEach(function(g){
    // a "tap to zoom" affordance shown only on small screens
    var badge = document.createElement('div');
    badge.className = 'gz-badge'; badge.textContent = '⤡ Tap to zoom';
    g.parentNode.insertBefore(badge, g.nextSibling);
    g.addEventListener('click', function(){ if(mq.matches) openZoom(g); });
    badge.addEventListener('click', function(){ openZoom(g); });
  });

  function fit(){   // CSS @media handles the shrink deterministically; JS only toggles the tap affordance
    graphics.forEach(function(g){
      if(mq.matches) g.classList.add('gz-fit'); else g.classList.remove('gz-fit');
    });
  }
  window.addEventListener('load', fit);
  window.addEventListener('resize', fit);
  if(mq.addEventListener) mq.addEventListener('change', fit);
  setTimeout(fit, 600);
})();
</script>
<script>
/* === #explore grows into the band it is given === */
(function(){
  /* The cake and its panel are a fixed-size object in a band that keeps getting
     taller. Anchoring the title at the top and centring the row split the slack
     evenly, which read as a hole: 275px between the subtitle and the graphic on
     a 1200px screen. Growing the row into the slack removes the space instead of
     moving it — the mirror of what R4 already does when content is too tall.

     zoom, not transform: zoom reflows, so the row's layout box grows with it and
     the section still measures honestly. A transform would leave the box at its
     unscaled size and put the visible content outside it. */
  var MAX = 1.3;        /* past this the type reads as bloated, not generous */
  var HDR = 78, BOTTOM = 28;

  function bottomBanner(){
    var h = 0, vh = window.innerHeight;
    var all = document.body.getElementsByTagName('*');
    for (var i = 0; i < all.length; i++){
      if (getComputedStyle(all[i]).position !== 'fixed') continue;
      var r = all[i].getBoundingClientRect();
      if (r.bottom >= vh - 2 && r.height > 24 && r.height < vh * 0.5 &&
          r.width > window.innerWidth * 0.6) h = Math.max(h, Math.round(r.height));
    }
    return h;
  }

  function growRoutes(){
    var sec = document.getElementById('explore');
    if (!sec) return;
    /* The graphic only, not the whole row. Zooming the row scaled the panel copy
       with it, which put this slide's body text a third larger than every other
       slide's, and widened the grid until the Verify box collided with the
       panel heading. A width-constrained block lays out in W/k units and renders
       at W, so the cake keeps its column width and grows only downward. */
    var grid = sec.querySelector('.cake-wrap');
    if (!grid) return;
    grid.style.zoom = '';                       /* always measure unzoomed */
    /* Below R5's breakpoint the slide stacks and scrolls; there is no band to
       fill and growing would only push content off the screen. */
    if (window.innerWidth < 1001) return;
    /* If R4 had to scale this section down, there is no slack by definition.
       No attribute at all means R4 is not present (the standalone deck), which
       is not a reason to skip. */
    var fit = sec.getAttribute('data-fit');
    if (fit && fit.indexOf('fits') !== 0) return;

    /* Offset within the section, NOT the viewport. This runs at load with the
       reader still at the top of the deck, where the grid's viewport top is a
       few thousand pixels and every available height comes out negative. When
       the slide is landed the section top sits at HDR, so the band it gets is
       (vh - HDR) less whatever the title and subtitle above it consume. */
    var gridTop = grid.getBoundingClientRect().top - sec.getBoundingClientRect().top;
    var h = grid.getBoundingClientRect().height;
    if (h < 40) return;
    var availH = (window.innerHeight - HDR) - bottomBanner() - BOTTOM - gridTop;

    /* Height is not the only limit. The cake keeps its aspect, so growing it
       taller grows it wider, and its column is fixed by the grid. Left uncapped
       at 1.3 the boxes ran under the panel copy — "views" printed straight
       through "accumulate". The drawing sits narrower than its column, so there
       is real headroom, but only about 1.17x of it. */
    var cake = grid.querySelector('.cake') || grid.firstElementChild;
    var availW = grid.getBoundingClientRect().width;
    var w = cake ? cake.getBoundingClientRect().width : availW;
    var kW = w > 10 ? availW / w : 1;

    var k = Math.min(MAX, availH / h, kW);
    if (k > 1.02) grid.style.zoom = k.toFixed(3);
  }

  function schedule(){
    /* After R4's beats, so data-fit is already written. */
    [0, 600, 1500, 2800].forEach(function(t){ setTimeout(growRoutes, t); });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(growRoutes);
  }
  if (document.readyState === 'complete') schedule();
  else window.addEventListener('load', schedule);
  var raf = 0;
  window.addEventListener('resize', function(){
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(growRoutes);
  });
})();
</script>
<script>
/* === right-column fit for #platform === */
(function(){
  var MIN = 14, MAX = 26, BASE_GAP = 14;

  function inkHeight(el){
    var rg = document.createRange();
    rg.selectNodeContents(el);
    return rg.getBoundingClientRect().height;
  }

  /* Ink height moves in whole lines, so scaling toward the target overshoots and
     undershoots forever: 21.78px gave 437px and 20.25px gave 378px against a
     407px target, and the ratio step just swung between them. Take the largest
     size that still fits, then put the leftover into the gaps between
     paragraphs, which is continuous and lands the last line exactly. */
  function fitPfMsg(){
    var sec = document.querySelector('#platform');
    if (!sec) return;
    var msg = sec.querySelector('.pf-msg');
    var cards = sec.querySelectorAll('.ocard');
    if (!msg || cards.length < 2) return;
    /* Two copy blocks share one grid cell — the platform copy and the flywheel
       copy. Each is measured and spaced on its own, and both take the smaller of
       the two fitted sizes, so the type does not change size when they swap. */
    var paras = Array.prototype.slice.call(msg.querySelectorAll('p'));
    if (!paras.length) return;

    var target = cards[cards.length - 1].getBoundingClientRect().bottom
               - cards[0].getBoundingClientRect().top;
    if (target < 80) return;

    function segsOf(p){ return p.querySelectorAll('.seg'); }
    function setSize(px){
      for (var j = 0; j < paras.length; j++) paras[j].style.fontSize = px.toFixed(2) + 'px';
    }
    function resetGaps(p){
      var s = segsOf(p);
      for (var g = 0; g < s.length; g++){
        s[g].style.marginBottom = (g === s.length - 1) ? '0px' : BASE_GAP + 'px';
      }
    }
    function tallest(){
      var h = 0;
      for (var n = 0; n < paras.length; n++) h = Math.max(h, inkHeight(paras[n]));
      return h;
    }

    for (var r = 0; r < paras.length; r++) resetGaps(paras[r]);

    var lo = MIN, hi = MAX, best = MIN;
    for (var i = 0; i < 14; i++){
      var mid = (lo + hi) / 2;
      setSize(mid);
